  <path d="M100 28C150 28 184 62 184 102C184 142 150 176 100 176C140 150 148 70 100 28Z" fill="#3b2a20" opacity="0.7"/>
  <!-- the cream "spectacles" round the eyes, joined to the muzzle -->
  <path d="M100 76C88 58 50 58 42 86C36 108 52 126 72 124C70 150 86 164 100 164C114 164 130 150 128 124C148 126 164 108 158 86C150 58 112 58 100 76Z" fill="#fbe6b8"/>
  <ellipse cx="68" cy="94" rx="20" ry="22" fill="#4a3528"/><ellipse cx="132" cy="94" rx="20" ry="22" fill="#4a3528"/>
  <circle cx="70" cy="94" r="11" fill="#2b2330"/><circle cx="66.5" cy="90" r="4" fill="#fff"/><circle cx="130" cy="94" r="11" fill="#2b2330"/><circle cx="126.5" cy="90" r="4" fill="#fff"/>
  <ellipse cx="100" cy="126" rx="13" ry="9" fill="#2b2330"/>
  <path d="M100 135V143M100 143Q90 153 80 146M100 143Q110 153 120 146" fill="none" stroke="#2b2330" stroke-width="4" stroke-linecap="round"/>
