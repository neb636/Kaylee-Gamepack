<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>The rice farm</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff5d1"/><stop offset="1" stop-color="#ffe08f"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="low"><path d="M44 104L50 72H70L76 104Z"/></clipPath>
    <!-- one rice ear: a stalk that bends over and droops, two rows of grains -->
    <g id="ear">
      <path d="M0 0C0-10 6-21 18-24C24-25.5 29-23 32-19" fill="none" stroke="#e1a92e" stroke-width="2" stroke-linecap="round"/>
      <g fill="#eba123">
        <ellipse cx="7" cy="-13" rx="3.4" ry="1.9" transform="rotate(-58 7 -13)"/>
        <ellipse cx="12.5" cy="-18.5" rx="3.4" ry="1.9" transform="rotate(-40 12.5 -18.5)"/>
        <ellipse cx="19" cy="-21.5" rx="3.4" ry="1.9" transform="rotate(-16 19 -21.5)"/>
        <ellipse cx="25.5" cy="-21.5" rx="3.4" ry="1.9" transform="rotate(10 25.5 -21.5)"/>
      </g>
      <g fill="#ffc83d">
        <ellipse cx="3.5" cy="-16.5" rx="3.4" ry="1.9" transform="rotate(-62 3.5 -16.5)"/>
        <ellipse cx="9" cy="-23" rx="3.4" ry="1.9" transform="rotate(-42 9 -23)"/>
        <ellipse cx="16.5" cy="-27" rx="3.4" ry="1.9" transform="rotate(-18 16.5 -27)"/>
        <ellipse cx="24.5" cy="-27.5" rx="3.4" ry="1.9" transform="rotate(8 24.5 -27.5)"/>
        <ellipse cx="31.5" cy="-23" rx="3.4" ry="1.9" transform="rotate(40 31.5 -23)"/>
      </g>
      <path d="M15-28C17.5-28.5 19-28.5 21-28" fill="none" stroke="#ffe189" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>

  <!-- far mountains with a low cloud -->
  <path d="M-2 56C10 42 22 34 34 40C44 30 56 24 68 32C80 24 96 26 108 36C114 34 120 36 122 38V66H-2Z" fill="#d3d0f3"/>
  <path d="M68 32C80 24 96 26 108 36C102 40 98 46 96 52C90 44 80 36 68 32Z" fill="#bdb7ec"/>
  <g fill="#fff" opacity="0.9"><rect x="-2" y="48" width="44" height="6" rx="3"/><rect x="76" y="46" width="48" height="6" rx="3"/></g>

  <!-- the rice terraces, stepping down the hill: each a bright field with a lit bank -->
  <path d="M-2 60C24 54 44 56 64 58C84 60 102 56 122 52V120H-2Z" fill="#48a96c"/>
  <path d="M-2 63C24 57 44 59 64 61C84 63 102 59 122 55V120H-2Z" fill="#9be0a5"/>
  <path d="M-2 72C22 66 46 68 66 70C86 72 104 68 122 64V120H-2Z" fill="#48a96c"/>
  <path d="M-2 75C22 69 46 71 66 73C86 75 104 71 122 67V120H-2Z" fill="#73cf86"/>
  <path d="M-2 85C24 79 48 81 68 83C88 85 106 81 122 77V120H-2Z" fill="#48a96c"/>
  <path d="M-2 88C24 82 48 84 68 86C88 88 106 84 122 80V120H-2Z" fill="#8fdc9c"/>
  <path d="M-2 99C26 93 50 95 70 97C90 99 108 95 122 91V120H-2Z" fill="#48a96c"/>
  <path d="M-2 102C26 96 50 98 70 100C90 102 108 98 122 94V120H-2Z" fill="#73cf86"/>
  <g fill="none" stroke="#d2f5d6" stroke-width="2" stroke-linecap="round">
