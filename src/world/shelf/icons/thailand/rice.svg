  </g>
  <g fill="#fff" opacity="0.6"><rect x="8" y="64" width="16" height="2.2" rx="1.1"/><rect x="94" y="70" width="16" height="2.2" rx="1.1"/><rect x="12" y="91" width="18" height="2.2" rx="1.1"/><rect x="90" y="104" width="18" height="2.2" rx="1.1"/></g>
  <g fill="none" stroke="#48a96c" stroke-width="2" stroke-linecap="round">
    <path d="M16 70v-3M22 69v-3M96 77v-3M102 76v-3M24 96v-3M30 95v-3M98 110v-3M104 109v-3"/>
  </g>

  <!-- the golden rice sheaf: drooping ears, stalks tied with a pink bow -->
  <ellipse cx="60" cy="105" rx="22" ry="4" fill="#4b3a8c" opacity="0.16"/>
  <use href="#ear" transform="translate(62 45) rotate(12) scale(0.9)"/>
  <use href="#ear" transform="translate(63 46) rotate(42) scale(0.82)"/>
  <use href="#ear" transform="translate(58 45) scale(-0.9 0.9) rotate(12)"/>
  <use href="#ear" transform="translate(57 46) scale(-0.82 0.82) rotate(42)"/>
  <use href="#ear" transform="translate(60 44) rotate(-30) scale(0.95)"/>
  <path d="M50 72L47 42H73L70 72Z" fill="#f3cd6a"/>
  <path d="M64 72L66 42H73L70 72Z" fill="#dcae4a"/>
  <path d="M52 70L50 44M56 70L55 42M60 70V42M64 70L65 42" stroke="#e1b54e" stroke-width="2" stroke-linecap="round"/>
  <g clip-path="url(#low)">
    <rect x="44" y="72" width="32" height="32" fill="#f3cd6a"/>
    <path d="M66 72H76V104H69Z" fill="#dcae4a"/>
    <path d="M53 74L50 102M57 74L56 102M61 74V102M65 74L66 102" stroke="#e1b54e" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g fill="#fff6cc"><ellipse cx="47.5" cy="103.5" rx="2" ry="1.2"/><ellipse cx="52" cy="104" rx="2" ry="1.2"/><ellipse cx="56.5" cy="104" rx="2" ry="1.2"/><ellipse cx="61" cy="104" rx="2" ry="1.2"/><ellipse cx="65.5" cy="104" rx="2" ry="1.2"/><ellipse cx="70" cy="104" rx="2" ry="1.2"/></g>
  <rect x="48" y="68" width="24" height="7" rx="3.5" fill="#ff8fb8"/>
  <path d="M66 68H68.5C70.4 68 72 69.6 72 71.5C72 73.4 70.4 75 68.5 75H66Z" fill="#e7699c"/>
  <path d="M60 71C54 64 46 65 47 71C48 77 55 76 60 72Z" fill="#ff4f9a"/>
  <path d="M60 71C66 64 74 65 73 71C72 77 65 76 60 72Z" fill="#ff4f9a"/>
  <path d="M60 72C56 76 54 81 52 85L56 85C57 81 58 77 60 73ZM60 72C64 76 66 81 68 85L64 85C63 81 62 77 60 73Z" fill="#d8367f"/>
  <circle cx="60" cy="71.5" r="3" fill="#ff8fb8"/>
  <path d="M50 68.5C51 67 53 66.5 55 67.5" fill="none" stroke="#ff8fc0" stroke-width="2" stroke-linecap="round"/>
