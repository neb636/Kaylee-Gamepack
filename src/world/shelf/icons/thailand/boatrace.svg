<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>The longtail boat race</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe1ee"/><stop offset="1" stop-color="#ffbcd8"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fe3ea"/><stop offset="0.5" stop-color="#4fcad6"/><stop offset="1" stop-color="#22a6bd"/></linearGradient>
    <path id="hullP" d="M0-2H40C47-2 52-6 54-15C54.5-17.5 57-18.5 59-17C60.5-16 60.5-14 60-12C58-2 54 6 46 8H6C2 8-0.5 5 0-2Z"/>
    <clipPath id="hull"><use href="#hullP"/></clipPath>
    <clipPath id="flag"><path d="M102 21C96 19 90 23 84 21V35C90 37 96 33 102 35Z"/></clipPath>
    <!-- one racing longtail, bow to the right: wake, spray, tail pole, engine, hull -->
    <g id="boat">
      <path d="M2 8C-14 9-30 10-46 12C-30 13.5-14 13 4 11Z" fill="#fff" opacity="0.75"/>
      <path d="M-11 9C-19 8.5-26 3-27.5-4.5C-23.5-1-19 1-15 1.5C-18-2-19.5-7-18-12C-15-6.5-11.5-2-8 3Z" fill="#fff"/>
      <circle cx="-29" cy="-9" r="2" fill="#fff"/><circle cx="-22.5" cy="-13" r="1.6" fill="#fff"/><circle cx="-31" cy="-2" r="1.4" fill="#fff"/>
      <path d="M3-4L-14 9" stroke="#6b5d73" stroke-width="3" stroke-linecap="round"/>
      <rect x="-1" y="-9.5" width="12" height="8.5" rx="2.5" fill="#9790ba"/>
      <rect x="-1" y="-9.5" width="12" height="3.2" rx="1.6" fill="#bcb6d6"/>
      <g clip-path="url(#hull)"><rect x="-1" y="-19" width="63" height="28" fill="#a46e4b"/><use href="#hullP" fill="#c99266" transform="translate(-1.5 -3)"/></g>
      <path d="M48 7C55 7 61 3 64-3C66 3 64 8 60 10.5C57 9.5 52 9.5 48 7Z" fill="#fff"/>
      <circle cx="66" cy="-6" r="1.8" fill="#fff"/><circle cx="62" cy="-9" r="1.3" fill="#fff"/>
    </g>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>

  <!-- the sea -->
  <rect y="40" width="120" height="80" fill="url(#sea)"/>
  <rect y="40" width="120" height="2.5" fill="#effcff" opacity="0.85"/>
  <g fill="#fff" opacity="0.5"><rect x="60" y="48" width="16" height="2.2" rx="1.1"/><rect x="44" y="110" width="30" height="2.4" rx="1.1"/><rect x="88" y="104" width="18" height="2.4" rx="1.1"/></g>

  <!-- the finish: a checkered flag on a buoy -->
  <g transform="translate(-4 3)">
    <ellipse cx="102" cy="57" rx="9" ry="2" fill="#1f9cb3" opacity="0.5"/>
    <path d="M102 50V19" stroke="#9790ba" stroke-width="2.4" stroke-linecap="round"/>
    <g clip-path="url(#flag)">
      <rect x="83" y="17" width="20" height="21" fill="#fff"/>
      <path d="M84 17H90V28H84ZM96 17H102V28H96ZM90 28H96V38H90Z" fill="#2b2330"/>
    </g>
    <path d="M94 56C94 50.5 97.5 47.5 102 47.5C106.5 47.5 110 50.5 110 56Z" fill="#ff6b6b"/>
    <path d="M104 47.8C107.5 48.8 110 51.8 110 56H104Z" fill="#d9485e"/>
    <rect x="93.5" y="54" width="17" height="4" rx="2" fill="#fff"/>
  </g>

  <!-- the village kids' boat, a little behind -->
  <g transform="translate(34 64) rotate(-4) scale(0.8)">
    <use href="#boat"/>
    <path d="M0 0.5H40C47 0.5 52-3 54-12" fill="none" stroke="#8fe3c8" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M58-14C53-18 48-15 42-19C44-14 50-12 57-11Z" fill="#8ccfff"/>
    <path d="M58-12C52-12 48-8 42-9C45-5 51-7 57-9Z" fill="#5cc6a6"/>
    <circle cx="58.5" cy="-16.5" r="2.4" fill="#8ccfff"/>
  </g>
  <path d="M6 48H16M2 54H10" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>

  <!-- Kaylee's boat, in front and just ahead, pink ribbons flying -->
  <g transform="translate(24 94) rotate(-4) scale(1.14)">
    <use href="#boat"/>
    <path d="M0 0.5H40C47 0.5 52-3 54-12" fill="none" stroke="#ff8fb8" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M58-14C52-20 46-16 39-21C41-15 48-12 57-11Z" fill="#ff4f9a"/>
    <path d="M58-12C51-13 46-8 39-10C42-5 49-6 57-9Z" fill="#ffc83d"/>
    <path d="M58-10C53-7 49-1 43-1C47 2 53-1 58-7Z" fill="#b9a6f5"/>
    <circle cx="58.5" cy="-16.5" r="2.6" fill="#ff8fb8"/>
  </g>
  <path d="M4 74H16M2 81H12" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>
</svg>
