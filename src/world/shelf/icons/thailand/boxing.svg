<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Muay Thai</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ddf7ee"/><stop offset="1" stop-color="#a9e8d2"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="bag"><rect x="57" y="28" width="30" height="62" rx="13"/></clipPath>
    <clipPath id="baglit"><rect x="50" y="28" width="30" height="62" rx="13"/></clipPath>
    <clipPath id="mitt"><path d="M30 56C34 48 44 44.5 53 46.5C61 48.5 66 55.5 66 65C66 75 60 83.5 50 85C41 86.5 33 84.5 29.5 80C27 76 27 62 30 56Z"/></clipPath>
    <clipPath id="cuff"><rect x="18" y="59" width="18" height="26" rx="6"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>
  <ellipse cx="62" cy="104" rx="32" ry="5" fill="#4b3a8c" opacity="0.14"/>

  <!-- the heavy bag on its chain, swinging from the punch -->
  <g transform="rotate(-6 72 4)">
    <path d="M72-4V15" stroke="#9790ba" stroke-width="3" stroke-linecap="round"/>
    <circle cx="72" cy="18" r="3.2" fill="none" stroke="#9790ba" stroke-width="2.5"/>
    <path d="M70 20.5L62 30M74 20.5L82 30" stroke="#9790ba" stroke-width="2.5" stroke-linecap="round"/>
    <g clip-path="url(#bag)">
      <rect x="55" y="26" width="34" height="66" fill="#d9485e"/>
      <path d="M55 42Q72 45.5 89 42V47Q72 50.5 55 47ZM55 72Q72 75.5 89 72V77Q72 80.5 55 77Z" fill="#efdccd"/>
      <g clip-path="url(#baglit)">
        <rect x="55" y="26" width="34" height="66" fill="#ff6b6b"/>
        <path d="M55 42Q72 45.5 89 42V47Q72 50.5 55 47ZM55 72Q72 75.5 89 72V77Q72 80.5 55 77Z" fill="#fff7f0"/>
      </g>
    </g>
    <path d="M61.5 39.5C61.5 35.5 63.5 32 67 30.5" fill="none" stroke="#ffa3a3" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- the pink glove: a cream cuff, the fist, its thumb -->
  <g clip-path="url(#cuff)">
    <rect x="16" y="57" width="22" height="30" fill="#efdccd"/>
    <rect x="16" y="56" width="18" height="26" rx="6" fill="#fff7f0"/>
  </g>
  <path d="M22 64V76" stroke="#ffc4da" stroke-width="3" stroke-linecap="round"/>
  <g clip-path="url(#mitt)">
    <rect x="25" y="43" width="44" height="46" fill="#e7699c"/>
    <path d="M26 52C30 44 40 40.5 49 42.5C57 44.5 62 51.5 62 61C62 71 56 79.5 46 81C37 82.5 29 80.5 25.5 76C23 72 23 58 26 52Z" fill="#ff8fb8"/>
    <path d="M33 66.5C33 58.5 40 54 48 54C55 54 60 57 60 61C60 64.5 56 66 50.5 65C44.5 64 38.5 65.5 35.5 69.5Z" fill="#e7699c"/>
    <path d="M33 64C33 56 40 51.5 48 51.5C55 51.5 60 54.5 60 58.5C60 62 56 63.5 50.5 62.5C44.5 61.5 38.5 63 35.5 67Z" fill="#ff8fb8"/>
  </g>
  <path d="M38 57C40 54.5 43.5 53.5 47.5 53.5" fill="none" stroke="#ffc4da" stroke-width="2.5" stroke-linecap="round"/>

  <!-- impact stars bursting out -->
  <path d="M60 52L57 47M58 77L54.5 81.5M64 50L64.5 45" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <g transform="translate(52 38) rotate(-12) scale(1.15)" stroke-linejoin="round" stroke-width="1.5">
    <path d="M0-6L1.5-2.5L5.5-2L2.5 1L3.5 5L0 3L-3.5 5L-2.5 1L-5.5-2L-1.5-2.5Z" fill="#ffc83d" stroke="#ffc83d"/>
    <path d="M0-6L1.5-2.5L5.5-2L2.5 1L3.5 5L0 3Z" fill="#eba123" stroke="#eba123"/>
  </g>
  <g transform="translate(48 92) rotate(15) scale(0.85)" stroke-linejoin="round" stroke-width="1.5">
    <path d="M0-6L1.5-2.5L5.5-2L2.5 1L3.5 5L0 3L-3.5 5L-2.5 1L-5.5-2L-1.5-2.5Z" fill="#ffc83d" stroke="#ffc83d"/>
    <path d="M0-6L1.5-2.5L5.5-2L2.5 1L3.5 5L0 3Z" fill="#eba123" stroke="#eba123"/>
  </g>
  <path d="M40 30l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5z" fill="#fff"/>
</svg>
