<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Floating football</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff5d1"/><stop offset="1" stop-color="#ffe08f"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fe3ea"/><stop offset="1" stop-color="#3fc1cf"/></linearGradient>
    <clipPath id="pitch"><path d="M28 60H92L106 86H14Z"/></clipPath>
    <clipPath id="ball"><circle r="14"/></clipPath>
    <path id="pent" d="M0-8.6L4.6-11.6L3.4-16H-3.4L-4.6-11.6Z"/>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>

  <!-- stilt houses far away -->
  <g fill="#c4cff0">
    <path d="M4 50L14 43L24 50Z"/><rect x="6" y="50" width="16" height="8"/><path d="M8 58v8M20 58v8" stroke="#c4cff0" stroke-width="2"/>
    <path d="M96 48L107 40L118 48Z"/><rect x="98" y="48" width="18" height="9"/><path d="M100 57v9M114 57v9" stroke="#c4cff0" stroke-width="2"/>
  </g>

  <!-- the sea -->
  <rect y="64" width="120" height="56" fill="url(#sea)"/>
  <rect y="64" width="120" height="2.5" fill="#effcff" opacity="0.85"/>
  <g fill="#fff" opacity="0.55"><rect x="6" y="104" width="22" height="2.4" rx="1.2"/><rect x="86" y="108" width="24" height="2.4" rx="1.2"/></g>

  <!-- the floating pitch: green stripes, white lines, a wooden edge -->
  <ellipse cx="60" cy="95" rx="50" ry="3.5" fill="#1f9cb3" opacity="0.45"/>
  <path d="M14 86H106V92C106 93.5 105 94 104 94H16C15 94 14 93.5 14 92Z" fill="#a46e4b"/>
  <path d="M14 86H106V89H14Z" fill="#c99266"/>
  <path d="M26 88V93M42 88V93M58 88V93M74 88V93M90 88V93" stroke="#8a5b3d" stroke-width="2" stroke-linecap="round"/>
  <g clip-path="url(#pitch)">
    <rect x="10" y="58" width="100" height="30" fill="#73cf86"/>
    <path d="M28 60h10L32 86H20ZM50 60h10V86H46ZM72 60h10L90 86H78Z" fill="#8fdc9c"/>
    <path d="M34 60L29 72H91L86 60" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" opacity="0.9"/>
    <path d="M14 86H106" stroke="#48a96c" stroke-width="3"/>
  </g>

  <!-- the goal and its net -->
  <path d="M45 61V45H75V61" fill="#fff" opacity="0.35"/>
  <path d="M50 46V61M55 46V61M60 46V61M65 46V61M70 46V61M46 50H74M46 55H74" stroke="#fff" stroke-width="1.2" opacity="0.8"/>
  <path d="M45 62V44H75V62" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M75 45V62" stroke="#e4ddf6" stroke-width="1.6"/>

  <!-- the football -->
  <ellipse cx="62" cy="93" rx="14" ry="3" fill="#4b3a8c" opacity="0.16"/>
  <g transform="translate(60 78)">
    <g clip-path="url(#ball)">
      <circle r="14" fill="#e4ddf6"/>
      <circle cx="-2" cy="-2" r="14" fill="#fff"/>
      <g fill="#3b3150" transform="rotate(-12)">
        <path d="M0-5L4.8-1.5L2.9 4H-2.9L-4.8-1.5Z"/>
        <use href="#pent"/><use href="#pent" transform="rotate(72)"/><use href="#pent" transform="rotate(144)"/><use href="#pent" transform="rotate(216)"/><use href="#pent" transform="rotate(288)"/>
        <path d="M0-5V-8.6M4.8-1.5L8.2-2.7M2.9 4L5.1 7M-2.9 4L-5.1 7M-4.8-1.5L-8.2-2.7" stroke="#3b3150" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
    <ellipse cx="-6" cy="-8" rx="3" ry="1.8" fill="#fff" transform="rotate(-35 -6 -8)"/>
  </g>
  <path d="M86 70v5M83.5 72.5h5M30 76v4M28 78h4" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
</svg>
