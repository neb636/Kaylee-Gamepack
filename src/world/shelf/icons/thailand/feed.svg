<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Feed the elephants</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ddf7ee"/><stop offset="1" stop-color="#a9e8d2"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="head"><circle cx="52" cy="54" r="23"/></clipPath>
    <clipPath id="body"><path d="M33 106C30 91 36 77 52 75C68 77 74 91 71 106Z"/></clipPath>
    <clipPath id="trunk"><path d="M46 60C45 72 52 82 65 83C78 84 88 75 90 62C91 56 91 50 90 45A4.5 4.5 0 0 0 81 45C81 52 80 59 77 64C73 70 67 71 63 68C60 65 59 62 60 58Z"/></clipPath>
    <path id="banana" d="M0-3C-6-2.5-16-3-24-7C-25.5-7.5-27-6-26-4.5C-18 6-6 7.5 0 4Z"/>
    <clipPath id="ban"><use href="#banana"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>
  <ellipse cx="54" cy="106" rx="30" ry="5" fill="#4b3a8c" opacity="0.14"/>

  <!-- tail -->
  <path d="M34 99C27 99 23 95 22 89" fill="none" stroke="#9790ba" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="22" cy="87" rx="2.6" ry="3.4" fill="#857eab"/>

  <!-- body, sitting: lavender grey, shaded on the right -->
  <g clip-path="url(#body)">
    <rect x="28" y="73" width="50" height="40" fill="#9790ba"/>
    <path d="M33 106C30 91 36 77 52 75C60 76 65 80 68 87C66 95 64 101 64 106Z" fill="#bcb6d6"/>
  </g>
  <!-- front legs with toenails -->
  <rect x="37" y="88" width="13" height="18" rx="6" fill="#bcb6d6"/>
  <rect x="54" y="88" width="13" height="18" rx="6" fill="#a9a3cc"/>
  <g fill="#fff7f0">
    <ellipse cx="40.5" cy="104" rx="1.8" ry="1.4"/><ellipse cx="43.5" cy="104.5" rx="1.8" ry="1.4"/><ellipse cx="46.5" cy="104" rx="1.8" ry="1.4"/>
    <ellipse cx="57.5" cy="104" rx="1.8" ry="1.4"/><ellipse cx="60.5" cy="104.5" rx="1.8" ry="1.4"/><ellipse cx="63.5" cy="104" rx="1.8" ry="1.4"/>
  </g>

  <!-- the big ears, pink inside -->
  <path d="M37 38C24 30 9 40 11 56C13 71 25 79 38 72Z" fill="#a9a3cc"/>
  <path d="M36 43C27 38 17 45 18 56C19 66 27 72 36 67Z" fill="#ffc4da"/>
  <path d="M67 38C80 30 95 40 93 56C91 71 79 79 66 72Z" fill="#9790ba"/>
  <path d="M68 43C77 38 87 45 86 56C85 66 77 72 68 67Z" fill="#f4b3cc"/>

  <!-- head: shaded crescent bottom-right, a tuft of hair -->
  <g clip-path="url(#head)">
    <rect x="27" y="29" width="50" height="50" fill="#9790ba"/>
    <circle cx="48.5" cy="50.5" r="23" fill="#bcb6d6"/>
  </g>
  <path d="M33 46C35 39 41 34 48 32" fill="none" stroke="#dedaf0" stroke-width="3" stroke-linecap="round"/>
  <path d="M48 32c-2-3-2-6 0-8M52 31c0-3 1-6 4-7M56 32c1-3 3-4 6-4" fill="none" stroke="#857eab" stroke-width="2.4" stroke-linecap="round"/>

  <!-- eyes, blush, smile -->
  <ellipse cx="43" cy="50" rx="3.5" ry="4.3" fill="#2b2330"/>
  <ellipse cx="61" cy="50" rx="3.5" ry="4.3" fill="#2b2330"/>
  <circle cx="44.3" cy="48.4" r="1.4" fill="#fff"/>
  <circle cx="62.3" cy="48.4" r="1.4" fill="#fff"/>
  <ellipse cx="37" cy="59" rx="4.5" ry="2.6" fill="#ff8fb8" opacity="0.55"/>
  <ellipse cx="67" cy="58.5" rx="4" ry="2.4" fill="#ff8fb8" opacity="0.55"/>
  <path d="M39 65Q42.5 70 46 65.5" fill="none" stroke="#2b2330" stroke-width="2" stroke-linecap="round"/>

  <!-- the trunk, curling up for the bananas -->
  <g clip-path="url(#trunk)">
    <rect x="43" y="40" width="50" height="46" fill="#9790ba"/>
    <path d="M46 60C45 72 52 82 65 83C78 84 88 75 90 62C91 56 91 50 90 45A4.5 4.5 0 0 0 81 45C81 52 80 59 77 64C73 70 67 71 63 68C60 65 59 62 60 58Z" fill="#bcb6d6" transform="translate(-2 -2.5)"/>
  </g>
  <ellipse cx="85.5" cy="44.5" rx="3.3" ry="1.8" fill="#857eab"/>
  <path d="M82.5 53.5h5.5M81 60l5.5 1M69 73.5l-0.5 5.5M74.5 71.5l1.5 5" fill="none" stroke="#a9a3cc" stroke-width="2" stroke-linecap="round"/>

  <!-- a bunch of bananas, just out of reach -->
  <g transform="translate(101 22)">
    <g transform="rotate(-64)"><g clip-path="url(#ban)"><rect x="-28" y="-10" width="30" height="20" fill="#eba123"/><use href="#banana" fill="#ffc83d" transform="translate(0 -2.5)"/></g><circle cx="-25.5" cy="-5.5" r="1.6" fill="#8a5b3d"/></g>
    <g transform="rotate(-38)"><g clip-path="url(#ban)"><rect x="-28" y="-10" width="30" height="20" fill="#eba123"/><use href="#banana" fill="#ffc83d" transform="translate(0 -2.5)"/></g><path d="M-5-1C-11-1-17-2-21-4" fill="none" stroke="#ffe189" stroke-width="2" stroke-linecap="round"/><circle cx="-25.5" cy="-5.5" r="1.6" fill="#8a5b3d"/></g>
    <g transform="rotate(-12)"><g clip-path="url(#ban)"><rect x="-28" y="-10" width="30" height="20" fill="#eba123"/><use href="#banana" fill="#ffc83d" transform="translate(0 -2.5)"/></g><path d="M-5-1C-11-1-17-2-21-4" fill="none" stroke="#ffe189" stroke-width="2" stroke-linecap="round"/><circle cx="-25.5" cy="-5.5" r="1.6" fill="#8a5b3d"/></g>
    <rect x="-3" y="-6" width="7" height="9" rx="3" fill="#8a5b3d" transform="rotate(-30)"/>
  </g>
  <path d="M66 14v5M63.5 16.5h5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
</svg>
