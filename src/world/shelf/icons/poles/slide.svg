<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Penguin Slide</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff5d1"/><stop offset="1" stop-color="#ffe08f"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="slope" x1="0" y1="58" x2="0" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e8e1fb"/></linearGradient>
    <path id="peng" d="M-36 4C-34-6-22-13-6-13.5C2-13.8 8-15 13-18.5C20-23 31-20 34-12C36.5-6 35 1 30 6C22 12.5 8 14-8 14C-22 14-33 11-36 4Z"/>
    <clipPath id="pengClip"><use href="#peng"/></clipPath>
    <path id="flake" d="M0-5V5M-4.3-2.5L4.3 2.5M-4.3 2.5L4.3-2.5"/>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="50" r="50" fill="url(#glow)"/>

  <!-- the sun, a far snowy hill -->
  <circle cx="22" cy="22" r="8.5" fill="#fff6cc"/>
  <path d="M62 66C70 52 78 44 88 44C98 44 108 52 124 60V80H62Z" fill="#e9e3fb"/>
  <path d="M88 44C98 44 108 52 124 60V80H96C97 66 95 54 88 44Z" fill="#d9d0f5"/>
  <path d="M74 52C78 48 82 46 87 45.5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- the snowy slope, running down to the right -->
  <path d="M-4 58C20 66 40 77 57 83.5C74 90 100 100 124 106V124H-4Z" fill="url(#slope)"/>
  <path d="M-4 58C20 66 40 77 57 83.5C74 90 100 100 124 106" fill="none" stroke="#fff" stroke-width="3"/>
  <path d="M-4 84C24 92 48 102 70 110C84 115 102 118 124 119V124H-4Z" fill="#ddd2ff" opacity="0.6"/>
  <!-- the groove it left in the snow, speed lines -->
  <path d="M-4 61C10 66 20 70.5 30 74.5" fill="none" stroke="#ddd2ff" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M6 76l14 5.5M14 86l12 4.5" fill="none" stroke="#ddd2ff" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M4 44l14 5M12 34l10 3.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>

  <!-- the penguin sliding on its belly, head up, down the slope -->
  <g transform="translate(60 69) rotate(21)">
    <ellipse cx="-2" cy="15" rx="32" ry="3" fill="#4b3a8c" opacity="0.14"/>
    <!-- pink feet kicked up behind -->
    <path d="M-33 -1C-38-5-43-5-46-2C-43 1-38 2-34 1.5Z" fill="#ff9c57"/>
    <path d="M-34 6C-39 5-43 7-45 10.5C-41 11.5-37 10.5-34 8.5Z" fill="#e57a35"/>
    <!-- body: a dark back lit on top, the white belly on the snow -->
    <g clip-path="url(#pengClip)">
      <rect x="-38" y="-24" width="76" height="40" fill="#3f3659"/>
      <use href="#peng" transform="translate(-2.5 -2.5)" fill="#544a78"/>
      <path d="M-36 3C-22 6 0 6 14 3C22 1.5 28-1.5 33-6C35-1 34 3 30 6C22 12.5 8 14.5-8 14.5C-22 14.5-34 11-36 3Z" fill="#fff"/>
      <path d="M-34 10C-20 14 8 14 30 6V16H-36Z" fill="#e4ddf6"/>
    </g>
    <path d="M-26-7C-18-11.5-8-13-1-12.8M16-17.5C20-19.5 25-19.8 29-18" fill="none" stroke="#7a70a3" stroke-width="2.6" stroke-linecap="round"/>
    <!-- a flipper swept back like a wing -->
    <path d="M6-3C-4-6-17-9-30-8C-28-4.5-18-1-4 1.5Z" fill="#3f3659"/>
    <path d="M-28-7C-18-7.5-8-5.5 2-3" fill="none" stroke="#6e6494" stroke-width="2.2" stroke-linecap="round"/>
    <!-- the white eye ring, a happy open beak, blush -->
    <circle cx="24" cy="-10" r="5" fill="#fff"/>
    <ellipse cx="24.8" cy="-9.8" rx="2.7" ry="3.3" fill="#2b2330"/>
    <circle cx="25.9" cy="-11.1" r="1.1" fill="#fff"/>
    <path d="M32.5-9C37-9.5 41-8 43.5-5.5C40-4.5 36-4.5 32.5-5.2Z" fill="#ff9c57"/>
    <path d="M32.5-3.5C36-3.2 39.5-2.4 42-1C39-0.2 35.5 0 32.5-0.5Z" fill="#e57a35"/>
    <path d="M32.5-5.2C35.5-4.6 38.5-4.4 41-4.2L32.5-3.5Z" fill="#ff8fb8"/>
    <ellipse cx="28" cy="-2" rx="3" ry="1.9" fill="#ff8fb8" opacity="0.7"/>
  </g>

  <!-- snow spraying up ahead of its chest -->
  <g fill="#e4ddf6">
    <circle cx="96" cy="101" r="6"/><circle cx="106" cy="99" r="4.5"/><circle cx="88" cy="104" r="4"/>
  </g>
  <g fill="#fff">
    <circle cx="95" cy="98.5" r="6"/><circle cx="104.5" cy="96" r="4.5"/><circle cx="87" cy="102" r="3.8"/>
    <circle cx="111" cy="90" r="3"/><circle cx="104" cy="86" r="2.6"/><circle cx="114" cy="98" r="2.2"/><circle cx="97" cy="88" r="2"/><circle cx="110" cy="82" r="1.6"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
    <use href="#flake" transform="translate(44 20) scale(0.85)"/>
    <use href="#flake" transform="translate(96 22) scale(0.7)"/>
  </g>
</svg>
