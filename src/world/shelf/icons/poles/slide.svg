<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Penguin Slide</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff5d1"/><stop offset="1" stop-color="#ffe08f"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="slope" x1="0" y1="58" x2="0" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e8e1fb"/></linearGradient>
    <path id="body" d="M-35 3C-35-6-24-13-8-13C4-13 14-10 20-4C24 0 24 6 20 9C12 13.5 0 14.5-12 14C-25 13.5-35 10-35 3Z"/>
    <clipPath id="bodyClip"><use href="#body"/></clipPath>
    <clipPath id="head"><circle cx="22" cy="-11" r="12.5"/></clipPath>
    <path id="flake" d="M0-5V5M-4.3-2.5L4.3 2.5M-4.3 2.5L4.3-2.5"/>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="50" r="50" fill="url(#glow)"/>

  <!-- the sun, a far snowy hill -->
  <circle cx="22" cy="22" r="13" fill="#fff" opacity="0.4"/>
  <circle cx="22" cy="22" r="8.5" fill="#fff"/>
  <path d="M62 66C70 52 78 44 88 44C98 44 108 52 124 60V80H62Z" fill="#e9e3fb"/>
  <path d="M88 44C98 44 108 52 124 60V80H96C97 66 95 54 88 44Z" fill="#d9d0f5"/>
  <path d="M74 52C78 48 82 46 87 45.5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- the snowy slope, running down to the right -->
  <path d="M-4 58C20 66 40 77 57 83.5C74 90 100 100 124 106V124H-4Z" fill="url(#slope)"/>
  <path d="M-4 58C20 66 40 77 57 83.5C74 90 100 100 124 106" fill="none" stroke="#fff" stroke-width="3"/>
  <path d="M-4 84C24 92 48 102 70 110C84 115 102 118 124 119V124H-4Z" fill="#ddd2ff" opacity="0.6"/>
  <!-- the groove it left in the snow, speed lines -->
  <path d="M-4 61C8 65.5 16 69 24 72.5" fill="none" stroke="#ddd2ff" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M8 80l12 4.5M16 90l10 3.8" fill="none" stroke="#ddd2ff" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M6 44l12 4.5M16 34.5l9 3.3" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>

  <!-- the Adelie penguin zooming down on its belly, head up, a flipper out like a wing -->
  <g transform="translate(60 71.5) rotate(20)">
    <ellipse cx="-6" cy="15" rx="32" ry="3" fill="#4b3a8c" opacity="0.14"/>
    <!-- pink feet kicked up behind -->
    <path d="M-34-1C-39-5-44-5.5-47-2.5C-44 0.5-39 1.5-35 1.5Z" fill="#ff8fb8"/>
    <path d="M-34 6C-39 5-43 7-45 10.5C-41 11.5-37 10.5-34 8.5Z" fill="#e7699c"/>
    <!-- the far flipper, just peeking out under the belly -->
    <path d="M2 11C-4 15-11 17-18 17C-14 13.5-7 11.5 0 10Z" fill="#3f3659"/>
    <!-- body: a dark back lit on top, a big white front on the snow -->
    <g clip-path="url(#bodyClip)">
      <rect x="-37" y="-15" width="62" height="31" fill="#3f3659"/>
      <use href="#body" transform="translate(-2 -2.5)" fill="#544a78"/>
      <path d="M-37 3C-24 5.5-4 6 10 2C15 0.5 19-1.5 22-4L26-4V20H-37Z" fill="#fff"/>
      <path d="M-35 10C-22 14 4 14.5 22 7V20H-37Z" fill="#e4ddf6"/>
    </g>
    <path d="M-26-7C-19-11-9-12.5-1-12.2" fill="none" stroke="#7a70a3" stroke-width="2.6" stroke-linecap="round"/>
    <!-- the near flipper held up and back -->
    <path d="M7-8C-1-14-13-21-26-24C-25-19-16-11.5-3-4.5Z" fill="#3f3659"/>
    <path d="M-23-21.5C-14-18.5-6-14 2-8.5" fill="none" stroke="#6e6494" stroke-width="2.2" stroke-linecap="round"/>
    <!-- the round head: dark, lit on the top-left -->
    <g clip-path="url(#head)">
      <rect x="8" y="-25" width="28" height="28" fill="#3f3659"/>
      <circle cx="20" cy="-13.5" r="12.5" fill="#544a78"/>
    </g>
    <path d="M13.5-18C15.5-21 18.5-22.8 22-23.2" fill="none" stroke="#7a70a3" stroke-width="2.4" stroke-linecap="round"/>
    <!-- the white eye ring, a happy open beak, blush -->
    <circle cx="25" cy="-13" r="5" fill="#fff"/>
    <ellipse cx="25.8" cy="-12.8" rx="2.7" ry="3.3" fill="#2b2330"/>
    <circle cx="26.9" cy="-14.1" r="1.1" fill="#fff"/>
    <path d="M33.5-11C38-11.5 42-10 44.5-7.5C41-6.5 37-6.5 33.5-7.2Z" fill="#ff9c57"/>
    <path d="M33.5-5.5C37-5.2 40.5-4.4 43-3C40-2.2 36.5-2 33.5-2.5Z" fill="#e57a35"/>
    <path d="M33.5-7.2C36.5-6.6 39.5-6.4 42-6.2L33.5-5.5Z" fill="#ff8fb8"/>
    <ellipse cx="27.5" cy="-4.5" rx="3" ry="1.9" fill="#ff8fb8" opacity="0.75"/>
  </g>

  <!-- snow spraying up ahead of its chest -->
  <g fill="#e4ddf6">
    <circle cx="90" cy="99" r="6"/><circle cx="100" cy="99.5" r="4.5"/><circle cx="82" cy="100" r="4"/>
  </g>
  <g fill="#fff">
    <circle cx="89" cy="96.5" r="6"/><circle cx="98.5" cy="95.5" r="4.5"/><circle cx="81" cy="98" r="3.8"/>
    <circle cx="106" cy="91" r="3"/><circle cx="109.5" cy="99" r="2.4"/><circle cx="103" cy="87.5" r="2.2"/><circle cx="111" cy="85" r="1.6"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
    <use href="#flake" transform="translate(48 16) scale(0.85)"/>
    <use href="#flake" transform="translate(98 22) scale(0.7)"/>
  </g>
</svg>
