<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Snow Coats</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ece6ff"/><stop offset="1" stop-color="#cdbfff"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <path id="headShape" d="M60 24C71.5 24 80 30.5 82.5 40L91 44C88.5 47 86.5 50 85.5 52.5L90 56.5C83 64 72 68 60 68C48 68 37 64 30 56.5L34.5 52.5C33.5 50 31.5 47 29 44L37.5 40C40 30.5 48.5 24 60 24Z"/>
    <path id="bodyShape" d="M41 102C37 91 38 78 46 69H74C82 78 83 91 79 102Z"/>
    <path id="tailShape" d="M72 101C88 104 103 97 107 82C110 70 106 56 96 49C92 46.5 87 47.5 86.5 52C90 58 92 66 90.5 74C89 82 82 87 72 87Z"/>
    <path id="snout" d="M50 51.5C53 47.5 67 47.5 70 51.5C71.5 56 65.5 62.5 60 64C54.5 62.5 48.5 56 50 51.5Z"/>
    <path id="flake" d="M0-5V5M-4.3-2.5L4.3 2.5M-4.3 2.5L4.3-2.5"/>
    <clipPath id="head"><use href="#headShape"/></clipPath>
    <clipPath id="body"><use href="#bodyShape"/></clipPath>
    <clipPath id="tail"><use href="#tailShape"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>

  <!-- falling snow -->
  <g fill="#fff">
    <circle cx="16" cy="26" r="2.2"/><circle cx="27" cy="48" r="1.5"/><circle cx="13" cy="66" r="1.8"/>
    <circle cx="104" cy="17" r="1.6"/><circle cx="99" cy="38" r="1.4"/><circle cx="34" cy="13" r="1.3"/><circle cx="85" cy="12" r="1.2"/><circle cx="20" cy="84" r="1.4"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
    <use href="#flake" transform="translate(103 29)"/>
    <use href="#flake" transform="translate(19 39) scale(0.8)"/>
  </g>

  <!-- the snowdrift -->
  <path d="M-2 97C20 91 44 92 60 94C80 96 100 90 122 93V122H-2Z" fill="#f7f4ff"/>
  <path d="M-2 111C24 107 52 109 74 112C92 114.5 108 111 122 108V122H-2Z" fill="#ddd2ff"/>
  <path d="M5 95.5C15 93 25 92.3 33 92.8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="66" cy="105" rx="40" ry="4.5" fill="#4b3a8c" opacity="0.13"/>

  <!-- the big bushy winter tail, swept up behind -->
  <g clip-path="url(#tail)">
    <rect x="66" y="44" width="46" height="62" fill="#d6ccf3"/>
    <use href="#tailShape" transform="translate(-4 -3)" fill="#fff"/>
  </g>
  <g fill="#d6ccf3"><circle cx="106" cy="67" r="4"/><circle cx="106" cy="80" r="4.5"/><circle cx="100" cy="92.5" r="4.5"/><circle cx="89" cy="100" r="4"/></g>
  <g fill="#fff"><circle cx="99" cy="52" r="3.2"/><circle cx="102.5" cy="64.5" r="3.4"/><circle cx="102.5" cy="77" r="3.6"/></g>

  <!-- body: pale lavender-white, shaded on the right -->
  <g clip-path="url(#body)">
    <rect x="34" y="64" width="52" height="42" fill="#d6ccf3"/>
    <use href="#bodyShape" transform="translate(-4.5 -2)" fill="#f1edff"/>
  </g>
  <!-- the fluffy white bib, its tufts sticking out at the sides -->
  <path d="M41 66C40 72 41 77 43.5 81C45 80 46.5 80.5 47.5 82.5C49 81 51 81 52.5 83.5C54.5 81.5 57.5 81.5 60 84C62.5 81.5 65.5 81.5 67.5 83.5C69 81 71 81 72.5 82.5C73.5 80.5 75 80 76.5 81C79 77 80 72 79 66Z" fill="#fff"/>
  <!-- front legs and paws -->
  <rect x="47" y="80" width="12" height="23" rx="6" fill="#fff"/>
  <rect x="61" y="80" width="12" height="23" rx="6" fill="#fff"/>
  <path d="M67 84.5V98" stroke="#ebe6fb" stroke-width="2.6" stroke-linecap="round"/>
  <ellipse cx="53" cy="102.5" rx="7" ry="4.5" fill="#fff"/>
  <ellipse cx="67" cy="102.5" rx="7" ry="4.5" fill="#fff"/>
  <path d="M62 104a7 4.5 0 0 0 12-1.5" fill="none" stroke="#e4ddf6" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M50.5 104.6v1.4M55.5 104.6v1.4M64.5 104.6v1.4M69.5 104.6v1.4" stroke="#cfc4ef" stroke-width="1.7" stroke-linecap="round"/>

  <!-- tall pointed ears, pink inside -->
  <path d="M37.5 39C35.5 27.5 38 18 43.5 11.5C50 15.5 55 22 56.5 29Z" fill="#fff"/>
  <path d="M41 34.5C40.5 27 42 21 45 17C49 20 51.5 24 52.8 28.5Z" fill="#ffc4da"/>
  <path d="M82.5 39C84.5 27.5 82 18 76.5 11.5C70 15.5 65 22 63.5 29Z" fill="#ece6fb"/>
  <path d="M79 34.5C79.5 27 78 21 75 17C71 20 68.5 24 67.2 28.5Z" fill="#ff8fb8"/>

  <!-- head: white with fluffy cheek tufts, a lavender crescent bottom-right -->
  <g clip-path="url(#head)">
    <rect x="28" y="20" width="64" height="50" fill="#d6ccf3"/>
    <use href="#headShape" transform="translate(-3.5 -3)" fill="#fff"/>
  </g>
  <!-- the pointy snout, standing out with its own soft shade -->
  <use href="#snout" transform="translate(1.5 1.8)" fill="#e4ddf6"/>
  <use href="#snout" fill="#fff"/>

  <!-- eyes, nose at the snout's tip, smile, blush -->
  <ellipse cx="49.5" cy="44" rx="3.6" ry="4.4" fill="#2b2330"/>
  <ellipse cx="70.5" cy="44" rx="3.6" ry="4.4" fill="#2b2330"/>
  <circle cx="50.8" cy="42.4" r="1.4" fill="#fff"/>
  <circle cx="71.8" cy="42.4" r="1.4" fill="#fff"/>
  <path d="M56.6 56.6Q60 54.6 63.4 56.6Q62.2 59.8 60 60Q57.8 59.8 56.6 56.6Z" fill="#2b2330"/>
  <ellipse cx="58.8" cy="56.4" rx="1.1" ry="0.6" fill="#fff"/>
  <path d="M60 60V61.6M57 61.4Q58.5 63.6 60 61.6Q61.5 63.6 63 61.4" fill="none" stroke="#2b2330" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="42" cy="54" rx="4.4" ry="2.6" fill="#ff8fb8" opacity="0.55"/>
  <ellipse cx="78" cy="54" rx="4.4" ry="2.6" fill="#ff8fb8" opacity="0.55"/>
</svg>
