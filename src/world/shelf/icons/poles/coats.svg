<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Snow Coats</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ece6ff"/><stop offset="1" stop-color="#cdbfff"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <path id="headShape" d="M60 30C71 30 79 36 81.5 45L87 50.5C84.5 52.5 82.5 54.5 81.5 56.5L85 61C78.5 66.5 70 69.5 60 69.5C50 69.5 41.5 66.5 35 61L38.5 56.5C37.5 54.5 35.5 52.5 33 50.5L38.5 45C41 36 49 30 60 30Z"/>
    <path id="bodyShape" d="M43 103C38.5 91 40 77 49 68.5H71C80 77 81.5 91 77 103Z"/>
    <path id="tailShape" d="M74 101C86 101 97 96 101 86C104 78 102 70 97 66C98 72 96 79 90 83C85 86.5 79 88 73 88Z"/>
    <path id="flake" d="M0-5V5M-4.3-2.5L4.3 2.5M-4.3 2.5L4.3-2.5"/>
    <clipPath id="head"><use href="#headShape"/></clipPath>
    <clipPath id="body"><use href="#bodyShape"/></clipPath>
    <clipPath id="tail"><use href="#tailShape"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>

  <!-- falling snow -->
  <g fill="#fff">
    <circle cx="18" cy="24" r="2.2"/><circle cx="30" cy="44" r="1.5"/><circle cx="14" cy="62" r="1.8"/><circle cx="24" cy="80" r="1.3"/>
    <circle cx="102" cy="20" r="1.6"/><circle cx="92" cy="40" r="2"/><circle cx="108" cy="58" r="1.5"/><circle cx="34" cy="14" r="1.3"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
    <use href="#flake" transform="translate(100 33)"/>
    <use href="#flake" transform="translate(21 41) scale(0.8)"/>
  </g>

  <!-- the snowdrift -->
  <path d="M-2 98C20 91 44 92 60 94C80 96 100 90 122 94V122H-2Z" fill="#f7f4ff"/>
  <path d="M-2 110C24 106 52 108 74 112C92 115 108 111 122 108V122H-2Z" fill="#ddd2ff"/>
  <path d="M8 96C20 93 32 92.5 42 93.5" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="62" cy="104" rx="34" ry="5" fill="#4b3a8c" opacity="0.12"/>

  <!-- the fluffy tail curled round in front, lavender on its underside -->
  <g clip-path="url(#tail)">
    <rect x="70" y="62" width="36" height="42" fill="#e4ddf6"/>
    <use href="#tailShape" transform="translate(-2 -3)" fill="#fff"/>
  </g>
  <path d="M97 66C101 70 103 76 102 82M100.5 74.5L104 76.5M97 84L101 87" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- body: white, shaded lavender on the right -->
  <g clip-path="url(#body)">
    <rect x="36" y="64" width="48" height="42" fill="#e4ddf6"/>
    <use href="#bodyShape" transform="translate(-4 -2)" fill="#fff"/>
  </g>
  <!-- the fluffy ruff on its chest -->
  <path d="M48 68C48 76 51 81 54 84C55 82 56.5 81 57.5 83C58.5 81 61.5 81 62.5 83C63.5 81 65 82 66 84C69 81 72 76 72 68Z" fill="#fff"/>
  <path d="M54 84C55 82 56.5 81 57.5 83C58.5 81 61.5 81 62.5 83C63.5 81 65 82 66 84" fill="none" stroke="#e4ddf6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- front paws -->
  <ellipse cx="52.5" cy="102.5" rx="6.5" ry="4.5" fill="#fff"/>
  <ellipse cx="67" cy="102.5" rx="6.5" ry="4.5" fill="#fff"/>
  <path d="M62 104a6.5 4.5 0 0 0 11-1.5" fill="none" stroke="#e4ddf6" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M50.5 105v1M54.5 105v1M65 105v1M69 105v1" stroke="#d2c8f0" stroke-width="1.6" stroke-linecap="round"/>

  <!-- pointed ears, pink inside -->
  <path d="M39 42C38 32 40.5 24 45 18.5C50.5 22.5 54.5 28 56 34Z" fill="#fff"/>
  <path d="M42.5 37.5C42.5 31.5 44 26.5 46.5 23.5C49.5 26 51.5 29.5 52.5 33Z" fill="#ffc4da"/>
  <path d="M81 42C82 32 79.5 24 75 18.5C69.5 22.5 65.5 28 64 34Z" fill="#efeaff"/>
  <path d="M77.5 37.5C77.5 31.5 76 26.5 73.5 23.5C70.5 26 68.5 29.5 67.5 33Z" fill="#ff8fb8"/>

  <!-- head: white with fluffy cheeks, a lavender crescent bottom-right -->
  <g clip-path="url(#head)">
    <rect x="30" y="26" width="60" height="48" fill="#e4ddf6"/>
    <use href="#headShape" transform="translate(-3 -2.5)" fill="#fff"/>
  </g>
  <path d="M42 41C44 36 48.5 32.5 54 31.5" fill="none" stroke="#f4f0ff" stroke-width="2.6" stroke-linecap="round"/>

  <!-- eyes, nose, smile, blush -->
  <ellipse cx="50.5" cy="49" rx="3.4" ry="4.1" fill="#2b2330"/>
  <ellipse cx="69.5" cy="49" rx="3.4" ry="4.1" fill="#2b2330"/>
  <circle cx="51.7" cy="47.5" r="1.35" fill="#fff"/>
  <circle cx="70.7" cy="47.5" r="1.35" fill="#fff"/>
  <path d="M56.6 56Q60 54 63.4 56Q62.2 59.2 60 59.4Q57.8 59.2 56.6 56Z" fill="#2b2330"/>
  <ellipse cx="58.8" cy="55.8" rx="1.1" ry="0.6" fill="#fff"/>
  <path d="M60 59.4V61M56.6 61Q58.3 63.2 60 61Q61.7 63.2 63.4 61" fill="none" stroke="#2b2330" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="44" cy="57" rx="4.2" ry="2.5" fill="#ff8fb8" opacity="0.55"/>
  <ellipse cx="76" cy="57" rx="4.2" ry="2.5" fill="#ff8fb8" opacity="0.55"/>
</svg>
