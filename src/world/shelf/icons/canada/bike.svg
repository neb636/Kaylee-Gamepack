<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Mountain Bike</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ddf7ee"/><stop offset="1" stop-color="#a9e8d2"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="52" r="50" fill="url(#glow)"/>

  <!-- a far mountain in the haze -->
  <path d="M10 76L42 38L56 52L66 42L100 76Z" fill="#c4e8de"/>
  <path d="M42 38L56 52L60 48L52 76H76L66 42L56 52Z" fill="#aedccd" opacity="0"/>
  <path d="M42 38L50 47.5L45 76H100L66 42L60 48L56 52L50 47.5Z" fill="#b4dfd2"/>
  <path d="M36 45L42 38L49 46.5L45 49L42 46L38.5 49Z" fill="#fff"/>

  <!-- pine trees, back to front -->
  <g transform="translate(22 80)">
    <path d="M-1.5 0h3v5h-3z" fill="#8a5b3d"/>
    <path d="M0-34L10-14H5L12 0H-12L-5-14H-10Z" fill="#3e9e78"/>
    <path d="M0-34L10-14H5L12 0H1V-30Z" fill="#2b7a5f"/>
    <path d="M-1-28L-6.5-17" stroke="#69c19a" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g transform="translate(95 82) scale(1.25)">
    <path d="M-1.5 0h3v5h-3z" fill="#8a5b3d"/>
    <path d="M0-34L10-14H5L12 0H-12L-5-14H-10Z" fill="#3e9e78"/>
    <path d="M0-34L10-14H5L12 0H1V-30Z" fill="#2b7a5f"/>
    <path d="M-1-28L-6.5-17" stroke="#69c19a" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- green ground and the dirt trail -->
  <path d="M0 80C26 74 50 76 66 79C86 74 104 74 120 78V120H0Z" fill="#73cf86"/>
  <path d="M0 80C26 74 50 76 66 79C58 82 42 83 28 84C16 85 6 86 0 88Z" fill="#aee8b7"/>
  <path d="M0 102C24 94 52 90 76 90C92 90 106 92 120 95V120H0Z" fill="#c99266"/>
  <path d="M0 110C30 103 70 102 120 104V120H0Z" fill="#a46e4b"/>
  <path d="M30 96C42 93 54 92 64 92M84 93.5c6 .3 12 1 17 2" fill="none" stroke="#e5b78f" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="18" cy="106" rx="4" ry="2" fill="#8a5b3d"/>
  <ellipse cx="104" cy="108" rx="3.5" ry="1.8" fill="#8a5b3d"/>
  <ellipse cx="60" cy="101" rx="40" ry="5" fill="#4b3a8c" opacity="0.16"/>

  <!-- back wheel: knobby tyre, pink rim, hub -->
  <g transform="translate(36 81)">
    <circle r="19" fill="#3e3646"/>
    <circle r="19" fill="none" stroke="#3e3646" stroke-width="3" stroke-dasharray="2.5 2.5"/>
    <circle r="13.5" fill="#d6d2e2"/>
    <circle r="11" fill="#eef1f8"/>
    <path d="M0-11V11M-11 0H11M-7.8-7.8L7.8 7.8M-7.8 7.8L7.8-7.8" stroke="#bcb6d6" stroke-width="1.5"/>
    <circle r="3.5" fill="#9790ba"/>
    <path d="M-14-6A15 15 0 0 1-6-14" fill="none" stroke="#5a5266" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- front wheel -->
  <g transform="translate(86 81)">
    <circle r="19" fill="#3e3646"/>
    <circle r="19" fill="none" stroke="#3e3646" stroke-width="3" stroke-dasharray="2.5 2.5"/>
    <circle r="13.5" fill="#d6d2e2"/>
    <circle r="11" fill="#eef1f8"/>
    <path d="M0-11V11M-11 0H11M-7.8-7.8L7.8 7.8M-7.8 7.8L7.8-7.8" stroke="#bcb6d6" stroke-width="1.5"/>
    <circle r="3.5" fill="#9790ba"/>
    <path d="M-14-6A15 15 0 0 1-6-14" fill="none" stroke="#5a5266" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- the frame: chunky pink tubes -->
  <path d="M36 81L56 82L76 57M56 82L47 55M36 81L47 55L76 57" fill="none" stroke="#d8367f" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M36 81L56 82L76 57M56 82L47 55M36 81L47 55L76 57" fill="none" stroke="#ff4f9a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M51 56.5L70 57.8" stroke="#ff8fc0" stroke-width="2" stroke-linecap="round"/>
  <!-- the suspension fork and handlebar -->
  <path d="M86 81L77 58" stroke="#9790ba" stroke-width="6" stroke-linecap="round"/>
  <path d="M84 75.5L79.5 64" stroke="#d6d2e2" stroke-width="3" stroke-linecap="round"/>
  <path d="M76 57L73 47" stroke="#3e3646" stroke-width="5" stroke-linecap="round"/>
  <path d="M67 46.5C71 45 76 45 80 46.5" fill="none" stroke="#3e3646" stroke-width="5" stroke-linecap="round"/>
  <path d="M65 46.8l-1 0" stroke="#ff4f9a" stroke-width="5" stroke-linecap="round"/>
  <!-- seat post and saddle -->
  <path d="M47 55L45 47" stroke="#9790ba" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M37 46C41 43.5 49 43.5 53 45.5C51 48 41 48.5 37 46Z" fill="#3e3646"/>
  <!-- the crank and pedal -->
  <circle cx="56" cy="82" r="6" fill="#9790ba"/>
  <circle cx="56" cy="82" r="3" fill="#d6d2e2"/>
  <path d="M56 82L61 90" stroke="#5a5266" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="57.5" y="89" width="8" height="3.5" rx="1.75" fill="#3e3646"/>
  <!-- the chain -->
  <path d="M36 81L56 82" stroke="#5a5266" stroke-width="2" stroke-dasharray="2 1.5" opacity="0.8"/>

  <!-- a sparkle -->
  <path d="M101 28l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5z" fill="#fff"/>
</svg>
