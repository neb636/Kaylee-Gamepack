<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Misty's Bubble Bath</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe1ee"/><stop offset="1" stop-color="#ffbcd8"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="pool" x1="0" y1="84" x2="0" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8fe3ea"/><stop offset="1" stop-color="#3fc1cf"/></linearGradient>
    <clipPath id="head"><circle cx="60" cy="58" r="24"/></clipPath>
    <clipPath id="body"><ellipse cx="60" cy="96" rx="30" ry="20"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>

  <!-- bubbles floating up -->
  <g>
    <circle cx="22" cy="42" r="6.5" fill="#fff" opacity="0.6"/><circle cx="20" cy="40" r="2" fill="#fff"/>
    <circle cx="99" cy="30" r="5.5" fill="#fff" opacity="0.6"/><circle cx="97.5" cy="28.5" r="1.8" fill="#fff"/>
    <circle cx="103" cy="58" r="4" fill="#ffc4da" opacity="0.8"/><circle cx="102" cy="57" r="1.3" fill="#fff"/>
    <circle cx="16" cy="68" r="4" fill="#ffc4da" opacity="0.8"/><circle cx="15" cy="67" r="1.3" fill="#fff"/>
    <circle cx="31" cy="20" r="3" fill="#fff" opacity="0.7"/>
  </g>

  <!-- the pool -->
  <rect y="84" width="120" height="36" fill="url(#pool)"/>
  <rect y="84" width="120" height="2.2" fill="#effcff" opacity="0.8"/>
  <g fill="#fff" opacity="0.6"><rect x="6" y="104" width="14" height="2.4" rx="1.2"/><rect x="98" y="110" width="16" height="2.4" rx="1.2"/></g>

  <!-- Misty in the water, big: her shoulders, white fur, shaded on the right -->
  <g transform="translate(-10.8 -15.5) scale(1.18)">
  <g clip-path="url(#body)">
    <rect x="28" y="74" width="64" height="12" fill="#fff"/>
    <path d="M70 74H92V86H66Z" fill="#e4ddf6"/>
  </g>
  <!-- her ears -->
  <circle cx="40" cy="38" r="8.5" fill="#fff"/><circle cx="40" cy="38.5" r="4.5" fill="#ffc4da"/>
  <circle cx="80" cy="38" r="8.5" fill="#fff"/><circle cx="80" cy="38.5" r="4.5" fill="#ffc4da"/>
  <path d="M85 32.5A8.5 8.5 0 0 1 82 46.2A8 8 0 0 0 85 32.5Z" fill="#e4ddf6"/>
  <!-- her head, lit from the top left -->
  <g clip-path="url(#head)">
    <rect x="34" y="32" width="52" height="52" fill="#fff"/>
    <path d="M86 40C82 64 66 80 40 82H86Z" fill="#e4ddf6"/>
  </g>
  <!-- the muzzle, the nose, the eyes, blush and a smile -->
  <ellipse cx="60" cy="67" rx="11.5" ry="8.5" fill="#fff7f0"/>
  <path d="M71 66A11.5 8.5 0 0 1 56 75.3C64 74 69.5 71 71 66Z" fill="#efdccd"/>
  <ellipse cx="60" cy="62" rx="4.6" ry="3.3" fill="#2b2330"/>
  <ellipse cx="58.6" cy="61" rx="1.4" ry="0.9" fill="#fff" opacity="0.7"/>
  <ellipse cx="50" cy="54" rx="3.1" ry="4" fill="#2b2330"/><circle cx="51.2" cy="52.4" r="1.2" fill="#fff"/>
  <ellipse cx="70" cy="54" rx="3.1" ry="4" fill="#2b2330"/><circle cx="71.2" cy="52.4" r="1.2" fill="#fff"/>
  <ellipse cx="43" cy="63" rx="4" ry="2.4" fill="#ff8fb8" opacity="0.55"/>
  <ellipse cx="77" cy="63" rx="4" ry="2.4" fill="#ff8fb8" opacity="0.55"/>
  <path d="M56 68.5Q60 72 64 68.5" fill="none" stroke="#2b2330" stroke-width="2" stroke-linecap="round"/>

  <!-- a pile of pink suds on her head: a bubbly mohawk -->
  <g>
    <circle cx="51" cy="36" r="6" fill="#ffc4da"/>
    <circle cx="69" cy="36" r="6" fill="#ffc4da"/>
    <circle cx="60" cy="33" r="8" fill="#fff"/>
    <circle cx="60" cy="23" r="6" fill="#ffc4da"/>
    <path d="M66 28A8 8 0 0 1 60 41A8 8 0 0 0 66 28Z" fill="#e4ddf6"/>
    <circle cx="57" cy="30" r="2" fill="#fff" opacity="0.9"/>
    <circle cx="58" cy="21" r="1.5" fill="#fff"/>
  </g>

  </g>

  <!-- suds round her in the water -->
  <g>
    <circle cx="32" cy="86" r="5" fill="#fff"/><circle cx="39" cy="88" r="4" fill="#ffc4da"/><circle cx="26" cy="89" r="3.5" fill="#ffc4da"/>
    <circle cx="82" cy="87" r="4" fill="#ffc4da"/><circle cx="89" cy="86" r="5" fill="#fff"/>
  </g>

  <!-- the pink sponge -->
  <g transform="translate(94 98) rotate(-14)">
    <rect x="-12" y="-7.5" width="24" height="15" rx="4.5" fill="#ff8fb8"/>
    <rect x="-12" y="1.5" width="24" height="6" rx="3" fill="#e7699c"/>
    <rect x="-9.5" y="-5.5" width="10" height="3" rx="1.5" fill="#ffc4da"/>
    <circle cx="5" cy="-2" r="1.6" fill="#e7699c"/><circle cx="-4" cy="1" r="1.4" fill="#e7699c"/><circle cx="8" cy="3" r="1.3" fill="#d8367f"/>
  </g>
</svg>
