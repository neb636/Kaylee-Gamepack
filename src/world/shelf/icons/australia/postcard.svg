<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Beach Postcard</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe1ee"/><stop offset="1" stop-color="#ffbcd8"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="pic"><rect x="22" y="63" width="40" height="40" rx="3"/></clipPath>
    <clipPath id="head"><ellipse cx="45" cy="44" rx="17" ry="16"/></clipPath>
    <clipPath id="bill"><path d="M55 46C62 42.5 71 40 80 40C87 40 91 43.5 90.5 48.5C90 54 84 57.5 75 57.8C67 58 60 57 55 55Z"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="58" r="50" fill="url(#glow)"/>
  <ellipse cx="62" cy="109" rx="40" ry="5" fill="#4b3a8c" opacity="0.14"/>

  <g transform="rotate(-5 60 80)">
    <!-- the platypus behind the card: a round brown furry head, turned to the right -->
    <g clip-path="url(#head)">
      <rect x="26" y="26" width="38" height="36" fill="#8a5b3d"/>
      <ellipse cx="42.5" cy="41.5" rx="17" ry="16" fill="#a46e4b"/>
    </g>
    <path d="M32 38C33.5 33.5 37 30.5 42 29.5" fill="none" stroke="#c99266" stroke-width="2.6" stroke-linecap="round"/>
    <!-- the flat duck bill, resting on the card's edge -->
    <g clip-path="url(#bill)">
      <rect x="50" y="38" width="44" height="22" fill="#5a5274"/>
      <path d="M55 46C62 42.5 71 40 80 40C87 40 91 43.5 90.5 48.5C90.3 50.5 89.5 52 88 53C78 51.5 66 52 54 54.5Z" fill="#7d7499"/>
      <rect x="53" y="40" width="5" height="20" fill="#4a4262"/>
    </g>
    <path d="M62 45C68 42.5 75 41.6 82 42.2" fill="none" stroke="#a49cc0" stroke-width="2.2" stroke-linecap="round"/>
    <ellipse cx="83" cy="46" rx="1.4" ry="1" fill="#4a4262"/>
    <ellipse cx="87" cy="47" rx="1.3" ry="0.9" fill="#4a4262"/>
    <path d="M61 54.5Q72 56.5 85 53.5" fill="none" stroke="#4a4262" stroke-width="1.8" stroke-linecap="round"/>
    <!-- eyes and blush -->
    <ellipse cx="41.5" cy="42" rx="3" ry="3.6" fill="#2b2330"/>
    <ellipse cx="53" cy="41" rx="2.5" ry="3.2" fill="#2b2330"/>
    <circle cx="42.6" cy="40.6" r="1.15" fill="#fff"/>
    <circle cx="53.9" cy="39.8" r="1" fill="#fff"/>
    <ellipse cx="37" cy="49.5" rx="3.8" ry="2.3" fill="#ff8fb8" opacity="0.6"/>

    <!-- the postcard: cream, a thin shaded edge -->
    <rect x="19.5" y="57.5" width="84" height="52" rx="4" fill="#e4c9c0"/>
    <rect x="18" y="56" width="84" height="52" rx="4" fill="#fff7f0"/>

    <!-- the picture on the front: sky, sun, sea, sand -->
    <g clip-path="url(#pic)">
      <rect x="22" y="63" width="40" height="40" fill="#c9e9ff"/>
      <circle cx="31" cy="73" r="5.5" fill="#ffc83d"/>
      <circle cx="29.8" cy="71.8" r="2.4" fill="#ffe189"/>
      <g fill="#fff"><circle cx="48" cy="72" r="3"/><circle cx="52" cy="70" r="4"/><circle cx="56" cy="72.5" r="2.6"/><rect x="45" y="72" width="14" height="3" rx="1.5"/></g>
      <rect x="22" y="80" width="40" height="11" fill="#3fc1cf"/>
      <rect x="22" y="86" width="40" height="5" fill="#1f9cb3"/>
      <path d="M26 83.5h10M44 84.5h8" stroke="#8fe3ea" stroke-width="2" stroke-linecap="round"/>
      <path d="M20 91C30 88 42 88 64 90V105H20Z" fill="#f5dba8"/>
      <path d="M20 99C34 97 48 98 64 100V105H20Z" fill="#e3bb7a"/>
      <path d="M22 90.5C32 88 44 88 62 89.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <path d="M50 95l1.2 2.6 2.8.4-2 2 .5 2.8-2.5-1.4-2.5 1.4.5-2.8-2-2 2.8-.4Z" fill="#ff9c57"/>
    </g>

    <!-- the stamp: a scalloped white edge, a heart -->
    <rect x="77" y="61" width="20" height="23" rx="1" fill="#fff"/>
    <g fill="#fff7f0">
      <circle cx="77" cy="64" r="1.2"/><circle cx="77" cy="69" r="1.2"/><circle cx="77" cy="74" r="1.2"/><circle cx="77" cy="79" r="1.2"/>
      <circle cx="97" cy="64" r="1.2"/><circle cx="97" cy="69" r="1.2"/><circle cx="97" cy="74" r="1.2"/><circle cx="97" cy="79" r="1.2"/>
      <circle cx="81" cy="61" r="1.2"/><circle cx="87" cy="61" r="1.2"/><circle cx="93" cy="61" r="1.2"/>
      <circle cx="81" cy="84" r="1.2"/><circle cx="87" cy="84" r="1.2"/><circle cx="93" cy="84" r="1.2"/>
    </g>
    <rect x="80" y="64" width="14" height="17" rx="1" fill="#ffc4da"/>
    <path d="M87 78C82 74.5 80.5 71.5 82.5 69.5C84 68 86 68.5 87 70.3C88 68.5 90 68 91.5 69.5C93.5 71.5 92 74.5 87 78Z" fill="#ff4f9a"/>
    <path d="M87 78C90 76 92 73.8 92.3 71.8C90.6 74 89 75.4 87 76.4Z" fill="#d8367f"/>

    <!-- wavy lines where the writing goes -->
    <path d="M67 91q3.5-3 7 0t7 0t7 0t7 0M67 98q3.5-3 7 0t7 0t7 0" fill="none" stroke="#b9a6f5" stroke-width="2.2" stroke-linecap="round"/>

    <!-- webbed paws holding the card's edge -->
    <g fill="#7d7499">
      <ellipse cx="32" cy="57" rx="5.2" ry="3.6"/>
      <ellipse cx="51" cy="57.5" rx="5.2" ry="3.6"/>
    </g>
    <path d="M29.5 59v1.3M32 59.5v1.4M34.5 59v1.3M48.5 59.5v1.3M51 60v1.4M53.5 59.5v1.3" stroke="#5a5274" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- a sparkle -->
  <path d="M104 26l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fff"/>
  <path d="M92 18v4M90 20h4" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
</svg>
