<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Italy</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9de"/><stop offset="1" stop-color="#ffc3a8"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <!-- the face of the Colosseum: lit on the left, curving into shade on the right -->
    <linearGradient id="stone" x1="16" y1="0" x2="104" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fdeecc"/><stop offset="0.45" stop-color="#f5dba8"/><stop offset="1" stop-color="#e3bb7a"/></linearGradient>
    <path id="faceP" d="M16 90V40Q38 33 64 33L68 39H76L80 46H88L92 52H98L104 57V90Q60 99 16 90Z"/>
    <clipPath id="face"><use href="#faceP"/></clipPath>
    <!-- one round-topped arch -->
    <path id="arch" d="M-3.5 9V0A3.5 3.5 0 0 1 3.5 0V9Z"/>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="54" r="50" fill="url(#glow)"/>

  <!-- the warm Roman sun -->
  <circle cx="92" cy="24" r="9" fill="#ffe189"/>
  <circle cx="92" cy="24" r="14" fill="#ffe189" opacity="0.35"/>

  <!-- the ground -->
  <path d="M-2 92Q60 84 122 92V122H-2Z" fill="#aee8b7"/>
  <path d="M-2 100Q60 94 122 100V122H-2Z" fill="#73cf86"/>
  <ellipse cx="60" cy="96" rx="44" ry="4.5" fill="#4b3a8c" opacity="0.14"/>

  <!-- the far side of the ring, seen through the broken top -->
  <path d="M60 33Q86 33 104 43V57L92 52L64 38Z" fill="#d9a877"/>

  <!-- the face -->
  <g clip-path="url(#face)">
    <rect x="14" y="30" width="92" height="70" fill="url(#stone)"/>
    <!-- the cornices between the tiers -->
    <g fill="#fff6dc" opacity="0.85">
      <rect x="14" y="44" width="92" height="2.5"/>
      <rect x="14" y="58" width="92" height="2.5"/>
      <rect x="14" y="73" width="92" height="2.5"/>
    </g>
    <!-- three rows of arches, getting darker into the shade -->
    <g fill="#d39b67">
      <use href="#arch" x="22" y="64"/><use href="#arch" x="31" y="64"/><use href="#arch" x="40" y="64"/><use href="#arch" x="49" y="64"/><use href="#arch" x="58" y="64"/>
      <use href="#arch" x="22" y="50"/><use href="#arch" x="31" y="50"/><use href="#arch" x="40" y="50"/><use href="#arch" x="49" y="50"/><use href="#arch" x="58" y="50"/>
      <use href="#arch" x="22" y="79"/><use href="#arch" x="31" y="79"/><use href="#arch" x="40" y="79"/><use href="#arch" x="49" y="79"/><use href="#arch" x="58" y="79"/>
    </g>
    <g fill="#bf8456">
      <use href="#arch" x="67" y="64"/><use href="#arch" x="76" y="64"/><use href="#arch" x="85" y="64"/><use href="#arch" x="94" y="64"/>
      <use href="#arch" x="67" y="50"/><use href="#arch" x="76" y="50"/><use href="#arch" x="85" y="57"/><use href="#arch" x="94" y="60"/>
      <use href="#arch" x="67" y="79"/><use href="#arch" x="76" y="79"/><use href="#arch" x="85" y="79"/><use href="#arch" x="94" y="79"/>
    </g>
    <!-- the little square windows of the top tier -->
    <g fill="#d39b67"><rect x="21" y="37.5" width="5" height="4" rx="1"/><rect x="34" y="36.5" width="5" height="4" rx="1"/><rect x="47" y="36" width="5" height="4" rx="1"/></g>
  </g>
  <path d="M18 40Q38 35 62 35" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>

  <!-- two cypress trees, one on each side -->
  <path d="M10 94C4 82 6 64 11 52C16 64 18 82 12 94Z" fill="#3e9e78"/>
  <path d="M11 52C16 64 18 82 12 94H11Z" fill="#2b7a5f"/>
  <path d="M109 95C103 84 104 70 108.5 60C113 70 115 84 111 95Z" fill="#3e9e78"/>
  <path d="M108.5 60C113 70 115 84 111 95H108.5Z" fill="#2b7a5f"/>

  <!-- a sparkle -->
  <path d="M28 18v6M25 21h6" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
</svg>
