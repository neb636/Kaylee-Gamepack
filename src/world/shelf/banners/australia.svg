<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" preserveAspectRatio="xMidYMid slice">
  <title>Australia</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9fd4fa"/><stop offset="0.6" stop-color="#dcefff"/><stop offset="1" stop-color="#ffe5cc"/></linearGradient>
    <radialGradient id="sunglow" cx="1020" cy="120" r="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff1c0" stop-opacity="1"/><stop offset="0.3" stop-color="#ffe6aa" stop-opacity="0.55"/><stop offset="1" stop-color="#ffe6aa" stop-opacity="0"/></radialGradient>
    <linearGradient id="ground" x1="0" y1="296" x2="0" y2="450" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#f4ac80"/><stop offset="1" stop-color="#e07c5c"/></linearGradient>
    <linearGradient id="far" x1="0" y1="220" x2="0" y2="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#dcb9cf"/><stop offset="1" stop-color="#f0d6d8"/></linearGradient>
    <!-- Uluru: a long rock with steep rounded ends and a gently rolling top -->
    <path id="rock" d="M226 306C230 280 240 256 258 236C274 218 296 206 326 200C360 194 410 190 470 190C520 189 560 194 600 192C650 190 700 192 740 198C772 204 796 216 814 234C834 254 846 280 852 306Z"/>
    <clipPath id="rockC"><use href="#rock"/></clipPath>
    <!-- a gum tree: a pale trunk and soft grey-green crowns, its foot at 0,0 -->
    <g id="gum">
      <path d="M-6 0C-4-30-8-56-20-80L-12-84C0-62 4-40 4-20C10-44 22-64 40-78L46-72C28-54 14-30 8 0Z" fill="#f4ead8"/>
      <path d="M2 0C4-14 4-26 4-20C10-44 22-64 40-78L46-72C28-54 14-30 8 0Z" fill="#dccbb8"/>
      <circle cx="-26" cy="-92" r="22" fill="#9cc79a"/><circle cx="-2" cy="-104" r="26" fill="#7fb486"/><circle cx="30" cy="-96" r="24" fill="#7fb486"/><circle cx="48" cy="-80" r="17" fill="#6aa37a"/>
      <circle cx="-14" cy="-108" r="18" fill="#a9d4a4"/>
      <path d="M-34-100c4-10 12-16 22-18" fill="none" stroke="#c7e7c1" stroke-width="5" stroke-linecap="round"/>
    </g>
    <!-- a tuft of spinifex grass -->
    <g id="tuft">
      <path d="M-22 0C-20-10-14-18-6-22C-10-12-10-6-8 0ZM-10 0C-8-14-2-24 6-28C2-16 2-8 2 0ZM2 0C6-12 12-20 22-24C16-14 14-6 14 0ZM12 0C18-8 24-12 30-12C24-6 22-2 22 0Z" fill="#c9c46e"/>
      <path d="M-8 0C-6-12-2-20 4-24C0-14 0-6 0 0ZM6 0C10-10 16-16 24-18C18-10 16-4 16 0Z" fill="#aaa651"/>
    </g>
    <!-- the kangaroo's body, for its shading -->
    <path id="roo" d="M-52-46C-50-62-30-70-12-62C10-52 30-34 34-10C36 8 24 20 6 20C-14 20-30 8-40-8C-48-20-54-32-52-46Z"/>
    <clipPath id="rooC"><use href="#roo"/></clipPath>
  </defs>

  <!-- sky, the big warm sun, clouds, birds -->
  <rect width="1200" height="310" fill="url(#sky)"/>
  <circle cx="1020" cy="120" r="300" fill="url(#sunglow)"/>
  <circle cx="1020" cy="120" r="84" fill="#ffe3a0" opacity="0.45"/>
  <circle cx="1020" cy="120" r="64" fill="#fff0bf"/>
  <circle cx="1004" cy="104" r="34" fill="#fff8dc" opacity="0.8"/>
  <g fill="#fff" opacity="0.9">
    <circle cx="150" cy="96" r="18"/><circle cx="182" cy="80" r="27"/><circle cx="218" cy="90" r="20"/><circle cx="242" cy="102" r="12"/>
    <rect x="130" y="96" width="124" height="20" rx="10"/>
  </g>
  <g fill="#fff" opacity="0.8">
    <circle cx="590" cy="72" r="14"/><circle cx="614" cy="60" r="20"/><circle cx="640" cy="70" r="14"/>
    <rect x="574" y="70" width="80" height="15" rx="7.5"/>
  </g>
  <g fill="none" stroke="#8a86c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M790 110q7-7 14 0q7-7 14 0"/><path d="M828 88q6-6 12 0q6-6 12 0"/><path d="M850 122q5-5 10 0q5-5 10 0"/>
  </g>

  <!-- far domes and a flat mesa in the haze -->
  <path d="M-10 300V272C10 262 22 248 40 246C54 236 70 238 80 250C92 236 112 236 122 252C134 246 148 252 154 264C176 268 196 272 214 276V300ZM880 300V270C910 266 930 262 944 252L958 242H1052L1068 252C1094 260 1140 264 1210 266V300Z" fill="url(#far)"/>
  <path d="M80 250C92 236 112 236 122 252C116 262 112 276 112 300H86C88 280 86 262 80 250ZM1012 242H1052L1068 252C1094 260 1140 264 1210 266V300H1052C1052 276 1036 254 1012 242Z" fill="#cfa6c2" opacity="0.6"/>

  <!-- Uluru: red rock, lit on the left, shaded on the right, soft grooves -->
  <ellipse cx="540" cy="306" rx="330" ry="8" fill="#b65a4a" opacity="0.25"/>
  <g clip-path="url(#rockC)">
    <rect x="220" y="180" width="640" height="132" fill="#c65a45"/>
    <path d="M226 306C230 280 240 256 258 236C274 218 296 206 326 200C360 194 410 190 470 190C520 189 560 194 600 192C640 190 676 191 712 194C732 232 742 270 746 306Z" fill="#e9785a"/>
    <path d="M226 306C230 280 240 256 258 236C274 218 296 206 326 200C360 194 410 190 470 190C510 189 540 192 560 194C500 198 440 204 390 216C330 232 292 264 274 306Z" fill="#f08c6a"/>
    <path d="M252 270C266 240 290 220 322 210M346 202C400 194 460 192 520 194" fill="none" stroke="#f6a283" stroke-width="7" stroke-linecap="round"/>
    <g fill="none" stroke="#d76b51" stroke-width="5" stroke-linecap="round">
      <path d="M330 226C324 252 324 280 330 304M402 210C398 242 400 274 406 304M478 204C476 236 478 270 482 304M554 206C554 238 556 272 560 304M630 204C632 236 634 270 638 304M694 208C698 238 700 272 704 304"/>
    </g>
    <g fill="none" stroke="#b04e3d" stroke-width="5" stroke-linecap="round">
      <path d="M760 214C770 242 776 274 778 304M808 236C816 258 820 282 822 304"/>
    </g>
    <ellipse cx="360" cy="262" rx="12" ry="7" fill="#c65a45"/><ellipse cx="592" cy="250" rx="10" ry="6" fill="#c65a45"/><ellipse cx="660" cy="276" rx="8" ry="5" fill="#c65a45"/>
  </g>

  <!-- the red outback -->
  <rect y="298" width="1200" height="152" fill="url(#ground)"/>
  <rect y="298" width="1200" height="4" fill="#f9c6a4"/>
  <path d="M0 334C200 322 360 326 520 338C680 350 840 340 1000 328C1100 322 1160 324 1200 326V450H0Z" fill="#e88f68" opacity="0.55"/>
  <g fill="#f9bc97" opacity="0.8">
    <rect x="80" y="326" width="120" height="5" rx="2.5"/><rect x="420" y="360" width="160" height="5" rx="2.5"/><rect x="700" y="340" width="110" height="5" rx="2.5"/><rect x="980" y="382" width="140" height="5" rx="2.5"/>
  </g>
  <g fill="#d26e52">
    <ellipse cx="300" cy="344" rx="10" ry="5"/><ellipse cx="640" cy="388" rx="12" ry="5"/><ellipse cx="1080" cy="352" rx="9" ry="4"/><ellipse cx="160" cy="404" rx="12" ry="5"/>
  </g>
  <g fill="#f9c6a4"><ellipse cx="297" cy="342" rx="5" ry="2"/><ellipse cx="636" cy="386" rx="6" ry="2"/></g>

  <!-- gum trees -->
  <ellipse cx="130" cy="324" rx="60" ry="6" fill="#4b3a8c" opacity="0.15"/>
  <use href="#gum" transform="translate(130 324) scale(1.3)"/>
  <ellipse cx="1110" cy="320" rx="44" ry="5" fill="#4b3a8c" opacity="0.15"/>
  <use href="#gum" transform="translate(1110 320) scale(-1.05 1.05)"/>
  <use href="#gum" transform="translate(1176 306) scale(.6)"/>
  <!-- spinifex -->
  <use href="#tuft" transform="translate(52 344)"/><use href="#tuft" transform="translate(236 332) scale(.8)"/><use href="#tuft" transform="translate(470 320) scale(.7)"/>
  <use href="#tuft" transform="translate(1000 330)"/><use href="#tuft" transform="translate(1160 348) scale(.9)"/><use href="#tuft" transform="translate(760 318) scale(.75)"/>

  <!-- the kangaroo, mid-hop over the sand, heading left -->
  <ellipse cx="920" cy="346" rx="52" ry="5" fill="#4b3a8c" opacity="0.15"/>
  <g fill="#f9c6a4" opacity="0.85"><circle cx="1010" cy="338" r="7"/><circle cx="1026" cy="332" r="5"/><circle cx="1038" cy="340" r="4"/></g>
  <g transform="translate(920 286)">
    <!-- tail, held out for balance -->
    <path d="M24-14C50-14 80-24 104-30C109-31 110-25 105-23C80-12 52 4 26 6Z" fill="#a46e4b"/>
    <!-- back leg and its long foot, stretched out behind -->
    <path d="M8 14C20 22 40 30 64 30C71 30 72 23 66 21C46 19 30 11 20 0Z" fill="#a46e4b"/>
    <!-- body: lit on the upper left, shaded lower right, a cream chest -->
    <g clip-path="url(#rooC)">
      <use href="#roo" fill="#a46e4b"/>
      <use href="#roo" fill="#c99266" transform="translate(-8 -7)"/>
      <ellipse cx="-36" cy="-30" rx="11" ry="19" fill="#f2dcc2" transform="rotate(32 -36 -30)"/>
    </g>
    <ellipse cx="16" cy="2" rx="21" ry="17" fill="#b7805a"/>
    <path d="M2-8C6-14 14-16 22-14" fill="none" stroke="#e5b78f" stroke-width="4" stroke-linecap="round"/>
    <!-- little arms tucked in -->
    <path d="M-48-32C-56-28-60-22-60-16" fill="none" stroke="#a46e4b" stroke-width="7" stroke-linecap="round"/>
    <!-- ears -->
    <ellipse cx="-46" cy="-94" rx="6.5" ry="17" fill="#a46e4b" transform="rotate(14 -46 -94)"/>
    <ellipse cx="-58" cy="-96" rx="6.5" ry="17" fill="#c99266" transform="rotate(-6 -58 -96)"/>
    <ellipse cx="-58" cy="-94" rx="3" ry="11" fill="#ffc4da" transform="rotate(-6 -58 -94)"/>
    <!-- head and muzzle -->
    <circle cx="-56" cy="-70" r="18" fill="#c99266"/>
    <path d="M-44-84a18 18 0 0 1 4 26C-44-64-46-76-44-84Z" fill="#a46e4b"/>
    <ellipse cx="-74" cy="-64" rx="14" ry="10.5" fill="#c99266"/>
    <ellipse cx="-74" cy="-60" rx="10" ry="6" fill="#e5b78f"/>
    <ellipse cx="-86" cy="-67" rx="4" ry="3.2" fill="#2b2330"/>
    <ellipse cx="-61" cy="-74" rx="3.2" ry="3.9" fill="#2b2330"/>
    <circle cx="-59.8" cy="-75.4" r="1.2" fill="#fff"/>
    <ellipse cx="-62" cy="-61" rx="4.2" ry="2.5" fill="#ff8fb8" opacity="0.55"/>
    <path d="M-82-58q3 3 6 0" fill="none" stroke="#2b2330" stroke-width="2" stroke-linecap="round"/>
    <path d="M-66-86C-62-90-56-90-52-88" fill="none" stroke="#e5b78f" stroke-width="4" stroke-linecap="round"/>
  </g>
  <path d="M986 322q14 4 22-4M996 334q12 2 18-4" fill="none" stroke="#fde0cc" stroke-width="3" stroke-linecap="round"/>
</svg>
