  <path d="M118 248L150 264L200 272L250 302H140C140 280 132 262 118 248Z" fill="#dcd5f5"/>
  <path d="M620 302L650 282L690 278L716 258L746 270L780 266L820 302Z" fill="#eee9fb"/>
  <path d="M716 258L746 270L780 266L820 302H740C736 284 728 268 716 258Z" fill="#dcd5f5"/>
  <path d="M1000 302L1030 278L1070 270L1110 252L1150 266L1200 262V302Z" fill="#eee9fb"/>
  <path d="M1110 252L1150 266L1200 262V302H1130C1130 282 1122 264 1110 252Z" fill="#dcd5f5"/>

