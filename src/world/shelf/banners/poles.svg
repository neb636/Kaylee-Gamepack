  <path d="M500 292C510 292 516 298 518 308H496C500 302 502 296 500 292Z" fill="#c3cff3"/>
  <path d="M770 326C772 320 776 317 782 317H798C804 317 808 320 810 326Z" fill="#fff"/>
  <path d="M798 317C804 317 808 320 810 326H796C798 322 799 319 798 317Z" fill="#c3cff3"/>

