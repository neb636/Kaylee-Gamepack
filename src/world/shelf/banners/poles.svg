    <clipPath id="ribbonA"><path d="M-20 168C80 150 160 122 260 128C360 134 420 166 520 160C600 155 660 132 760 112C660 74 600 62 520 76C420 92 360 54 260 50C160 46 80 84 -20 122Z"/></clipPath>
