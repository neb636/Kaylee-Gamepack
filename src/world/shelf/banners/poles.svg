      <rect x="236" y="44" width="11" height="90" rx="5.5"/><rect x="292" y="50" width="5" height="88" rx="2.5"/><rect x="330" y="54" width="8" height="100" rx="4"/>
      <rect x="402" y="62" width="6" height="104" rx="3"/><rect x="436" y="66" width="10" height="100" rx="5"/><rect x="508" y="72" width="5" height="88" rx="2.5"/><rect x="552" y="70" width="9" height="88" rx="4.5"/>
      <rect x="622" y="64" width="6" height="84" rx="3"/><rect x="676" y="74" width="8" height="62" rx="4"/>
