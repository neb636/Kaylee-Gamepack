      <path d="M-11 -18C-12 -30 -12 -40 -6 -44C-3 -46 0 -44 1 -41C2 -44 5 -46 8 -44C14 -40 13 -30 12 -18C12 -6 7 -1 1 -1C-6 -1 -11 -6 -11 -18Z" fill="#fff"/>
