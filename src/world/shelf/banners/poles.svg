      <rect x="738" y="38" width="11" height="90" rx="5.5"/><rect x="796" y="32" width="5" height="86" rx="2.5"/><rect x="838" y="28" width="8" height="80" rx="4"/>
      <rect x="912" y="22" width="6" height="84" rx="3"/><rect x="946" y="22" width="10" height="84" rx="5"/><rect x="1018" y="24" width="5" height="88" rx="2.5"/><rect x="1062" y="28" width="9" height="96" rx="4.5"/>
