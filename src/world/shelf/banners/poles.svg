    <ellipse cx="0" cy="-57" rx="11.5" ry="8.5" fill="#fff7f0"/>
    <path d="M-4.5 -62.5Q0 -65 4.5 -62.5Q3.5 -58.5 0 -58Q-3.5 -58.5 -4.5 -62.5Z" fill="#2b2330"/>
    <ellipse cx="-1.5" cy="-62.5" rx="1.5" ry="1" fill="#fff"/>
    <path d="M0 -58V-55.5M-4 -55.5Q-2 -52.5 0 -55.5Q2 -52.5 4 -55.5" fill="none" stroke="#2b2330" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="-9" cy="-70" rx="3" ry="3.5" fill="#2b2330"/><ellipse cx="9" cy="-70" rx="3" ry="3.5" fill="#2b2330"/>
    <circle cx="-8" cy="-71.5" r="1" fill="#fff"/><circle cx="10" cy="-71.5" r="1" fill="#fff"/>
    <ellipse cx="-15.5" cy="-59" rx="4" ry="2.5" fill="#ff8fb8" opacity="0.55"/><ellipse cx="15.5" cy="-59" rx="4" ry="2.5" fill="#ff8fb8" opacity="0.55"/>
