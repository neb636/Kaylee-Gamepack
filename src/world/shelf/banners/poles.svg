    <radialGradient id="glow" cx="640" cy="300" r="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffe6e4" stop-opacity="0.8"/><stop offset="1" stop-color="#ffe6e4" stop-opacity="0"/></radialGradient>
    <linearGradient id="auroraA" x1="0" y1="50" x2="0" y2="168" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a6f2d4" stop-opacity="0"/><stop offset="0.55" stop-color="#a6f2d4" stop-opacity="0.4"/><stop offset="1" stop-color="#d2fbea" stop-opacity="0.95"/></linearGradient>
