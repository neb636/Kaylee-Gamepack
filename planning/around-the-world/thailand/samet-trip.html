        { "type": "text", "md": "Written 2026-11-04. Thailand's fourth family trip, and the first **open world**: every other trip is a string of places joined by a ride, but Koh Samet is small enough to be *one place*. Kaylee lands on the island and simply goes where she wants: down the beach, into the sea in her floatie, up the path into the trees, onto the green taxi, out on the jet ski. The stops are where the family really went, placed where they really are on the island." },

          { "icon": "🏝️", "title": "Koh Samet", "md": "A long, thin island about **7 km north to south and 3 km across**, a 10-minute speedboat (or 40-minute ferry) from **Ban Phe** pier on the Rayong coast, about three hours' drive from Bangkok. It's a **national park** (Khao Laem Ya–Mu Ko Samet, since 1981), and up to 80% of it is forest. Nearly every beach is on the **east** side (sunrise); the west is mostly rocky, with **Ao Prao** its one real beach (sunset)." },

          { "icon": "✨", "title": "Hat Sai Kaew, “crystal sand”", "md": "The main beach: fine white sand, beach chairs and umbrellas, **jet skis**, banana boats, and **fire shows every night** at the beach bars. On the rocks at its south end the **mermaid and her child** statue looks out to sea." },
          { "icon": "🧜", "title": "The mermaid's story", "md": "The poet **Sunthorn Phu** (about 200 years ago) wrote *Phra Aphai Mani*, a poem so long it took him about 20 years. A prince plays a **magic flute**, a giant of the sea keeps him under the waves, and a **mermaid** helps him escape to this island. Thailand's most famous story-poem, and the reason Samet has mermaids." },
          { "icon": "🌙", "title": "Bays with lovely names", "md": "*Ao* means bay. **Ao Prao** is Coconut Bay, **Ao Wong Duan** is Crescent Moon Bay (it's moon-shaped), **Ao Phai** is Bamboo Bay, **Ao Thian** is Candlelight Bay." },
          { "icon": "🚕", "title": "Getting around", "md": "Narrow concrete and dirt roads, few cars: **songthaews** (green pickup taxis with benches in the back), motorbikes and ATVs. Everyone walks between the beaches on sandy paths over the rocks." },
          { "icon": "☀️", "title": "Weather", "md": "One of the **driest, sunniest places in Thailand**, hot all year, with only a short rainy season. There's no river: fresh water comes from a reservoir in the middle of the island." },
          { "icon": "🤿", "title": "The little islands", "md": "Snorkel boats go out to the small islands east of Samet: **Ko Kudi** (a beach and a reef), **Ko Khang Khao**, “Bat Island” (coral), and **Ko Kham**, joined to its neighbor by a sandbar at low tide. Parrotfish, blue damselfish and cuttlefish; branching, brain, plate and soft corals; sea urchins in the shallows (watch your feet)." }
        ] },
        { "type": "callout", "tone": "warn", "icon": "🙏", "title": "Left out: temples, Buddhas, shrines (AGENTS.md rule 7)", "md": "Samet has **Wat Ko Samet** with a 7 m white Buddha right on the road from Na Dan to Sai Kaew, a **wayside shrine beside the mermaid statue**, the **crab shrine** (Chao Pho Pu Dam) at Na Dan and another shrine near Sai Kaew, and a hill named *Khao Phra Chedi*. None of them go in the game: that stretch of road is just trees, the mermaid stands alone on her rocks, and we never use the hill's name. On the mainland only the pier appears (Ban Phe has temples and spirit houses too)." },

        { "type": "callout", "tone": "dad", "icon": "📱", "title": "Snap the animals", "md": "Mommy lends Kaylee her phone (a big pink button in the corner). Tap it and the screen becomes the phone's camera, still following Kaylee. **Tap an animal** and it's a photo: flash, click, the animal does something cute for the camera, and the photo flies into her **animal book**, filling its silhouette. A good photo (the animal big and in the middle) gets a gold frame. Sparkle says its name once (“A hornbill!”); tap the photo to hear one fact." },
        { "type": "cards", "title": "The animals (real Samet animals; where to find them)", "items": [

          { "icon": "🐿️", "title": "Variable squirrel", "md": "Runs up the palms, chatters." },

        { "type": "list", "title": "The rules of the book", "items": [
          "**Never required.** No stamp or sticker waits on it; it's the reason to wander and to come back.",

      "id": "jetski",
      "title": "The jet ski at Sai Kaew",
      "icon": "🛥️",
      "lede": "`jetski`; Dad's must-have, and greybox 1.",
      "blocks": [
        { "type": "callout", "tone": "dad", "icon": "👆", "title": "Core verb: steer the jet ski with her finger", "md": "**Finger down anywhere on the water and the jet ski heads for it**; the longer and further she holds, the faster it goes (it never needs a button). Let go and it glides, slows and bobs. Daddy sits behind her with his hands over hers (“Whee!”), and the jet ski man pushes them off the sand, like in the photo." },
        { "type": "list", "title": "How it feels", "items": [
          "**Zippy and splashy**: a fast start with the nose lifting, a white rooster tail of spray behind, a lean into every turn, a little slide on tight ones. The wake stays on the water behind her as a white line.",
          "**It bounces over the swell**: small hops on the little waves, a real jump off a big one (the engine whines in the air), and a **big splash** on landing that sprays the camera.",
          "**Why it's fun with no goal:** going fast on the water and making spray is fun by itself, and the wake shows where she's been. Greybox test: a box jet ski on the toon water in a buoy rope square, the beach and the hut as blocks."
        ] },
        { "type": "ladder", "title": "How it deepens (same verb)", "items": [
          { "n": 1, "icon": "💦", "title": "Ride", "tag": "?round=ride", "md": "The calm bay inside the buoy rope. Carve, spray, circle the buoys, splash the swimmers (they squeal and wave), drive through the banana boat's wake. **The secret:** drive a loop and close it, and the wake circle sparkles and fills with jumping fish (a heart-shaped loop gets pink sparkles)." },
          { "n": 2, "icon": "🌊", "title": "Waves", "tag": "?round=waves", "md": "The wind comes up and bigger waves roll in from the open sea. Steer into them to **jump**: higher waves, bigger jumps, a spin in the air on the biggest. The terns dive beside her." },
          { "n": 3, "icon": "🏁", "title": "Race the jet ski man", "tag": "?round=race", "md": "“Race you to the big buoy!” Out round the far orange buoy and back to the beach against the jet ski man. She wins most of the time (he slows behind her, he takes a wide turn), and when he wins it's by a nose: “So close! Again?” and it starts again at once. The **winner rings the bell** on the hut." },
          { "n": "🛥️", "icon": "🗺️", "title": "Then it's hers", "md": "After the stamp the jet ski waits on every beach: ride it round the coast to any beach (the island's fast travel, and the free ride)." }
        ] },
        { "type": "chips", "title": "Things to poke", "items": [
          { "icon": "🔔", "label": "The bell on the jet ski hut" },
          { "icon": "🍌", "label": "The banana boat", "md": "tow it, everyone falls off" },
          { "icon": "🟠", "label": "Buoys", "md": "bonk, they bob and ring" },
          { "icon": "🏊", "label": "Swimmers", "md": "wave, splash back" },
          { "icon": "🐟", "label": "Jumping fish", "md": "follow them" },
          { "icon": "🕊️", "label": "Terns", "md": "dive" },
          { "icon": "🧔", "label": "Daddy", "md": "his cap blows off, he catches it" }

        { "type": "chips", "title": "Silly moments (instead of failure)", "items": [
          { "icon": "🏖️", "label": "Drive up onto the beach", "md": "it skids up the sand, everyone tumbles off laughing, the jet ski man pushes it back" },
          { "icon": "🌀", "label": "Spin in tight circles", "md": "Daddy goes dizzy (“Wooo-ooo!”), spirals over his head" },
          { "icon": "💦", "label": "Splash Mommy on the shore", "md": "she's soaked, then laughs" },
          { "icon": "🚧", "label": "Push through the buoy rope", "md": "the rope stretches like a rubber band and boings her softly back" }
        ] },
        { "type": "list", "title": "Story, teaching, payoff", "items": [
          "**Story frame:** the jet ski man: “Life jacket on!” (she taps the jacket: click, it's on). Daddy: “You steer, Kaylee!” Then her hands are busy. Sparkle only when something is new (“Big waves! Jump them!”, “Race to the buoy!”) or after ~8 s with no finger down (“Touch the water to go!”).",
          "**Teaches by doing:** **life jacket first**, every time (it waits for the click); stay **inside the buoys** where it's safe (the rope boings her back); waves come in from the open sea. Tap-to-hear: Sai Kaew means crystal sand; the jet ski pushes water out the back to go.",
          "**Payoff:** the wake art she drew, the race win and the bell, the pink flag on Sai Kaew, the jet ski hers.",
          "**Replay:** the free ride round the island, a heart to draw, the race again (a little faster)."
        ] },
        { "type": "callout", "tone": "open", "icon": "🎛️", "title": "Feel on knobs (step 1)", "md": "Steering is the thing we got wrong twice (Nan, the bay): the jet ski's top speed, acceleration, turn rate, slide, the finger's dead zone and how big a wave makes a jump are all `knobs()`, with `watch()` graphing her finger against the jet ski's heading. The greybox PR has a `?feel=1` link for Dad's finger." }
      ]

    {
      "id": "sandcastle",
      "title": "Sandcastle at Ao Hin Khok",
      "icon": "🏰",
      "lede": "`sandcastle`; a little calm bay next to Sai Kaew, the swimming beach.",
      "blocks": [
        { "type": "callout", "tone": "dad", "icon": "👆", "title": "Core verb: dig the sand with her finger", "md": "Drag through the sand and it digs: a trench opens under her finger and the sand piles up beside it, wet and dark. Drag along a pile and it grows into a wall. **The sand moves where she touches**, the real stuff, no tools to pick." },
        { "type": "ladder", "title": "How it deepens", "items": [
          { "n": 1, "icon": "⛏️", "title": "Dig", "tag": "?round=dig", "md": "Dig holes and moats, pile walls and hills. Kaylee (on the sand next to it) digs along with her finger, sand flying. A crab pops up out of a hole she digs." },
          { "n": 2, "icon": "🪣", "title": "Bucket towers", "tag": "?round=towers", "md": "Her pink bucket (if she packed it; the beach shop lends one if not): drag it onto the sand and tap it, and it flips and lifts to leave a tower. Different moulds: round tower, square tower, a **unicorn** mould. Push shells and coral bits into the walls." },
          { "n": 3, "icon": "🌊", "title": "The tide comes in", "tag": "?round=tide", "md": "The waves creep up the beach. **Dig a channel** from her moat to the sea and the water rushes in and fills it (the best moment). A hermit crab moves into a tower door. A wave too big washes one tower half away: “Oh no! Build it again!”" },
          { "n": "🧔", "icon": "🏖️", "title": "Side verb: bury Daddy", "md": "Daddy lies down next to the castle: drag sand over him until only his head and toes stick out. Wiggle his toes (tap). He sneezes and the sand flies off." }
        ] },
        { "type": "list", "items": [
          "**Her choices:** where to dig, how big, which moulds, where the shells go, where the channel runs.",
          "**Pokeables:** the hermit crab, a ghost crab running sideways, the beach ball, Mommy reading under the umbrella (she peeks over her book), the ice cream cart, a boat going by, the foam.",
          "**Teaches:** the **tide** comes up the beach and goes down again; wet sand sticks, dry sand runs. Tap-to-hear: crabs dig holes to hide from the sun.",
          "**Payoff:** her castle, which stays on the beach (saved), with water in the moat and a crab living in it. Mommy's photo of it goes in the book.",
          "**Numbers:** 2-3 min, 30-45 touches, 1 line before her hands are busy (Daddy: “Let's build a sandcastle!”)."
        ] }
      ]
    },

      "lede": "`snorkel`; the snorkel boat from Ao Wong Duan's pier out to the little islands.",
      "blocks": [
        { "type": "callout", "tone": "dad", "icon": "👆", "title": "Core verb: lead Kaylee through the water", "md": "The island's verb again, underwater: **her finger leads Kaylee**, face down in her mask on the surface, flippers kicking. The camera is half under the water, half above: sunbeams, the reef below, fish everywhere. Hold far ahead and she kicks faster, bubbles streaming." },
        { "type": "ladder", "title": "How it deepens", "items": [
          { "n": 1, "icon": "🫧", "title": "Float and look", "tag": "?round=float", "md": "The boat (a captain who toots and drops the ladder) stops off Ko Kudi; she splashes in. Swim over the coral: a cloud of blue damselfish swirls round her, parting where she swims and closing behind. Coral sways." },
          { "n": 2, "icon": "🐟", "title": "Follow the parrotfish", "tag": "?round=follow", "md": "A big rainbow parrotfish swims past and waits for her to follow: through a gap between the rocks, over a sandy patch, to a hidden garden of soft coral where more fish live. It goes a little ahead and waits; never too fast." },
          { "n": 3, "icon": "🦑", "title": "The cuttlefish", "tag": "?round=cuttle", "md": "In the garden a cuttlefish hovers. Swim close and it flashes colors, swim closer and it changes again: a rainbow, stripes, pink (for her). Mommy's waterproof camera: snap the fish for the book (the parrotfish, the damselfish, the cuttlefish, a sea urchin, the coral)." }
        ] },
        { "type": "list", "items": [
          "**Silly (instead of failure):** swim into a sea urchin: she boings back off it like a bouncy ball (“Prickly! Look, don't touch!”), never hurt. Swim into the coral: she bumps off softly and a little fish tells her off with bubbles. Swim up to Daddy: he blows a bubble ring.",
          "**Her choices:** where to swim, which fish to follow, what to photograph.",
          "**Pokeables:** a sea cucumber that wiggles, a giant clam that closes, the boat's ladder, the captain, a fish that hides in the coral, the anchor rope, the sunbeams.",
          "**Teaches:** coral is **alive**: look, don't touch; sea urchins are prickly; fish live in the coral like people in a town. Tap-to-hear: the cuttlefish changes color to talk and to hide.",
          "**Payoff:** the fish pages of the book filling up, the cuttlefish's rainbow, the boat ride back with the wind in her mane.",
          "**Numbers:** 2.5-3.5 min, 30-45 touches, 1 line before (the captain: “Masks on! Jump in!”)."
        ] }
      ]
    },

      "lede": "`hideseek`; from Dad's sunset photo: Kaylee covering her eyes by the driftwood tree.",
      "blocks": [
        { "type": "callout", "tone": "dad", "icon": "👆", "title": "Core verb: walk and look (the island's verb)", "md": "Kaylee covers her eyes by the big driftwood tree (just like the photo) and counts with Sparkle, “one… two… three!”. Then **she leads Kaylee round the beach to find Daddy**, peeking behind things; when she's close the hiding place wiggles. Tap it: “Found you!”, Daddy jumps out and spins her round." },
        { "type": "ladder", "title": "How it deepens", "items": [
          { "n": 1, "icon": "🧢", "title": "Easy hides", "tag": "?round=1", "md": "Behind the driftwood tree with his cap sticking out; under a pink umbrella with his feet showing; behind the stack of red chairs." },
          { "n": 2, "icon": "🐶", "title": "Trickier hides", "tag": "?round=2", "md": "In the tangle of roots, under a beach towel (it breathes), in the sea with only his cap floating, up in the pandanus tree. Something always gives him away (a sneeze, a giggle, a crab pinching his toe) if she's stuck for ~8 s, and the spot glows after that." },
          { "n": 3, "icon": "🦄", "title": "Her turn to hide", "tag": "?round=hide", "md": "Daddy covers his eyes. She leads Kaylee to any hiding place she likes (they all glow softly), and Daddy searches **all the wrong places** first (under a coconut, in the ice cream cart, behind Mommy) while she watches and giggles, then: “Found you!” She **wins** when she hides well: he gives up and she pops out (“Kaylee wins!”)." }
        ] },
        { "type": "list", "items": [
          "**Lunch on the deck first (a place, not a stop):** the resort deck above the cove is on the island all day (`deck`): climb the steps, sit, and it's photo 2. Daddy passes the bread basket (tap: a roll), a fresh coconut with a straw arrives (sip), mango sticky rice. A monitor lizard strolls by under the deck, a squirrel in the pandanus, the cream umbrellas flap. 45-90 s, 8-15 touches, no stamp.",
          "**Silly:** hide in a ridiculous place (in the sea in the floatie, behind a thin palm) and Daddy still can't find her, because he looks the wrong way. Tap Daddy while he counts and he peeks (“No peeking!”).",
          "**Teaches:** a game kids everywhere play, and the **sunset is in the west**: this is the island's sunset beach, the sun goes down over the sea and the mainland's hills.",
          "**Payoff:** Daddy found three times, then she beats him. Mommy's photo of the two of them at the tree (the real photo, as unicorns) goes in the book.",
          "**Numbers:** 2-3 min, 25-40 touches, 1 line before (Daddy: “Close your eyes and count!”)."

      "blocks": [
        { "type": "log", "items": [
          { "title": "Greybox 1: the jet ski at Hat Sai Kaew", "date": "2026-11-04", "status": "done", "pr": 322, "open": false, "summary": "Kaylee steers the jet ski with her finger, Daddy behind her, in the island's real coordinates: the calm bay, the waves, the race, the wake loop and the silly beaching, its feel on knobs.", "blocks": [
            { "type": "list", "items": [
              "**The island from the real map:** `island/layout.ts` holds OSM's real coastline of Ko Samet (way 26609854, 394 points at 1:10) and every beach's sand outline (OSM `natural=beach`), the plan's places from their lat/lon, and the bay laid out in the beach's own frame (`bay(u, v)`: along the sand, out to sea). `island/ground.ts` turns it into ground: wide crystal sand on the beaches, granite boulders and a quick rise elsewhere, a green spine of hills, shallows that slope away gently off the sand.",
              "**New in the engine, opt-in so the bay and Canada don't change:** `engine3d/terrain.ts` (a height field from data, toon vertex colors, `heightAt`/`shoreAt`, and a sea texture of depth and shore distance) and `engine3d/lagoon.ts` (tropical water: see-through mint shallows to turquoise, teal and blue in soft bands, a swash line sliding up the sand, rolling waves in the vertex shader that the jet ski rides exactly, lighter crests and white water on big ones, sun glints).",
              "**The look, pushed past a greybox (Dad: “make it visually impressive, best graphics in game so far”):** a gradient sky with the sun's glow, fat toon clouds with lavender bellies, Ko Kudi and its neighbors on the eastern horizon, the mainland's blue hills to the north, coconut palms leaning out over the sand, samet trees and forest up the hill, the pink umbrellas and red chairs, the thatched jet ski hut with its bell, and the mermaid on her rocks. All code-built shapes, no generated art.",
              "**The jet ski** (`jetski/ski.ts`): white with red and yellow stripes and a black seat like the photo, Kaylee up front, Daddy behind with his hands forward, both in life jackets; the jet ski man's has blue stripes.",
              "**The toy** (`jetski/jetski.ts`): finger on the water and it heads there (the shared `engine3d/drive.ts`), a rooster tail of spray, side spray on hard turns, a lean, a slide, the nose lifting, a white wake that stays ~20 s (`jetski/wake.ts`).",
              "**Ride** (`?round=ride`): the life jacket floats by the jet ski and waits for her tap, then the jet ski man pushes them off. The buoy rope stretches like a rubber band where she pushes and boings her back. **The loop secret:** close a loop of wake and it sparkles and fills with jumping fish (a rough heart test makes the sparkles pink).",
              "**Waves** (`?round=waves`): bigger waves roll in from the open sea; a wave lifting it fast then dropping away throws it in the air, a hard throw spins it, a big landing sprays the camera. Terns dive beside her.",
              "**Race** (`?round=race`): 3, 2, 1, 🏁, out round the big orange buoy and back between the pink flags against the jet ski man. He eases off while he's ahead, catches up when she's far ahead, and if she stops he still only wins by a nose; he goes a little slower after each race she loses. The winner rings the bell; 🏆 🔁 after a win, “So close! 🔁” and straight into the next race after a loss.",
              "**Silly, never failing:** fast onto the sand and it skids, Kaylee and Daddy tumble off and lie giggling, the jet ski man walks over and pushes it back out; doughnuts make Daddy dizzy (stars round his head); zooming past Mommy at the water's edge soaks her (she hops, twice); swimmers squeal and wave as she zooms past.",
              "**Pokes:** the bell, the big buoy, the banana boat (everyone falls off and climbs back on), the four swimmers, the three terns, the eight umbrellas (they spin), Daddy (his cap blows off and he catches it), Mommy, the jet ski man, Kaylee (toot toot).",
              "**Feel on knobs** (`?feel=1`): steering (top speed, speeding up, gliding, turn rate, grip, crawl/full-speed distances, the straight-ahead zone, lean, nose lift, camera turn, height, side and look-ahead), the waves and jumps (heights per round, crest spacing, speed, jump threshold and strength, spin, squash, jumps before the race), the rope, the sand and the silly things, and the race's rubber band. The lab graphs her finger against the jet ski. Round chips (🛥️ 🌊 🏁) show at the top right with `?feel=1`."
            ] },

              "**Sai Kaew faces south-south-east, not east:** OSM's sand outline runs west-north-west to east-south-east, from the mermaid's rocks to a little headland. The bay, the camera and the waves follow the real beach.",

              "**More than placeholder blocks:** Dad asked for the best-looking scene so far, so the island, water and sky are already near the look gate. Characters other than the family are still stand-ins.",
              "**The rounds move on by themselves:** ride → waves after ~70 s of riding (sooner after a loop), waves → race after 8 jumps. Knobs `jetSilly.ride` and `jetWaves.jumps`."

              "No voices yet (greybox): no spoken lines, only the 🏁 countdown and the end badges. The full loop adds Sparkle's few lines and the jet ski man's.",
              "The jet ski man is a stand-in (a brown, round-eared animal in an orange vest and a cap) until Dad picks his animal (the plan's pick is an otter).",

          { "title": "Greybox 2: the island to roam", "date": "2026-11-04", "status": "done", "pr": 326, "open": false, "summary": "Kaylee roams the north half of Koh Samet by herself: she follows her finger along the sand, gallops, swims in her floatie, rides the green taxi round the road and the jet ski round the coast, and pokes everything; Mommy and Daddy follow, the pink flags stand on their beaches and the day moves with them.", "blocks": [
            { "type": "list", "items": [
              "**The island to roam** (`island/island.ts`, `?at=` one of nadan, saikaew, hinkhok, phai, wongduan, prao, deck, aonoina): the north half of Koh Samet at 1:10 as one world. **Lead-to-walk:** hold a finger and Kaylee trots after it, hold it far ahead and she gallops (sand puffs, hoofprints that the swash wipes off the wet sand), tap a spot and she walks there; she steers round loungers, palms and the forest's edge instead of stopping. Tap something far away (the taxi, a jet ski, a stop) and she walks to it, then uses it.",
              "**The floatie swim:** walk into the sea and she's in her pink-and-white floatie (her arm floaties pop on too), bobbing on the swell, paddling slower than she walks, out to 26 m from the shore. A big wave lifts her and spins the floatie round (“whee”).",
              "**The ways** (`island/layout.ts` WAYS, smoothed and sampled every 2 m): the concrete road from Na Dan pier down to Sai Kaew, over the spine to Ao Prao and down the middle to Ao Wong Duan, and sandy paths over the rocks between the east coast's beaches, along the north shore to Ao Noi Na and out to the sunset viewpoint. `ground.ts` cuts each way into the hill as a steady climb and paints it (concrete, sand); the forest grows only where she can't walk, so it hems in the paths.",
              "**The green taxi** (`island/taxi.ts`): Krabi's songthaew painted island green (`SAMET_GREEN`), driving the road round Na Dan, Sai Kaew, Ao Prao and Ao Wong Duan, bouncing along, its driver waving each lap. It waits while she's near and glows: tap it (or walk up and tap) and the family climb in the back; at the next stop she taps anywhere to hop off, or rides on round (a toot of a tune each lap).",
              "**The jet ski is hers** (`?flags=jetski`): a jet ski waits at the water's edge on six beaches; tap one up close and she and Daddy ride it with the jet ski's finger steering (`engine3d/drive.ts`), round the coast to any beach. Nose slowly onto a beach and they hop off (the jet ski stays there); the rocks bounce it off. Before the flag, the Sai Kaew jet ski opens the jet ski section, and after a race she wins its 🏝️ button brings her back to the island with the flag up.",
              "**Mommy and Daddy follow** on her trail at a little distance, hopping along; they wait at the water's edge when she swims, catch up off screen after a ride, and when she stops on a beach Daddy lies down on the sand (tap him: he jumps up).",
              "**The stops and the pink flags:** a soft pink ring at each stop (the jet ski at Sai Kaew, the sandcastle mound at Ao Hin Khok, the snorkel boat at Ao Wong Duan's jetty, the driftwood tree at Ao Prao). Only the jet ski opens a section yet; the others give a little show for now (bucket towers pop up round the mound, the boat toots, Daddy pops out from behind the tree). `?flags=` puts up each stop's pink flag on its beach. Quiet hub: after 8 s with nothing touched, a pink flag arrow points at the nearest stop without a flag (at the screen's edge when it's off screen). No idle lines.",
              "**The day moves with the flags** (`scenery.ts` DAY): morning, noon, afternoon, then golden with all four; `?time=night` for the fire show's night (the stars, a crescent moon, fairy lights and lanterns glowing). The sky, the light, the haze, the clouds' bellies, the water's bands and the horizon all follow.",
              "**30+ things to poke** (`props.ts`, `layout.ts` POKES): coconut palms (a coconut drops; on Daddy's head if he's under it, with stars), samet trees (the papery bark flutters off), pink umbrellas (spin; three quick pokes and one takes off like a kite with Kaylee holding on), red chairs (fold flat), the beach ball (she kicks it by running into it; it floats back from the sea), the coconut ice cream cart (a cone in her hand), the bead seller's tray (jingles), crab holes (a crab pops out and scuttles), pink bougainvillea (petals burst), longtails and the speedboat (bob and toot), the hammock at Ao Noi Na, the telescope at the viewpoint, the tamarind tree, the deck's cream umbrellas, the mermaid (a magic-flute tune, her tail splashes), the jet ski hut's bell, the banana boat, swimmers, terns, the flags, the taxi (honk), the family.",
              "**Places:** Na Dan pier on posts with a blue rail and a shelter (she lands at its end), the little shops by the pier, a beach bar on Sai Kaew, Ao Phai, Ao Wong Duan and Ao Prao with fairy lights, lanterns between the palms at Sai Kaew (where the fire show will be), the resort deck on stilts above Ao Prao with tables and rattan chairs (walk up its steps), the snorkel jetty at Ao Wong Duan, the big silver driftwood tree. Mommy's phone, the animal book and the animals are greybox 3.",
              "**The look** (Dad: make it the best-looking place in Thailand): the ground as a fine grid where she walks and a coarse one beyond; coconut palms leaning over every beach, samet trees with pale papery bark, pandanus on stilt roots, round granite boulders on the rocky shores, pink bougainvillea and flowers along the paths, tufts of beach grass; leaves and grass sway in the breeze, soft cloud shadows drift across the island, the crystal sand twinkles, light ripples over the sand in the shallows, hoofprints. **See-through:** whatever stands between the camera and Kaylee dissolves in an even screen-door dither (`island/seethrough.ts`), so the trees never hide her.",
              "**The camera:** on a beach, three-quarters along the sand from over the water's edge (the sea down one side of the screen, the hill and its palms up the other), framed a little out to sea; on the roads and paths it rises over the trees and looks along the way she's going; the taxi and the jet ski get their own. Turns are eased, never with her finger.",
              "**Feel on knobs** (`?feel=1`): her trot, gallop and the distance it starts from, where she stops, the swim speed, how deep before she swims, how far out, the swell and when it spins her; the camera's angle on the beach and in the forest, how much it shows, looks ahead, turns and follows, how far it draws plants; the taxi's speed, how close she hops on, the jet ski's steering and how slowly it must land. The lab graphs her finger against her speed."
            ] },
            { "type": "callout", "tone": "warn", "title": "Changed from the plan", "items": [
              "**The beach camera looks along the sand, not out to sea:** from the land side the hill's forest stood between the camera and her, and straight inland put the sea behind the camera. Three-quarters along the beach from the water's edge shows both.",
              "**The forest is a wall, the ways are the way through:** she walks on the sand, the rocks, the grass at the back of the beaches, the roads and paths and in the sea; the trees grow where she can't go. No NavGrid at island size: she steers toward her finger and turns round what's in the way; taps walk straight there the same way.",

          {
            "title": "Greybox 3: Mommy’s phone and the animal book",
            "date": "2026-11-04",
            "status": "done",
            "open": false,
            "summary": "Mommy’s phone turns the island into a camera: tap an animal and it does something cute for the photo, which flies into Kaylee’s animal book. Fourteen real Samet animals live on the island with their own ways (wander, flee, perch, swim), and the beach clean is the side verb.",
            "blocks": [
              {
                "type": "list",
                "items": [
                  "**The phone** (`book/Book.tsx`, `?phone=1`): a big pink phone button bottom right. Out, the screen gets a pink phone frame and focus corners, the camera comes in closer and leans toward the nearest animal, and Kaylee holds the phone up. **Every tap is a photo:** tap an animal (or near one) and it turns and poses, the flash, the shutter, and the photo flies into the book with its name (“A hornbill!”, a ✨ when it’s new). Tap anything else and it’s a photo of the island (into the phone). Dragging still leads her.",
                  "**Gold photos:** the photo turns toward the animal and zooms in more the closer Kaylee is to it (`book/photo.ts`); the animal tall in the frame and near its middle earns a gold frame (about 3.5 m or closer). A gold photo is never replaced by a plain one.",
                  "**The animals** (`book/models.ts` built from code in the toy look, `book/creatures.ts` alive): monitor lizards waddling in an S and flicking their tongues (Ao Prao, the Sai Kaew bar); squirrels that run up their palm when she comes close and peek round the trunk at her (Sai Kaew, Hin Khok, Ao Prao); a macaque mother and baby on the hill road (the mother reaches for Daddy’s sunglasses as he passes); the shy **mouse-deer** at the forest’s edge on the road into Ao Prao that bounds into the trees if she gallops (walk slowly!); the **hornbill** hopping on its tamarind branch at Ao Wong Duan and flying between its perches; the **flying fox** asleep upside down in a samet tree at Ao Prao, stretching its wings, flapping round the sky at dusk; the reef heron fishing on the mermaid’s rocks (it flies to the next rock); hermit crabs on the wet sand that pop into their shells; the parrotfish nosing round the coral, two crowds of blue damselfish that part round her when she swims, the cuttlefish whose colors change as she comes near (pink up close); urchins (she boings off them, never hurt) and coral in the shallows. The terns and the crab holes’ ghost crabs snap too.",
                  "**Rare ones** (the mouse-deer, the hornbill, the flying fox) sparkle when she’s near and haven’t been snapped; their book slots are sparkly gold.",
                  "**The book** (`book/animals.ts`, `#/world/thailand/samet-trip/book?book=...`): a page per beach (Sai Kaew, Hin Khok and the mermaid’s rocks, Ao Wong Duan, Ao Prao, the forest road) with tabs and dots for what’s found. A lavender silhouette for each animal still to find (tap: where to look), her photo once she has it (tap: its fact), the stop’s sticker in the page’s corner once its flag is up, a gold star and a fanfare when all fourteen are in. Silhouettes and stickers are portraits of the 3D models, drawn once when the island opens.",
                  "**The beach clean** (`book/clean.ts`): a bottle, a plastic bag and a flip-flop wash up on the wet sand (four out at a time on nine spots). Tap one: she walks over and lifts it over her head, and a hermit crab climbs out of the bottle (or from under the flip-flop), a fish jumps where the bag was. Walk up to the beach’s green bin (all seven beaches have one, they glow while she carries): plonk, the lid flaps, sparkles. Another bit washes up 25 s later. Never required.",
                  "**Quiet hints:** an animal she hasn’t snapped close by and the phone away: the phone button glows. No lines.",
                  "**Feel on knobs** (`?feel=1`, “Mommy’s phone”): how far the camera comes in, how much it leans to an animal, how much the photo turns to it, the zoom and the distance it zooms in from, what counts as gold, how far from her finger a tap finds an animal, how far the animals live from the camera."

          {
            "title": "Greybox 4: the sandcastle at Ao Hin Khok",
            "date": "2026-11-04",
            "status": "done",
            "summary": "Her finger moves the real sand on Ao Hin Khok’s beach: dig moats and holes (the sand piles up beside them), pat walls taller, flip three moulds into towers, push shells into them, dig a channel and watch the tide fill the moat, and bury Daddy. Opened from the sandcastle stop on the island; back to the island with its pink flag once the moat has filled.",
            "blocks": [
              {
                "type": "list",
                "items": [
                  "**The sand** (`sandcastle/sand.ts`): a 12 × 13 m height field (12.5 cm cells) laid over the island’s real beach, matching its colors and heights exactly (the island’s ground under it is sunk out of sight). Dragging digs a trench under her finger (a quick swipe still digs a trench, not dots) and the dug sand lands beside it, wet and dark, so a moat dug round leaves a wall on each side; dug sand never lands back in a hole, so a channel across the moat doesn’t dam it. Starting on a pile pats it up into a wall. **Dry sand runs, wet sand sticks:** steep slopes slide down a little every frame, gently for dug (wet) sand, more for dry; the wet sand dries back slowly.",
                  "**The water** (`sand.ts` `flow`): a little water simulation on the same grid. Every point the beach has under the tide is the open sea, held at the sea’s level (the tide plus a surge every few seconds); water flows downhill from there, up any channel she digs and into the moat in under a second, and a pool cut off from the sea slowly soaks away. The lagoon got two opt-in pieces (`engine3d/lagoon.ts`): `tide` lifts the whole sea (its shallows creep up the beach) and `setCut()` leaves the patch’s inland part to the patch’s own water.",
