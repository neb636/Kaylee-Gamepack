<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>My room</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ece6ff"/><stop offset="1" stop-color="#cdbfff"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff6cc"/><stop offset="1" stop-color="#fff6cc" stop-opacity="0"/></radialGradient>
    <clipPath id="headboard"><path d="M17 100V43a8 8 0 0 1 16 0V100Z"/></clipPath>
    <clipPath id="footboard"><path d="M88 100V68a6 6 0 0 1 12 0V100Z"/></clipPath>
    <clipPath id="pillow"><path d="M34 55C33 50.5 39 49.5 44.5 50.5C50 49.5 56.5 50.5 57 55.5C58.5 60.5 57.5 65.5 55.5 68.5C49.5 70 40.5 70 35.5 69C32.5 65 32 60 34 55Z"/></clipPath>
    <clipPath id="blanket"><path d="M46 68Q46 64 50 63.8C62 62.6 76 63.6 92 62.6V84a4.6 4.6 0 0 1-9.2 0a4.6 4.6 0 0 1-9.2 0a4.6 4.6 0 0 1-9.2 0a4.6 4.6 0 0 1-9.2 0a4.6 4.6 0 0 1-9.2 0Z"/></clipPath>
    <clipPath id="tedhead"><circle cx="68" cy="42.5" r="10"/></clipPath>
    <clipPath id="tedbody"><ellipse cx="68" cy="58" rx="9" ry="8"/></clipPath>
    <path id="heart" d="M0 3.5C-4.5 0.5-5.5-2.5-3.5-4C-2-5-0.5-4.5 0-3C0.5-4.5 2-5 3.5-4C5.5-2.5 4.5 0.5 0 3.5Z"/>
    <path id="star" d="M0-5L1.5-2L5-1.5L2.5 0.5L3 4L0 2.5L-3 4L-2.5 0.5L-5-1.5L-1.5-2Z" stroke-width="1.5" stroke-linejoin="round"/>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="58" r="50" fill="url(#glow)"/>
  <ellipse cx="59" cy="101" rx="44" ry="5" fill="#4b3a8c" opacity="0.14"/>

  <!-- a garland of stars and a glowing moon night light -->
  <path d="M8 11Q60 30 112 11" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="43" cy="27" r="15" fill="url(#moonglow)"/>
  <path d="M43 17.5V20" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M44.5 20.5a7.5 7.5 0 1 0 5.5 11.5a6 6 0 1 1-5.5-11.5Z" fill="#ffe189"/>
  <path d="M50 32a7.5 7.5 0 0 1-12 1.5a7 7 0 0 0 12-1.5Z" fill="#ecc95c"/>
  <path d="M38.5 24.5a6 6 0 0 1 3.5-3" fill="none" stroke="#fff6cc" stroke-width="2" stroke-linecap="round"/>
  <g fill="#ffc83d" stroke="#ffc83d"><use href="#star" x="24" y="19"/><use href="#star" x="80" y="23"/></g>
  <g fill="#ff8fb8" stroke="#ff8fb8"><use href="#star" x="62" y="24"/><use href="#star" x="97" y="19"/></g>

  <!-- the bed frame: grape, with a heart on the headboard -->
  <g clip-path="url(#headboard)">
    <rect x="15" y="33" width="20" height="69" fill="#6a57c7"/>
    <path d="M14.5 100V43a8 8 0 0 1 16 0V100Z" fill="#8b78e6"/>
  </g>
  <path d="M22 45a5.5 5.5 0 0 1 4-5.5" fill="none" stroke="#b3a5f2" stroke-width="2.5" stroke-linecap="round"/>
  <use href="#heart" x="25" y="52" fill="#ff8fb8"/>
  <g clip-path="url(#footboard)">
    <rect x="86" y="60" width="16" height="42" fill="#6a57c7"/>
    <path d="M85.5 100V68a6 6 0 0 1 12 0V100Z" fill="#8b78e6"/>
  </g>
  <rect x="33" y="82" width="56" height="8" fill="#8b78e6"/>
  <rect x="33" y="87" width="56" height="3" fill="#6a57c7"/>

  <!-- the mattress and a fluffy pillow -->
  <rect x="33" y="67.5" width="56" height="15" rx="3" fill="#fff"/>
  <rect x="33" y="79" width="56" height="3.5" fill="#e4ddf6"/>
  <g clip-path="url(#pillow)">
    <rect x="31" y="48" width="29" height="24" fill="#e4ddf6"/>
    <path d="M32 52.5C31 48 37 47 42.5 48C48 47 54 48 54.5 53C56 58 55 63 53 66C47 67.5 38.5 67.5 33.5 66.5C30.5 62.5 30 57.5 32 52.5Z" fill="#fff"/>
  </g>
  <path d="M38.5 54Q44 52.5 49.5 54" fill="none" stroke="#e4ddf6" stroke-width="2" stroke-linecap="round"/>

  <!-- the pink blanket with hearts, lit along its top -->
  <g clip-path="url(#blanket)">
    <rect x="44" y="60" width="50" height="34" fill="#e7699c"/>
    <path d="M46 68Q46 64 50 63.8C62 62.6 76 63.6 92 62.6V80.5a4.6 4.6 0 0 1-9.2 0a4.6 4.6 0 0 1-9.2 0a4.6 4.6 0 0 1-9.2 0a4.6 4.6 0 0 1-9.2 0a4.6 4.6 0 0 1-9.2 0Z" fill="#ff8fb8"/>
    <path d="M44 63.8C56 62.6 76 63.6 92 62.6V65.8C76 66.8 56 65.8 44 67Z" fill="#ffc4da"/>
    <path d="M44 72h50" stroke="#ffc4da" stroke-width="2" stroke-dasharray="3 3" opacity="0.8"/>
  </g>
  <g fill="#ff4f9a"><use href="#heart" x="54.5" y="78"/><use href="#heart" x="84" y="76.5"/><use href="#heart" x="69.5" y="82"/></g>

  <!-- a teddy bear sitting against the pillow, a pink bow at its neck -->
  <ellipse cx="59.5" cy="59" rx="3.3" ry="4.8" fill="#a46e4b" transform="rotate(24 59.5 59)"/>
  <g clip-path="url(#tedbody)">
    <rect x="58" y="49" width="20" height="18" fill="#a46e4b"/>
    <ellipse cx="66.5" cy="56.5" rx="9" ry="8" fill="#c99266"/>
    <ellipse cx="67.5" cy="60" rx="5" ry="5" fill="#e5b78f"/>
  </g>
  <ellipse cx="76.5" cy="59" rx="3.3" ry="4.8" fill="#a46e4b" transform="rotate(-24 76.5 59)"/>
  <ellipse cx="62.5" cy="65" rx="4.6" ry="3.6" fill="#c99266"/>
  <ellipse cx="73.5" cy="65" rx="4.6" ry="3.6" fill="#a46e4b"/>
  <ellipse cx="62.5" cy="65.4" rx="2.4" ry="2" fill="#f2c79b"/>
  <ellipse cx="73.5" cy="65.4" rx="2.4" ry="2" fill="#e5b78f"/>
  <circle cx="59.5" cy="34.5" r="4.3" fill="#c99266"/>
  <circle cx="76.5" cy="34.5" r="4.3" fill="#a46e4b"/>
  <circle cx="60" cy="35" r="2.1" fill="#ffc4da"/>
  <circle cx="76" cy="35" r="2.1" fill="#ff8fb8"/>
  <g clip-path="url(#tedhead)">
    <rect x="56" y="31" width="24" height="23" fill="#a46e4b"/>
    <circle cx="66.2" cy="40.8" r="10" fill="#c99266"/>
  </g>
  <path d="M61 36.5a7.5 7.5 0 0 1 4.5-3.5" fill="none" stroke="#e5b78f" stroke-width="2.2" stroke-linecap="round"/>
  <ellipse cx="68" cy="47" rx="5" ry="3.8" fill="#f2c79b"/>
  <ellipse cx="68" cy="45.3" rx="1.9" ry="1.3" fill="#2b2330"/>
  <path d="M68 46.5V47.8M66 47.7Q67 49.3 68 47.8Q69 49.3 70 47.7" fill="none" stroke="#2b2330" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <ellipse cx="63.8" cy="41.5" rx="1.7" ry="2.1" fill="#2b2330"/>
  <ellipse cx="72.2" cy="41.5" rx="1.7" ry="2.1" fill="#2b2330"/>
  <circle cx="64.4" cy="40.7" r="0.75" fill="#fff"/>
  <circle cx="72.8" cy="40.7" r="0.75" fill="#fff"/>
  <ellipse cx="60.6" cy="46.5" rx="2.3" ry="1.4" fill="#ff8fb8" opacity="0.55"/>
  <ellipse cx="75.4" cy="46.5" rx="2.3" ry="1.4" fill="#ff8fb8" opacity="0.55"/>
  <path d="M68 52.5L62.5 50V55ZM68 52.5L73.5 50V55Z" fill="#ff4f9a" stroke="#ff4f9a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M68 52.5L73.5 53V55Z" fill="#d8367f"/>
  <circle cx="68" cy="52.5" r="1.8" fill="#ff8fc0"/>
</svg>
