  "title": "Plan name",
  "icon": "🦄",

  "updated": "YYYY-MM-DD",
  "status": { "label": "Planned", "tone": "lav" },
  "pitch": "<friend> needs <thing>; Kaylee <core verb>s to <payoff>.",

    { "icon": "⏱️", "value": "1.5-3 min", "label": "of play" },

    {
      "id": "toy",
      "title": "The toy",
      "icon": "👆",

        { "type": "callout", "tone": "dad", "title": "Core verb", "md": "The one thing her finger does." },
        { "type": "ladder", "title": "How it deepens", "items": [{ "title": "Easy" }, { "title": "Richer" }, { "title": "A twist" }] }
      ]
    },
    {
      "id": "sections",
      "title": "Sections: tap to play",
      "icon": "🔗",
      "blocks": [{ "type": "sections", "base": "#/world/<place>/<activity>/", "items": [{ "id": "<section>", "name": "Name for Dad", "status": "todo" }] }]
    },
    {
      "id": "build",
      "title": "Build plan",
      "icon": "🧱",
      "blocks": [{ "type": "build", "items": [{ "n": 0, "title": "This plan", "status": "next" }, { "n": 1, "title": "Greybox 1", "status": "todo" }] }]
    },
    {
      "id": "tech",
      "title": "Tech plan",
      "icon": "🛠️",
      "for": "build",
      "group": "For the builder",
      "blocks": [{ "type": "text", "md": "Files, reuse, risks." }]
    }
  ]
}
</script>
