<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Starry Night</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#332e7a"/><stop offset="1" stop-color="#7d6ad8"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#c9bdff" stop-opacity="0.5"/><stop offset="1" stop-color="#c9bdff" stop-opacity="0"/></radialGradient>
    <radialGradient id="moonglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff6cc" stop-opacity="0.45"/><stop offset="1" stop-color="#fff6cc" stop-opacity="0"/></radialGradient>
    <path id="star" d="M0-10L2.5-3.5L9.5-3L4.5 1.5L6 8L0 4.5L-6 8L-4.5 1.5L-9.5-3L-2.5-3.5Z"/>
    <path id="leaf" d="M0 0C4.5 6 5.5 15 1 25C-3.5 16-4 7 0 0Z"/>
    <clipPath id="head"><circle cx="54" cy="42" r="17"/></clipPath>
    <clipPath id="body"><ellipse cx="64" cy="70" rx="17" ry="21"/></clipPath>
    <clipPath id="wing"><path d="M59 55C69 47 81 52 84 63C86.5 72 86 81 83 90C75 85 67 79 62.5 71C60 66 59 61 59 55Z"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="62" r="48" fill="url(#glow)"/>

  <!-- the crescent moon, top left, with its glow -->
  <circle cx="24" cy="24" r="24" fill="url(#moonglow)"/>
  <path d="M27.8 13.7A11 11 0 1 0 27.8 34.3A10.5 10.5 0 0 1 27.8 13.7Z" fill="#fff6cc"/>
  <path d="M27.8 34.3A11 11 0 0 1 14.5 29.5A10.5 10.5 0 0 0 27.8 34.3Z" fill="#fbea9a"/>

  <!-- the Southern Cross, and lots of little stars -->
  <g fill="#fff6cc">
    <use href="#star" transform="translate(93 12) scale(0.5)"/>
    <use href="#star" transform="translate(81 26) scale(0.45)"/>
    <use href="#star" transform="translate(105 24) scale(0.45)"/>
    <use href="#star" transform="translate(94 39) scale(0.55)"/>
    <use href="#star" transform="translate(100.5 31) scale(0.28)"/>
  </g>
  <g fill="#fff">
    <circle cx="46" cy="10" r="1.3"/><circle cx="62" cy="17" r="1"/><circle cx="72" cy="8" r="1.4"/><circle cx="40" cy="22" r="0.9"/>
    <circle cx="10" cy="48" r="1.2"/><circle cx="20" cy="62" r="0.9"/><circle cx="110" cy="50" r="1.3"/><circle cx="104" cy="64" r="1"/>
    <circle cx="112" cy="76" r="0.9"/><circle cx="9" cy="76" r="1"/><circle cx="34" cy="70" r="0.9"/>
  </g>
  <path d="M14 64v6M11 67h6M108 39v5M105.5 41.5h5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>

  <!-- the barred tail hangs down behind the branch -->
  <path d="M70 84C73 92 76 101 78 110C78.8 113.5 84.5 113.5 85 110C85 101 83.5 92 80 83Z" fill="#d98a5a"/>
  <path d="M79.5 85C82.5 93 84.5 101 85 110C84.5 113 82 114 80 113C82 105 81.5 95 78 86Z" fill="#b86f47"/>
  <path d="M73.5 98.5l9.5-1.5M75.5 106l9-1.3" stroke="#a8603d" stroke-width="2.5" stroke-linecap="round"/>

  <!-- the gum branch: lit on top, shaded below, leaves at both ends -->
  <path d="M-4 93C40 90 80 86 124 82V91C80 95 40 99-4 102Z" fill="#8a5b3d"/>
  <path d="M-4 93C40 90 80 86 124 82V85C80 89 40 93-4 96Z" fill="#b17d56"/>
  <path d="M124 88.5C80 92.5 40 96.5-4 99.5V102C40 99 80 95 124 91Z" fill="#6b432e"/>
  <path d="M14 97.5l8-.6M100 88l9-.8" stroke="#6b432e" stroke-width="2" stroke-linecap="round"/>
  <path d="M28 97C24 102 19 106 13 109" fill="none" stroke="#6b432e" stroke-width="2.5" stroke-linecap="round"/>
  <use href="#leaf" transform="translate(24 101) rotate(22)" fill="#3e9e78"/>
  <use href="#leaf" transform="translate(18 105) rotate(-6)" fill="#48a96c"/>
  <use href="#leaf" transform="translate(13 108.5) rotate(40)" fill="#2b7a5f"/>
  <use href="#leaf" transform="translate(110 86) rotate(-12)" fill="#48a96c"/>
  <use href="#leaf" transform="translate(116 85) rotate(20)" fill="#2b7a5f"/>

  <!-- body: a cream tummy, shaded bottom-right -->
  <g clip-path="url(#body)">
    <rect x="45" y="48" width="38" height="44" fill="#efdccd"/>
    <ellipse cx="61" cy="67" rx="17" ry="21" fill="#fff7f0"/>
  </g>
  <!-- the brown wing with its blue patch -->
  <g clip-path="url(#wing)">
    <rect x="56" y="45" width="34" height="55" fill="#8a5b3d"/>
    <path d="M59 55C69 47 81 52 84 63C85.5 70 85 77 82.5 84C76 80 68 75 63.5 69C60.5 65 59 60 59 55Z" fill="#a46e4b"/>
    <ellipse cx="68.5" cy="60" rx="7" ry="4.5" transform="rotate(25 68.5 60)" fill="#8ccfff"/>
    <ellipse cx="70.5" cy="62" rx="5" ry="2.5" transform="rotate(25 70.5 62)" fill="#5fb0ea"/>
    <path d="M70 75l6 4M74 70l6 4" stroke="#c99266" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <path d="M63 54C68 51.5 74 51.5 78 54" fill="none" stroke="#c99266" stroke-width="2.4" stroke-linecap="round"/>
  <!-- little grey feet gripping the branch -->
  <path d="M55 89.5C55 87 57 86 59 86.5C61 87 62 88.5 61.5 90.5ZM64.5 88.5C64.5 86 66.5 85 68.5 85.5C70.5 86 71.5 87.5 71 89.5Z" fill="#9790ba"/>

  <!-- head: cream, a brown cap and the eye stripe, a shaded crescent -->
  <g clip-path="url(#head)">
    <rect x="35" y="23" width="38" height="38" fill="#efdccd"/>
    <circle cx="51.5" cy="39.5" r="17" fill="#fff7f0"/>
    <path d="M34 22H74V39C69 36 65 36.5 61 33.5C57 36 52 34 47.5 35.5C43 36.5 39 34.5 34 36Z" fill="#a46e4b"/>
    <path d="M62 22H74V39C69 36 65 36.5 61.5 34C64 30 64 26 62 22Z" fill="#8a5b3d"/>
    <path d="M55 40.5C60 38 66 38 73 39.5V45C66 44 60 44 55 43.5Z" fill="#8a5b3d"/>
  </g>
  <path d="M44 29.5C46 27.5 49 26.5 52 26.3M56.5 26.5l1.5 2.5" fill="none" stroke="#c99266" stroke-width="2.2" stroke-linecap="round"/>

  <!-- the big kookaburra beak, smiling at the gape -->
  <path d="M45 40.5C36 41 25.5 44.5 15 51C25.5 51 35.5 50.5 46 49.5Z" fill="#5b5072"/>
  <path d="M43.5 42.5C36 43.5 29 45.5 22 48.5" fill="none" stroke="#8a80a3" stroke-width="2" stroke-linecap="round"/>
  <path d="M46 49.5C35.5 50.5 25.5 51 16 52C25.5 56 35.5 57.5 45 55.5Z" fill="#f5dba8"/>
  <path d="M45 55.5C35.5 57.5 25.5 56 16 52C25.5 54.5 36 55 46 53Z" fill="#e3bb7a"/>
  <path d="M43 50Q46.5 50.5 48 47.5" fill="none" stroke="#2b2330" stroke-width="2" stroke-linecap="round"/>

  <!-- eye and blush -->
  <ellipse cx="51.5" cy="38.5" rx="2.9" ry="3.5" fill="#2b2330"/>
  <circle cx="52.6" cy="37.2" r="1.15" fill="#fff"/>
  <ellipse cx="55" cy="49" rx="3.6" ry="2.2" fill="#ff8fb8" opacity="0.55"/>
</svg>
