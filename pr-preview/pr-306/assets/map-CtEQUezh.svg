<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Thailand map</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0f2ff"/><stop offset="1" stop-color="#b3dbff"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="paper"><path d="M20 38L42 30L64 38L86 30L100 35V92L86 87L64 95L42 87L20 95Z"/></clipPath>
    <clipPath id="pin"><path d="M79 70C70 58 64 51 64 42.5A15 15 0 0 1 94 42.5C94 51 88 58 79 70Z"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>
  <ellipse cx="60" cy="101" rx="42" ry="5" fill="#4b3a8c" opacity="0.14"/>

  <!-- the folded map: sea, green land, a dotted path -->
  <g clip-path="url(#paper)">
    <rect x="18" y="28" width="84" height="70" fill="#8ccfff"/>
    <path d="M18 28H70C66 36 70 42 64 48C58 54 52 50 47 56C42 62 46 70 40 76C35 81 28 80 18 84Z" fill="#73cf86"/>
    <path d="M30 40C34 37 40 37 44 40C41 44 34 45 30 40Z" fill="#aee8b7"/>
    <path d="M24 64C28 60 34 61 36 65C32 68 27 68 24 64Z" fill="#48a96c"/>
    <path d="M102 58C94 56 86 60 82 66C78 72 82 80 88 84C92 86 98 86 102 84Z" fill="#73cf86"/>
    <path d="M54 72C58 68 64 69 66 73C64 77 57 77 54 72Z" fill="#fbea9a"/>
    <path d="M57 72.5C58.5 71 61 71 62.5 72.5" stroke="#73cf86" stroke-width="2" stroke-linecap="round"/>
    <g stroke="#c9e9ff" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M72 50q3-2 6 0M84 78q3-2 6 0M48 84q3-2 6 0"/>
    </g>
    <path d="M30 52C38 58 44 64 52 66C60 68 66 64 72 56" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.1 5.5"/>
    <!-- the folds: the inner panels lean away from the light -->
    <path d="M42 30L64 38V95L42 87Z" fill="#4b3a8c" opacity="0.16"/>
    <path d="M86 30L100 35V92L86 87Z" fill="#4b3a8c" opacity="0.16"/>
    <path d="M20 38L42 30V87L20 95Z" fill="#fff" opacity="0.12"/>
    <path d="M64 38L86 30V87L64 95Z" fill="#fff" opacity="0.12"/>
  </g>
  <path d="M20 95L42 87L64 95L86 87L100 92V95.5L86 90.5L64 98.5L42 90.5L20 98.5Z" fill="#dedaf0"/>
  <circle cx="30" cy="52" r="3.4" fill="#ff4f9a"/>
  <circle cx="30" cy="52" r="1.4" fill="#fff"/>

  <!-- the big pink pin with a heart -->
  <ellipse cx="79" cy="70.5" rx="6.5" ry="2.4" fill="#4b3a8c" opacity="0.2"/>
  <g clip-path="url(#pin)">
    <rect x="62" y="26" width="34" height="46" fill="#d8367f"/>
    <circle cx="76.5" cy="41" r="15.5" fill="#ff4f9a"/>
    <path d="M70 60L79 70L76 52Z" fill="#ff4f9a"/>
  </g>
  <path d="M68.5 38a11 11 0 0 1 6-7" fill="none" stroke="#ff8fc0" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="79" cy="42.5" r="8.5" fill="#fff"/>
  <path d="M79 47C74.5 44 73.5 41 75.5 39.5C77 38.5 78.5 39 79 40.4C79.5 39 81 38.5 82.5 39.5C84.5 41 83.5 44 79 47Z" fill="#ff4f9a"/>
  <path d="M93 22v5M90.5 24.5h5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
</svg>
