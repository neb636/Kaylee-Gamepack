<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Wake the Sphinx</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff5d1"/><stop offset="1" stop-color="#ffe08f"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <!-- the lion body lying down, the striped headdress, the face -->
    <path id="bodyP" d="M29 64C38 59 58 59 72 59C86 58 95 61 100 68C105 75 106 86 103 93C101 97 97 99 92 99H38C32 99 28 94 27.5 87C27 79 27.5 70 29 64Z"/>
    <clipPath id="body"><use href="#bodyP"/></clipPath>
    <path id="hoodP" d="M44 23C57 23 66 31 67 44L69 77Q69 80 66 80H57L55 63H33L31 80H22Q19 80 19 77L21 44C22 31 31 23 44 23Z"/>
    <clipPath id="hood"><use href="#hoodP"/></clipPath>
    <clipPath id="hoodLit"><use href="#hoodP" transform="translate(-3.5 -2.5)"/></clipPath>
    <path id="stripes" d="M44 54L39 14.5H49ZM44 54L59.5 17L68 22ZM44 54L76 30L81 38.5ZM44 54L20 22L28.5 17ZM44 54L7 38.5L12 30ZM15 50H73V54H15ZM15 58H73V62H15ZM15 66H73V70H15ZM15 74H73V78H15Z"/>
    <clipPath id="face"><ellipse cx="44" cy="56" rx="15.5" ry="15.5"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>
  <ellipse cx="64" cy="100.5" rx="44" ry="5" fill="#4b3a8c" opacity="0.14"/>

  <!-- the tail curling up behind -->
  <path d="M100 88C108.5 86.5 111 79.5 107 74" fill="none" stroke="#ebb57f" stroke-width="4.5" stroke-linecap="round"/>
  <ellipse cx="106" cy="72" rx="3.4" ry="4.4" transform="rotate(-25 106 72)" fill="#c98563"/>

  <!-- the lion body: shaded underneath and at the back, a lit back -->
  <g clip-path="url(#body)">
    <rect x="25" y="55" width="84" height="47" fill="#cf9373"/>
    <use href="#bodyP" fill="#ebb57f" transform="translate(-3 -4)"/>
  </g>
  <path d="M68 62.5C80 61.5 89 63 95 66.5" fill="none" stroke="#f8d4a5" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M78 80C75.5 86 77 93 82 97" fill="none" stroke="#cf9373" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="86" cy="97.5" rx="8" ry="4" fill="#f8d4a5"/>
  <path d="M84 96V98.5M88 96V98.5" stroke="#e0ad80" stroke-width="2" stroke-linecap="round"/>

  <!-- front paws side by side -->
  <path d="M44.5 84V92" stroke="#cf9373" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="35" cy="96.5" rx="9.5" ry="5.5" fill="#f8d4a5"/>
  <ellipse cx="54" cy="97" rx="9.5" ry="5.5" fill="#f8d4a5"/>
  <path d="M57 101.5a9.5 5.5 0 0 0 6.2-3.2" fill="none" stroke="#e8b98c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M32 94.5V97.5M37.5 94.5V97.5M51 95V98M56.5 95V98" stroke="#e0ad80" stroke-width="2" stroke-linecap="round"/>

  <!-- the headdress: blue and gold stripes, shaded on the right -->
  <g clip-path="url(#hood)">
    <rect x="15" y="20" width="58" height="64" fill="#eba123"/>
    <use href="#stripes" fill="#4d94d8"/>
    <g clip-path="url(#hoodLit)">
      <rect x="15" y="20" width="58" height="64" fill="#ffc83d"/>
      <use href="#stripes" fill="#6cb2f0"/>
    </g>
  </g>

  <!-- the sleepy face -->
  <g clip-path="url(#face)">
    <rect x="27" y="39" width="34" height="34" fill="#eab585"/>
    <ellipse cx="41.5" cy="54" rx="15.5" ry="15.5" fill="#f9d8ab"/>
  </g>
  <path d="M28 49Q44 32 60 49L59 53Q44 40 29 53Z" fill="#ffc83d"/>
  <path d="M32 47.5Q44 37.5 56 47.5" fill="none" stroke="#ffe189" stroke-width="2" stroke-linecap="round"/>
  <path d="M33 57.5Q36.5 61 40 57.5M48 57.5Q51.5 61 55 57.5" fill="none" stroke="#2b2330" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="34" cy="63.5" rx="3.4" ry="2" fill="#ff8fb8" opacity="0.55"/>
  <ellipse cx="54" cy="63.5" rx="3.4" ry="2" fill="#ff8fb8" opacity="0.55"/>
  <ellipse cx="44" cy="62" rx="1.8" ry="1.3" fill="#e5a07a"/>
  <path d="M41.5 65.5Q44 67.5 46.5 65.5" fill="none" stroke="#2b2330" stroke-width="2" stroke-linecap="round"/>

  <!-- sleep puffs drifting up -->
  <circle cx="72" cy="36" r="3" fill="#e4ddf6"/><circle cx="71.4" cy="35.4" r="2.3" fill="#fff"/>
  <circle cx="80" cy="27.5" r="4.2" fill="#e4ddf6"/><circle cx="79.2" cy="26.7" r="3.3" fill="#fff"/>
  <circle cx="90" cy="18" r="5.6" fill="#e4ddf6"/><circle cx="89" cy="17" r="4.5" fill="#fff"/>
</svg>
