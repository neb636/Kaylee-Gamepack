<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>The Great Wall</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0f2ff"/><stop offset="1" stop-color="#b3dbff"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="crenNear"><path d="M46.5 52C34 55 14 65-2 79V84C14 70 34 60 46.5 57Z"/></clipPath>
    <clipPath id="crenFar"><path d="M77 58.5C84 60.5 88 64.5 94 64.5C102 64.5 108 56.5 122 56.5V60C108 60 102 68 94 68C88 68 84 64 77 62Z"/></clipPath>
    <clipPath id="tree"><circle r="7"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>

  <!-- clouds -->
  <g fill="#fff" opacity="0.9">
    <circle cx="16" cy="32" r="6"/><circle cx="24" cy="27" r="8.5"/><circle cx="32" cy="31" r="6"/>
    <rect x="10" y="30" width="28" height="8" rx="4"/>
    <circle cx="93" cy="28" r="4.5"/><circle cx="99" cy="24.5" r="6"/><circle cx="105" cy="28" r="4.5"/>
    <rect x="88.5" y="27" width="21" height="6" rx="3"/>
  </g>

  <!-- far mountains in the haze, shaded on the right -->
  <path d="M-2 62C8 52 22 50 32 56C42 46 58 40 72 46C84 38 104 38 122 50V120H-2Z" fill="#cfdcf6"/>
  <path d="M94 39.5C106 39.5 115 45 122 50V74H100C99 60 98 48 94 39.5Z" fill="#bccbf0"/>

  <!-- the far hill and the wall running away over it -->
  <path d="M68 120V70H77C84 72 88 75 94 75C102 75 108 66 122 66V120Z" fill="#9edcab"/>
  <path d="M77 62C84 64 88 68 94 68C102 68 108 60 122 60V66C108 66 102 75 94 75C88 75 84 72 77 70Z" fill="#f1d0a0"/>
  <path d="M77 62C84 64 88 68 94 68C102 68 108 60 122 60V62C108 62 102 70 94 70C88 70 84 66 77 64Z" fill="#fbe4c0"/>
  <path d="M76 62H122" stroke="#f1d0a0" stroke-width="20" stroke-dasharray="3 2.2" clip-path="url(#crenFar)"/>

  <!-- the near hill: lit on the left, shaded on its right flank -->
  <path d="M-2 102C14 90 34 74 46.5 70H77C88 72 104 84 122 92V122H-2Z" fill="#73cf86"/>
  <path d="M77 70C88 72 104 84 122 92V122H88C88 100 84 82 77 70Z" fill="#48a96c"/>
  <path d="M10 112C18 104 26 99 36 94" fill="none" stroke="#aee8b7" stroke-width="3" stroke-linecap="round"/>

  <!-- the near wall, coming down toward us -->
  <path d="M46.5 57C34 60 14 70-2 84V102C14 90 34 74 46.5 70Z" fill="#efc994"/>
  <path d="M46.5 57C34 60 14 70-2 84V87C14 73 34 63 46.5 60Z" fill="#fbe4c0"/>
  <path d="M46.5 67C34 71 14 87-2 99V102C14 90 34 74 46.5 70Z" fill="#d6a46e"/>
  <path d="M44 64C34 67 18 76 4 87" fill="none" stroke="#dfb07a" stroke-width="2" stroke-dasharray="4 6" stroke-linecap="round"/>
  <path d="M-2 66H48" stroke="#efc994" stroke-width="40" stroke-dasharray="4.5 3" clip-path="url(#crenNear)"/>

  <!-- the watchtower: lit front, shaded side, crenellations, arched windows, a pink pennant -->
  <rect x="57.5" y="18" width="2" height="14" fill="#a46e4b"/>
  <path d="M59.5 18.5L71 22L59.5 25.5Z" fill="#ff8fb8"/>
  <path d="M59.5 22.2L71 22L59.5 25.5Z" fill="#e7699c"/>
  <rect x="70.5" y="36" width="7" height="34" fill="#d6a46e"/>
  <rect x="72.5" y="31" width="5" height="6" fill="#d6a46e"/>
  <rect x="46.5" y="36" width="24" height="34" fill="#efc994"/>
  <g fill="#efc994">
    <rect x="46.5" y="31" width="4.5" height="6"/><rect x="53" y="31" width="4.5" height="6"/>
    <rect x="59.5" y="31" width="4.5" height="6"/><rect x="66" y="31" width="4.5" height="6"/>
  </g>
  <rect x="46.5" y="36" width="24" height="2.5" fill="#fbe4c0"/>
  <g fill="#fbe4c0">
    <rect x="46.5" y="31" width="4.5" height="1.5"/><rect x="53" y="31" width="4.5" height="1.5"/>
    <rect x="59.5" y="31" width="4.5" height="1.5"/><rect x="66" y="31" width="4.5" height="1.5"/>
  </g>
  <path d="M50.5 50V44a2.5 2.5 0 0 1 5 0V50ZM61.5 50V44a2.5 2.5 0 0 1 5 0V50Z" fill="#7d6888"/>
  <rect x="49" y="56" width="7" height="2.5" rx="1.25" fill="#fbe4c0"/>
  <rect x="60" y="62" width="7" height="2.5" rx="1.25" fill="#fbe4c0"/>
  <rect x="72.5" y="54" width="3.5" height="2.5" rx="1.25" fill="#c48f5c"/>

  <!-- two round trees -->
  <rect x="30.5" y="100" width="3" height="10" rx="1.5" fill="#8a5b3d"/>
  <g transform="translate(32 96)" clip-path="url(#tree)">
    <rect x="-8" y="-8" width="16" height="16" fill="#2b7a5f"/>
    <circle cx="-1.5" cy="-1.5" r="7" fill="#3e9e78"/>
    <ellipse cx="-3" cy="-3.5" rx="2.6" ry="1.7" fill="#69c19a"/>
  </g>
  <rect x="98.5" y="93" width="3" height="10" rx="1.5" fill="#6b432e"/>
  <g transform="translate(100 89)" clip-path="url(#tree)">
    <rect x="-8" y="-8" width="16" height="16" fill="#2b7a5f"/>
    <circle cx="-1.5" cy="-1.5" r="7" fill="#3e9e78"/>
    <ellipse cx="-3" cy="-3.5" rx="2.6" ry="1.7" fill="#69c19a"/>
  </g>
</svg>
