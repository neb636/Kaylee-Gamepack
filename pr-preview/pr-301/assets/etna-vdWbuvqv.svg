<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Snow on a volcano</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ece6ff"/><stop offset="1" stop-color="#cdbfff"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <path id="coneP" d="M0 100C24 96 38 67 45 48C46.5 44.5 48 43 51 42.5Q60 46 69 42.5C72 43 73.5 44.5 75 48C82 67 96 96 120 100Z"/>
    <clipPath id="cone"><use href="#coneP"/></clipPath>
    <!-- the lit side of the mountain: everything left of the line from the crater's right rim down to the foot -->
    <path id="litP" d="M-2 0H69V42.5C73 56 75 78 73 100V122H-2Z"/>
    <clipPath id="lit"><use href="#litP"/></clipPath>
    <path id="capP" d="M20 30H100V60C97 59.5 95 57.5 91.5 58C88 58.5 87 64 83 64C79 64 78.5 58 74.5 58C70.5 58 70 65 66 65C62 65 61.5 59 57.5 59C53.5 59 53 64.5 49 64.5C45 64.5 44.5 58.5 40.5 58.5C36.5 58.5 35 61.5 31 61.5C27 61.5 24 59.5 20 59.5Z"/>
    <g id="puff">
      <circle cx="61" cy="38.5" r="3.6"/>
      <circle cx="65.5" cy="31.5" r="5"/>
      <circle cx="72.5" cy="22" r="6.5"/><circle cx="82" cy="17.5" r="8"/><circle cx="91.5" cy="22.5" r="5.5"/>
      <rect x="67" y="21" width="30" height="8" rx="4"/>
    </g>
    <path id="runner" d="M-19 0H11C17 0 20.5-3.5 20-8C19.5-12 15.5-13.5 13.5-11" fill="none" stroke-width="3.4" stroke-linecap="round"/>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>

  <!-- a soft puff of smoke drifting up out of the crater -->
  <use href="#puff" fill="#ddd5f5"/>
  <use href="#puff" fill="#fff" transform="translate(-1.5 -1.5)"/>

  <!-- Etna: dusky volcanic rock, shaded on the right, a snowy cap with drips -->
  <g clip-path="url(#cone)">
    <rect y="40" width="120" height="62" fill="#7c70ad"/>
    <use href="#litP" fill="#9d92c9"/>
    <path d="M23 90C29 83 34 75 37 67" fill="none" stroke="#b8aede" stroke-width="3" stroke-linecap="round"/>
    <path d="M86 72C88 78 91 84 95 90M78 80C79 86 80 91 81 96" fill="none" stroke="#6a5f9c" stroke-width="2.4" stroke-linecap="round"/>
    <use href="#capP" fill="#e4ddf6"/>
    <use href="#capP" fill="#fff" clip-path="url(#lit)"/>
    <path d="M42.5 66C42 71 40.5 75 39 79M53 67C53 72 52 76 51 80" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M79.5 66C80.5 71 82 75 84 79" fill="none" stroke="#e4ddf6" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <path d="M51 42.5Q60 47.5 69 42.5Q60 45 51 42.5Z" fill="#c9c0ec"/>

  <!-- snow at its foot -->
  <path d="M-2 94C18 87 40 87 58 92C76 97 98 95 122 88V122H-2Z" fill="#fff"/>
  <path d="M-2 108C26 103 56 103 84 107C98 109 110 109 122 106V122H-2Z" fill="#e4ddf6"/>

  <!-- the little red sled -->
  <g transform="translate(60 102)">
    <ellipse cx="1" cy="1" rx="22" ry="3" fill="#4b3a8c" opacity="0.15"/>
    <use href="#runner" stroke="#c23f58" transform="translate(2.5 -2.5)"/>
    <path d="M-12-7V-1M5-7V-1" stroke="#d9485e" stroke-width="3" stroke-linecap="round"/>
    <rect x="-20" y="-13.5" width="35" height="7" rx="3" fill="#d9485e"/>
    <rect x="-20" y="-14.5" width="35" height="5" rx="2.5" fill="#ff6b6b"/>
    <path d="M-17-12.5H5" stroke="#ffa3a3" stroke-width="2" stroke-linecap="round"/>
    <use href="#runner" stroke="#ff6b6b"/>
    <path d="M20-9C27-8 28 0 33-0.5" fill="none" stroke="#ffc83d" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- falling snowflakes and a sparkle -->
  <g fill="#fff"><circle cx="30" cy="77" r="1.6"/><circle cx="92" cy="74" r="1.5"/><circle cx="84" cy="86" r="1.3"/><circle cx="20" cy="56" r="1.6"/><circle cx="104" cy="58" r="1.5"/></g>
  <path d="M30 30v5M27.5 32.5h5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
</svg>
