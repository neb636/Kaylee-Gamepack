<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Barber</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe1ee"/><stop offset="1" stop-color="#ffbcd8"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>
  <ellipse cx="60" cy="103" rx="34" ry="5" fill="#4b3a8c" opacity="0.14"/>

  <!-- the comb, behind -->
  <g transform="translate(58 62) rotate(-40)">
    <path d="M-27-1v10M-22.2-1v10M-17.4-1v10M-12.6-1v10M-7.8-1v10M-3-1v10M1.8-1v10M6.6-1v10M11.4-1v10M16.2-1v10M21-1v10M25.8-1v10" stroke="#5fb0ea" stroke-width="2.8" stroke-linecap="round"/>
    <rect x="-31" y="-9" width="62" height="9" rx="4.5" fill="#8ccfff"/>
    <rect x="-31" y="-4" width="62" height="4" rx="2" fill="#5fb0ea"/>
    <path d="M-27-6.5H20" stroke="#c9e9ff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- the scissors: open, steel blades, grape handles -->
  <g transform="translate(62 60) rotate(-32)">
    <!-- the back half: its blade points left, its handle goes right -->
    <path d="M2.5 2L10 17" stroke="#6a57c7" stroke-width="6.5" stroke-linecap="round"/>
    <circle cx="11.5" cy="25" r="8.5" fill="none" stroke="#8b78e6" stroke-width="5.5"/>
    <path d="M20 25A8.5 8.5 0 0 1 11.5 33.5" fill="none" stroke="#6a57c7" stroke-width="5.5"/>
    <path d="M4 3.5L-6-42Q-8.5-46.5-11-42.5C-12.5-30-10-12-5 3.5Z" fill="#dedaf0"/>
    <path d="M4 3.5L-6-42Q-7.5-44.5-9-43.5C-7.5-30-4-12-1 3.5Z" fill="#bcb6d6"/>
    <path d="M-10-36C-10.5-26-8.5-14-6-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <!-- the front half: its blade points right, its handle goes left -->
    <path d="M-3.5 3.5L6-42Q8.5-46.5 11-42.5C12.5-30 10-12 5 3.5Z" fill="#dedaf0"/>
    <path d="M1 3.5L7.5-41Q9.5-44 11-42.5C12.5-30 10-12 5 3.5Z" fill="#bcb6d6"/>
    <path d="M6.5-36C6-26 3.5-14 1-5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <path d="M-2.5 2L-10 17" stroke="#8b78e6" stroke-width="6.5" stroke-linecap="round"/>
    <circle cx="-11.5" cy="25" r="8.5" fill="none" stroke="#8b78e6" stroke-width="5.5"/>
    <path d="M-3 25A8.5 8.5 0 0 1-11.5 33.5" fill="none" stroke="#6a57c7" stroke-width="5.5"/>
    <path d="M-18.5 21A8.5 8.5 0 0 1-14 17" fill="none" stroke="#b3a5f2" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="1" r="3.6" fill="#ffc83d"/>
    <circle cx="-0.8" cy="0.2" r="1.3" fill="#ffe189"/>
  </g>

  <!-- a curl of cut hair, and two little snips falling -->
  <path d="M77 40C73 30 80 22 88 23C95 24 97 32 92 35.5C88 38 84.5 34.5 87.5 31" fill="none" stroke="#8a5b3d" stroke-width="5.5" stroke-linecap="round"/>
  <path d="M77.5 35C77 28 82 24 87 24" fill="none" stroke="#b17d56" stroke-width="2" stroke-linecap="round"/>
  <path d="M25 70q3-4 7-1M30 82q2.5-3.5 6-1.5" fill="none" stroke="#8a5b3d" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M98 50v5M95.5 52.5h5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
</svg>
