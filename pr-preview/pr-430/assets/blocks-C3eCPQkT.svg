<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Giant blocks</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9de"/><stop offset="1" stop-color="#ffc3a8"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="arch"><path d="M26 98.5V82.5Q26 80 28 78.5L31 76.5Q33 75 35.5 75H88.5Q91 75 91 77.5V93.5Q91 96 89 97.5L86 99.5Q84 101 81.5 101H28.5Q26 101 26 98.5Z"/></clipPath>
    <clipPath id="tunnel"><path d="M43 101A11 11 0 0 1 65 101Z"/></clipPath>
    <clipPath id="cubeA"><path d="M32 77.5V61.5Q32 59 34 57.5L37 55.5Q39 54 41.5 54H58.5Q61 54 61 56.5V72.5Q61 75 59 76.5L56 78.5Q54 80 51.5 80H34.5Q32 80 32 77.5Z"/></clipPath>
    <clipPath id="cubeB"><path d="M56 77.5V61.5Q56 59 58 57.5L61 55.5Q63 54 65.5 54H82.5Q85 54 85 56.5V72.5Q85 75 83 76.5L80 78.5Q78 80 75.5 80H58.5Q56 80 56 77.5Z"/></clipPath>
    <clipPath id="drum"><path d="M48.5 37.5V55.5A10.5 3 0 0 0 69.5 55.5V37.5A10.5 3 0 0 0 48.5 37.5Z"/></clipPath>
    <clipPath id="roof"><path d="M45.5 40Q43 40 44.5 38L54 26Q55.5 24 57.5 22.5L60.5 20.5Q62.5 19 64 21L73.5 33Q75 35 73 36.5L70 38.5Q68 40 65.5 40Z"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>
  <ellipse cx="60" cy="102" rx="36" ry="5" fill="#4b3a8c" opacity="0.14"/>

  <!-- the arch: lavender, its top lit, its right side in shade, a tunnel through it -->
  <g clip-path="url(#arch)">
    <rect x="24" y="73" width="70" height="30" fill="#937ee0"/>
    <path d="M24 80H84L91 75V72H24Z" fill="#ddd2ff"/>
    <rect x="24" y="80" width="60" height="23" fill="#b9a6f5"/>
  </g>
  <g clip-path="url(#tunnel)">
    <rect x="42" y="89" width="24" height="12" fill="#937ee0"/>
    <path d="M40 101V96H50A11 11 0 0 1 72 96V101Z" fill="#e9b6a8"/>
  </g>
  <path d="M31 85H40" stroke="#ddd2ff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- two cubes: pink and sky blue -->
  <g clip-path="url(#cubeA)">
    <rect x="30" y="52" width="33" height="30" fill="#e7699c"/>
    <path d="M28 59H54L61 54V50H28Z" fill="#ffc4da"/>
    <rect x="28" y="59" width="26" height="23" fill="#ff8fb8"/>
  </g>
  <g clip-path="url(#cubeB)">
    <rect x="54" y="52" width="33" height="30" fill="#5fb0ea"/>
    <path d="M52 59H78L85 54V50H52Z" fill="#c9e9ff"/>
    <rect x="52" y="59" width="26" height="23" fill="#8ccfff"/>
  </g>
  <path d="M36 64H41" stroke="#ffc4da" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M60 64H65" stroke="#c9e9ff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- the cylinder: mint, its top lit -->
  <g clip-path="url(#drum)">
    <rect x="47" y="33" width="24" height="26" fill="#5cc6a6"/>
    <path d="M43.5 37.5V55.5A10.5 3 0 0 0 64.5 55.5V37.5Z" fill="#8fe3c8"/>
    <ellipse cx="59" cy="37.5" rx="10.5" ry="3" fill="#c7f3e4"/>
  </g>
  <path d="M52.5 43.5V51" stroke="#c7f3e4" stroke-width="2.5" stroke-linecap="round"/>

  <!-- the triangle on top: gold -->
  <g clip-path="url(#roof)">
    <rect x="40" y="17" width="38" height="25" fill="#eba123"/>
    <path d="M38 42L55.5 24L68 40V42Z" fill="#ffc83d"/>
  </g>
  <path d="M48 35L53.5 28" stroke="#ffe189" stroke-width="2.5" stroke-linecap="round"/>

  <!-- sparkles -->
  <path d="M90 20l2 4.5 4.5 2-4.5 2-2 4.5-2-4.5-4.5-2 4.5-2z" fill="#fff"/>
  <path d="M27 42l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5z" fill="#fff"/>
</svg>
