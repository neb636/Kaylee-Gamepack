<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Climbing wall</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ece6ff"/><stop offset="1" stop-color="#cdbfff"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="mtn"><path d="M12 102C20 86 30 66 42 50C46 44 50 38 53 35Q57 29.5 61 35C65 41 68 46 71 50Q74 53.5 77 50C79 47 81 44 83 43Q86 41 89 44.5C96 56 103 80 108 102Z"/></clipPath>
    <clipPath id="bell"><path d="M-8.5 0C-7-1.5-6.5-4-6.5-8C-6.5-13.5-3.5-16.5 0-16.5C3.5-16.5 6.5-13.5 6.5-8C6.5-4 7-1.5 8.5 0Z"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>
  <ellipse cx="60" cy="102" rx="46" ry="5" fill="#4b3a8c" opacity="0.14"/>

  <!-- the golden mountain: lit on the left of the ridge, in shade on the right -->
  <g clip-path="url(#mtn)">
    <rect x="10" y="28" width="100" height="76" fill="#ffc83d"/>
    <path d="M57 31L61 45L56.5 58L62 72L58 86L61 102H110V30Z" fill="#eba123"/>
    <path d="M73 52.5Q75.5 52.5 77 50C79 47 81 44 83 43Q84.5 42 86 42L88 55L83 66L76 60Z" fill="#ffc83d"/>
    <path d="M33 74C37 64 42 56 47.5 47.5" fill="none" stroke="#ffe189" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- round holds up the wall -->
  <g transform="translate(36 92) scale(1.1)"><circle r="5" fill="#8ccfff"/><path d="M3-4A5 5 0 1 1-4 3A5 5 0 0 0 3-4Z" fill="#5fb0ea"/><circle cx="-2" cy="-2" r="1.5" fill="#c9e9ff"/></g>
  <g transform="translate(52 86)"><circle r="5" fill="#ff4f9a"/><path d="M3-4A5 5 0 1 1-4 3A5 5 0 0 0 3-4Z" fill="#d8367f"/><circle cx="-2" cy="-2" r="1.5" fill="#ff8fc0"/></g>
  <g transform="translate(39 73)"><circle r="5" fill="#8fe3c8"/><path d="M3-4A5 5 0 1 1-4 3A5 5 0 0 0 3-4Z" fill="#5cc6a6"/><circle cx="-2" cy="-2" r="1.5" fill="#c7f3e4"/></g>
  <g transform="translate(51 63) scale(0.95)"><circle r="5" fill="#8b78e6"/><path d="M3-4A5 5 0 1 1-4 3A5 5 0 0 0 3-4Z" fill="#6a57c7"/><circle cx="-2" cy="-2" r="1.5" fill="#b3a5f2"/></g>
  <g transform="translate(49 50) scale(0.85)"><circle r="5" fill="#ff8fb8"/><path d="M3-4A5 5 0 1 1-4 3A5 5 0 0 0 3-4Z" fill="#e7699c"/><circle cx="-2" cy="-2" r="1.5" fill="#ffc4da"/></g>
  <g transform="translate(72 86)"><circle r="5" fill="#3fc1cf"/><path d="M3-4A5 5 0 1 1-4 3A5 5 0 0 0 3-4Z" fill="#1f9cb3"/><circle cx="-2" cy="-2" r="1.5" fill="#8fe3ea"/></g>
  <g transform="translate(88 94) scale(1.05)"><circle r="5" fill="#ff6b6b"/><path d="M3-4A5 5 0 1 1-4 3A5 5 0 0 0 3-4Z" fill="#d9485e"/><circle cx="-2" cy="-2" r="1.5" fill="#ffa3a3"/></g>
  <g transform="translate(79 68) scale(0.9)"><circle r="5" fill="#b9a6f5"/><path d="M3-4A5 5 0 1 1-4 3A5 5 0 0 0 3-4Z" fill="#937ee0"/><circle cx="-2" cy="-2" r="1.5" fill="#ddd2ff"/></g>

  <!-- the bell at the top, ringing -->
  <path d="M43 17Q40.5 21 43 25M74 22Q76.5 26 74 30" fill="none" stroke="#8b78e6" stroke-width="2.5" stroke-linecap="round"/>
  <g transform="translate(57 31) rotate(14)">
    <circle cy="2.5" r="3" fill="#ffc83d"/>
    <circle cy="-18" r="2.5" fill="#e7699c"/>
    <g clip-path="url(#bell)">
      <rect x="-9" y="-17" width="18" height="18" fill="#e7699c"/>
      <path d="M-11.5-1C-10-2.5-9.5-5-9.5-9C-9.5-14.5-6.5-17.5-3-17.5C0.5-17.5 3.5-14.5 3.5-9C3.5-5 4-2.5 5.5-1Z" fill="#ff8fb8"/>
    </g>
    <rect x="-9.5" y="-2.5" width="19" height="4" rx="2" fill="#ff4f9a"/>
    <path d="M-3.5-6.5V-11" stroke="#ffc4da" stroke-width="2" stroke-linecap="round"/>
  </g>
  <path d="M93 24l2 4.5 4.5 2-4.5 2-2 4.5-2-4.5-4.5-2 4.5-2z" fill="#fff"/>
</svg>
