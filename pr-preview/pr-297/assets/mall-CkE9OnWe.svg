    <radialGradient id="sunglow" cx="1096" cy="92" r="220" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff8dc" stop-opacity="0.95"/><stop offset="0.35" stop-color="#fff3d0" stop-opacity="0.45"/><stop offset="1" stop-color="#fff3d0" stop-opacity="0"/></radialGradient>
    <linearGradient id="river" x1="0" y1="318" x2="0" y2="450" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#b6e3f6"/><stop offset="0.4" stop-color="#7ec9ea"/><stop offset="1" stop-color="#4fa9d6"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="100" x2="0" y2="282" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#d9f0ff"/><stop offset="1" stop-color="#93cffa"/></linearGradient>
    <!-- the mall's glass front: a wide, high arch -->
