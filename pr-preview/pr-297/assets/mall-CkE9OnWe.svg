    <g id="bLav"><g clip-path="url(#bc)"><use href="#bb" fill="#937ee0"/><use href="#bb" fill="#b9a6f5" x="-4" y="-5"/></g><use href="#bh" stroke="#ddd2ff"/><use href="#bk" fill="#937ee0"/></g>
    <g id="bGold"><g clip-path="url(#bc)"><use href="#bb" fill="#eba123"/><use href="#bb" fill="#ffc83d" x="-4" y="-5"/></g><use href="#bh" stroke="#ffe189"/><use href="#bk" fill="#eba123"/></g>
    <g id="bMint"><g clip-path="url(#bc)"><use href="#bb" fill="#5cc6a6"/><use href="#bb" fill="#8fe3c8" x="-4" y="-5"/></g><use href="#bh" stroke="#c7f3e4"/><use href="#bk" fill="#5cc6a6"/></g>
    <g id="bHot"><g clip-path="url(#bc)"><use href="#bb" fill="#d8367f"/><use href="#bb" fill="#ff4f9a" x="-4" y="-5"/></g><use href="#bh" stroke="#ff8fc0"/><use href="#bk" fill="#d8367f"/></g>
