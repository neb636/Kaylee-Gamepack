    <path d="M-3-26q1.5 1.5 3 0q1.5 1.5 3 0" fill="none" stroke="#2b2330" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="-5" cy="-35" rx="2" ry="2.5" fill="#2b2330"/><ellipse cx="5" cy="-35" rx="2" ry="2.5" fill="#2b2330"/>
    <circle cx="-4.5" cy="-36" r="1" fill="#fff"/><circle cx="5.5" cy="-36" r="1" fill="#fff"/>
    <ellipse cx="-9" cy="-28.5" rx="2.5" ry="1.5" fill="#ff8fb8" opacity="0.55"/><ellipse cx="9" cy="-28.5" rx="2.5" ry="1.5" fill="#ff8fb8" opacity="0.55"/>
  </g>

  <!-- palms along the river -->
