      <path d="M1 0C2-50 4-100 10-150L14-149C8-100 6-50 7 0Z" fill="#a46e4b"/>
      <path d="M-4-30h9M-3-60h9M-1-90h9M2-120h9" stroke="#e5b78f" stroke-width="3.5" stroke-linecap="round"/>
      <g transform="translate(10 -150)">
        <g fill="#48a96c"><path d="M0-2C-22-16-56-16-82 2C-54-4-30 0 0 6Z"/><path d="M2 2C28 2 54 20 64 46C46 26 26 16 2 8Z"/><path d="M-2 2C-26 8-46 28-50 54C-36 32-20 20 0 8Z"/></g>
        <g fill="#73cf86"><path d="M0 0C-16-30-40-44-68-44C-40-34-22-20-2 4Z"/><path d="M0 0C4-30 20-52 44-60C28-42 18-24 4 4Z"/><path d="M2 0C30-16 64-14 86 4C62-2 36 0 4 6Z"/></g>
        <path d="M-2 2C-16-22-34-34-56-38M4 2C30-8 54-8 74 0" fill="none" stroke="#aee8b7" stroke-width="3" stroke-linecap="round"/>
        <circle cx="-4" cy="10" r="7" fill="#8a5b3d"/><circle cx="9" cy="12" r="7" fill="#6b432e"/><circle cx="2" cy="21" r="6" fill="#8a5b3d"/>
      </g>
    </g>
    <!-- a balloon, its knot at 0,0 -->
    <ellipse id="bb" cx="0" cy="-27" rx="18" ry="22"/>
    <clipPath id="bc"><use href="#bb"/></clipPath>
    <path id="bh" d="M-10-34C-9-41-5-45 0-46" fill="none" stroke-width="4" stroke-linecap="round"/>
    <path id="bk" d="M-4.5 1h9l-4.5-6z"/>
