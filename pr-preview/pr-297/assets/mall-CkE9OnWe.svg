  <use href="#palm" transform="translate(1018 312) scale(1.02)"/>
  <use href="#palm" transform="translate(1090 312) scale(.74)"/>

  <!-- the river, with the mall's light on it -->
  <rect y="318" width="1200" height="132" fill="url(#river)"/>
  <rect y="318" width="1200" height="4" fill="#effcff" opacity="0.8"/>
