    <rect x="96" y="346" width="90" height="4" rx="2"/><rect x="380" y="372" width="110" height="4" rx="2"/><rect x="660" y="394" width="90" height="4" rx="2"/><rect x="200" y="404" width="80" height="4" rx="2"/>
