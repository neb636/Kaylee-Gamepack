    <path id="tBack" d="M286 220C285 219.5 283.5 217.5 279.5 216.5C275 216 268 215 261 215C254 215.5 244.5 216 236 217C227.5 218 218 220 211 222.5C204 225 197 228 192.5 231.5C188.5 234.5 187 240 186 242"/>
    <path id="tFront" d="M186 198C187 200 188.5 205.5 192.5 208.5C197 212 204 215 211 217.5C218 220 227.5 222 236 223C244.5 224 254 224.5 261 225C268 225 275 224 279.5 223.5C283.5 222.5 285 220.5 286 220M186 242C187 244 188.5 249.5 192.5 252.5C197 256 204 259 211 261.5C218 264 227.5 266 236 267C244.5 268 254 268.5 261 269C268 269 275 268 279.5 267.5C283.5 266.5 285 264.5 286 264C300 268 314 284 320 298"/>
    <path id="sp" d="M0-11l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
  </defs>

  <!-- sky, sun, clouds, birds -->
