    <rect x="596" y="70" width="74" height="14" rx="7"/>
  </g>
  <g fill="none" stroke="#8a86c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M968 112q6-6 12 0q6-6 12 0"/><path d="M1000 92q5-5 10 0q5-5 10 0"/><path d="M450 96q5-5 10 0q5-5 10 0"/>
  </g>

  <!-- the far city in the haze -->
  <g fill="#d3def7">
    <rect x="-10" y="214" width="58" height="110"/><rect x="40" y="170" width="54" height="154"/><rect x="88" y="230" width="70" height="94"/>
    <rect x="958" y="208" width="60" height="116"/><rect x="1040" y="226" width="70" height="98"/><rect x="1100" y="180" width="56" height="144"/><rect x="1150" y="238" width="60" height="86"/>
