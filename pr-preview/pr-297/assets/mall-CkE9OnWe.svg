    <!-- each fold: lit on its left, shaded on its right -->
    <path d="M262 284L296 130L330 284ZM364 284L398 106L432 284ZM466 284L500 92L534 284ZM568 284L602 86L636 284ZM670 284L704 88L738 284ZM772 284L806 98L840 284ZM874 284L908 118L942 284Z" fill="#eaf7ff" opacity="0.8"/>
    <path d="M296 130L330 284H364L330 122ZM398 106L432 284H466L432 100ZM500 92L534 284H568L534 88ZM602 86L636 284H670L636 86ZM704 88L738 284H772L738 90ZM806 98L840 284H874L840 104ZM908 118L942 284H976L942 126Z" fill="#7dbdf0" opacity="0.6"/>
    <!-- floors behind the glass -->
    <path d="M250 206H990M250 244H990" stroke="#f4fbff" stroke-width="4" opacity="0.75"/>
    <!-- the far end of the curve, turning away from the light -->
