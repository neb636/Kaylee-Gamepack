    <path d="M-10-44C-17.5-44-21-35-19-27C-18-22.5-12.5-22.5-11.5-28C-10.5-33-8-39-10-44Z" fill="#a46e4b"/>
    <path d="M10-44C17.5-44 21-35 19-27C18-22.5 12.5-22.5 11.5-28C10.5-33 8-39 10-44Z" fill="#8a5b3d"/>
    <ellipse cx="0" cy="-27.5" rx="7" ry="5" fill="#fff7f0"/>
