<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Ice Floe Hop</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0f2ff"/><stop offset="1" stop-color="#b3dbff"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sea" x1="0" y1="72" x2="0" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8ccfff"/><stop offset="1" stop-color="#4f9fe3"/></linearGradient>
    <path id="floeTop" d="M9 87C9 82.5 14 80 22 79.5C29 79 33 77.5 40 77.5C47 77.5 51 79 59 78.5C67 78 73 77 81 77.5C91 78 99 79 104 81.5C108.5 83.5 110 86 109 88.5C107 92.5 100 94 92 94.5C80 95.5 70 94.5 60 95C48 95.5 36 95.5 26 94.5C16 93.5 9 91.5 9 87Z"/>
    <clipPath id="side"><use href="#floeTop" transform="translate(0 7.5)"/></clipPath>
    <clipPath id="head"><circle cx="60" cy="44" r="21"/></clipPath>
    <clipPath id="body"><path d="M39 89C36 74 44 62 60 61C76 62 84 74 81 89Z"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="50" r="50" fill="url(#glow)"/>

  <!-- a cloud, far floes on the horizon -->
  <g fill="#fff" opacity="0.9">
    <circle cx="18" cy="27" r="4"/><circle cx="24" cy="23.5" r="5.5"/><circle cx="30" cy="27" r="3.5"/>
    <rect x="14" y="26" width="20" height="5" rx="2.5"/>
  </g>
  <path d="M2 72C4 69 8 68 14 68.5C18 68.8 22 70 24 72ZM96 72C98 69.5 102 68.5 108 69C113 69.4 117 70.5 119 72Z" fill="#f4faff"/>

  <!-- the sea, its glints -->
  <rect y="72" width="120" height="48" fill="url(#sea)"/>
  <rect y="72" width="120" height="2" fill="#e8f6ff" opacity="0.8"/>
  <g fill="#fff" opacity="0.55">
    <rect x="4" y="78" width="16" height="2.6" rx="1.3"/><rect x="102" y="78" width="14" height="2.6" rx="1.3"/>
    <rect x="14" y="110" width="22" height="2.6" rx="1.3"/><rect x="84" y="112" width="24" height="2.6" rx="1.3"/>
  </g>

  <!-- the ice floe: a thick slab with a lit left side, floating, its shadow in the water -->
  <ellipse cx="60" cy="104" rx="50" ry="4.5" fill="#2f6fbf" opacity="0.3"/>
  <g clip-path="url(#side)">
    <rect x="6" y="80" width="108" height="26" fill="#6cbcf2"/>
    <path d="M6 80H72C70 88 70 96 72 106H6Z" fill="#a6dcff"/>
  </g>
  <path d="M11 95C14 99 20 101 28 101.5" fill="none" stroke="#d6efff" stroke-width="2.4" stroke-linecap="round"/>
  <use href="#floeTop" fill="#fff"/>
  <path d="M72 94.6C80 94.8 88 94.6 94 94C101 93.4 106 91.8 108.6 89C104 90.5 96 91.5 88 91.6C82 91.7 76 92.5 72 94.6Z" fill="#dfeeff"/>
  <path d="M16 83.5C20 81.5 26 80.8 32 80.5" fill="none" stroke="#e8f4ff" stroke-width="2.4" stroke-linecap="round"/>
  <ellipse cx="61" cy="88.5" rx="26" ry="3.6" fill="#4b3a8c" opacity="0.13"/>

  <!-- the cub, sitting up: a round body, lavender shade on the right, a cream tummy -->
  <g clip-path="url(#body)">
    <rect x="34" y="58" width="52" height="34" fill="#e4ddf6"/>
    <path d="M39 89C36 74 44 62 60 61C68 61.5 74 64.5 77.5 70C77.5 77 75.5 84 73 89Z" fill="#fff"/>
    <ellipse cx="60" cy="79" rx="11" ry="9.5" fill="#fff7f0"/>
  </g>
  <!-- the left arm resting on its tummy -->
  <path d="M44 66C41 71 41.5 77 45 81" fill="none" stroke="#fff" stroke-width="9.5" stroke-linecap="round"/>
  <path d="M48.5 70C47.5 74 48 78 49.5 80.5" fill="none" stroke="#ece6fb" stroke-width="2.2" stroke-linecap="round"/>
  <!-- hind feet with pink pads -->
  <ellipse cx="46.5" cy="87.5" rx="8" ry="6.5" fill="#fff"/>
  <ellipse cx="73.5" cy="87.5" rx="8" ry="6.5" fill="#efeaff"/>
  <ellipse cx="46.5" cy="88.5" rx="4" ry="3.4" fill="#ffc4da"/>
  <ellipse cx="73.5" cy="88.5" rx="4" ry="3.4" fill="#ff8fb8"/>
  <g fill="#ffc4da"><circle cx="42.5" cy="83.7" r="1.5"/><circle cx="46.5" cy="82.5" r="1.5"/><circle cx="50.5" cy="83.7" r="1.5"/></g>
  <g fill="#ff8fb8"><circle cx="69.5" cy="83.7" r="1.5"/><circle cx="73.5" cy="82.5" r="1.5"/><circle cx="77.5" cy="83.7" r="1.5"/></g>
  <!-- the right arm up, waving hello, its paw pad showing -->
  <path d="M75 67C81 63 85 57 87 50" fill="none" stroke="#e4ddf6" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="88" cy="45.5" rx="7" ry="7.5" fill="#efeaff"/>
  <path d="M93.5 41C95 43.5 95.3 47 94 50" fill="none" stroke="#e4ddf6" stroke-width="2.4" stroke-linecap="round"/>
  <ellipse cx="88" cy="47.5" rx="3.6" ry="3" fill="#ff8fb8"/>
  <g fill="#ff8fb8"><circle cx="84.5" cy="42.6" r="1.4"/><circle cx="88" cy="41.2" r="1.4"/><circle cx="91.5" cy="42.6" r="1.4"/></g>
  <path d="M100 37q3 4 0 9M104.5 34q4.5 6 0 14" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>

  <!-- round ears -->
  <circle cx="43" cy="28" r="7.5" fill="#fff"/>
  <circle cx="77" cy="28" r="7.5" fill="#e4ddf6"/>
  <circle cx="43.5" cy="28.5" r="3.8" fill="#ffc4da"/>
  <circle cx="76.5" cy="28.5" r="3.8" fill="#ff8fb8"/>
  <!-- head: white, a lavender crescent bottom-right -->
  <g clip-path="url(#head)">
    <rect x="37" y="21" width="46" height="46" fill="#e4ddf6"/>
    <circle cx="57" cy="41" r="21" fill="#fff"/>
  </g>
  <!-- muzzle, nose, mouth -->
  <ellipse cx="60" cy="51" rx="9.5" ry="7" fill="#fff7f0"/>
  <path d="M56.4 47.2Q60 45 63.6 47.2Q62.4 50.6 60 51Q57.6 50.6 56.4 47.2Z" fill="#2b2330"/>
  <ellipse cx="58.6" cy="47" rx="1.2" ry="0.7" fill="#fff"/>
  <path d="M57.5 55.2Q60 59.5 62.5 55.2Z" fill="#ff8fb8"/>
  <path d="M60 51V53.2M56 53Q58 55.8 60 53.2Q62 55.8 64 53" fill="none" stroke="#2b2330" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- eyes and blush -->
  <ellipse cx="51.5" cy="41.5" rx="3.4" ry="4.1" fill="#2b2330"/>
  <ellipse cx="68.5" cy="41.5" rx="3.4" ry="4.1" fill="#2b2330"/>
  <circle cx="52.7" cy="40" r="1.35" fill="#fff"/>
  <circle cx="69.7" cy="40" r="1.35" fill="#fff"/>
  <ellipse cx="46" cy="50" rx="4" ry="2.4" fill="#ff8fb8" opacity="0.55"/>
  <ellipse cx="74" cy="50" rx="4" ry="2.4" fill="#ff8fb8" opacity="0.55"/>
</svg>
