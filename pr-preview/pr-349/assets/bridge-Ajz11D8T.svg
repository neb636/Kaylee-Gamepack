<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Animal Bridge</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe1ee"/><stop offset="1" stop-color="#ffbcd8"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="face"><path d="M2 64H118V100H86V92C86 78 76 70 60 70C44 70 34 78 34 92V100H2Z"/></clipPath>
    <clipPath id="deer"><ellipse cx="64" cy="47" rx="9.5" ry="5.6"/></clipPath>
    <path id="pine" d="M0 0L-5 0L-1.5 -5H-3.5L0 -11L3.5 -5H1.5L5 0Z"/>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="44" r="52" fill="url(#glow)"/>

  <!-- snowy mountains and the forest far behind -->
  <path d="M-2 62L18 38L30 48L46 26L62 46L76 32L94 50L106 40L122 56V70H-2Z" fill="#c8bdf0"/>
  <path d="M46 26L62 46L54 40L48 44ZM76 32L94 50L86 44L80 46Z" fill="#a99ce0"/>
