  <g fill="#3e9e78">
    <use href="#pine" x="6" y="66"/><use href="#pine" x="14" y="65"/><use href="#pine" x="24" y="66"/><use href="#pine" x="96" y="66"/><use href="#pine" x="106" y="65"/><use href="#pine" x="115" y="66"/>
  </g>

  <!-- the green bridge: grass and pines on top, the road through its arch -->
  <g clip-path="url(#face)">
    <rect x="0" y="60" width="120" height="42" fill="#dedaf0"/>
    <rect x="92" y="60" width="28" height="42" fill="#c9c3e0"/>
    <path d="M2 69H118" stroke="#bcb6d6" stroke-width="2"/>
    <path d="M34 92C34 78 44 70 60 70C76 70 86 78 86 92" fill="none" stroke="#fff7f0" stroke-width="3"/>
  </g>
  <path d="M34 100V92C34 78 44 70 60 70C76 70 86 78 86 92V100Z" fill="#7d75a6"/>
  <path d="M46 100V95C46 86 52 82 60 82C68 82 74 86 74 95V100Z" fill="#c8bdf0"/>
  <path d="M0 66C20 56 44 54 60 55C78 54 100 56 120 66V69H0Z" fill="#73cf86"/>
  <path d="M0 66C20 58 44 56 60 57C78 56 100 58 120 66" fill="none" stroke="#aee8b7" stroke-width="2.4"/>
  <g fill="#48a96c"><circle cx="34" cy="60" r="4"/><circle cx="40" cy="59" r="3"/><circle cx="88" cy="59.5" r="3.6"/></g>
  <g fill="#3e9e78"><use href="#pine" x="20" y="63" transform="translate(-4 -1) scale(1.2)"/><use href="#pine" x="96" y="61" transform="translate(-10 -6) scale(1.2)"/><use href="#pine" x="104" y="62"/></g>

  <!-- the road -->
  <path d="M44 100H76L96 122H24Z" fill="#9790ba"/>
  <path d="M44 100L24 122M76 100L96 122" stroke="#bcb6d6" stroke-width="2"/>
  <path d="M60 102V107M60 111V118" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M-2 100H44L24 122H-2Z" fill="#8fd99a"/>
  <path d="M76 100H122V122H96Z" fill="#8fd99a"/>

  <!-- a fawn walking across the top -->
  <ellipse cx="64" cy="57" rx="11" ry="2" fill="#4b3a8c" opacity="0.15"/>
  <rect x="58.5" y="49" width="2.4" height="8" rx="1.2" fill="#a46e4b"/>
  <rect x="68.5" y="49" width="2.4" height="8" rx="1.2" fill="#a46e4b"/>
  <circle cx="55" cy="45" r="2" fill="#fff7f0"/>
  <g clip-path="url(#deer)">
    <rect x="54" y="40" width="20" height="14" fill="#a46e4b"/>
    <ellipse cx="63" cy="46" rx="9.5" ry="5.4" fill="#c99266"/>
    <ellipse cx="63" cy="51" rx="7" ry="2.6" fill="#e5b78f"/>
