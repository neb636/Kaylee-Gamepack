  <g fill="#fff7f0"><circle cx="60" cy="44.5" r="0.9"/><circle cx="64" cy="43.6" r="0.9"/><circle cx="67" cy="45" r="0.9"/><circle cx="62" cy="47" r="0.8"/></g>
  <rect x="56" y="49" width="2.6" height="8.5" rx="1.3" fill="#c99266"/>
  <rect x="66" y="49" width="2.6" height="8.5" rx="1.3" fill="#c99266"/>
  <path d="M69 46C70 41 71 38 73 36L76.5 38C74.5 40.5 73 43.5 72.5 47Z" fill="#c99266"/>
  <path d="M71.5 33C70 30 70 27 71.5 25.5C73 27.5 73.5 30 73 33Z" fill="#c99266"/>
  <path d="M75.5 32.5C76.5 29.5 78.5 27.5 80.5 27C80.5 29.5 79 31.5 77 33.5Z" fill="#a46e4b"/>
  <ellipse cx="75" cy="35.5" rx="4.6" ry="4" fill="#c99266"/>
  <ellipse cx="78.6" cy="37.4" rx="2.6" ry="2" fill="#e5b78f"/>
  <circle cx="80.6" cy="36.8" r="0.95" fill="#2b2330"/>
  <ellipse cx="75.6" cy="34.4" rx="1.2" ry="1.4" fill="#2b2330"/>
  <circle cx="76" cy="34" r="0.45" fill="#fff"/>
  <ellipse cx="74.6" cy="37.6" rx="1.6" ry="1" fill="#ff8fb8" opacity="0.7"/>
