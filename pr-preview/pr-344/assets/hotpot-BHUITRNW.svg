<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Hotpot Night</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9de"/><stop offset="1" stop-color="#ffc3a8"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="pot"><path d="M17 62V68C17 84 36 93 60 93C84 93 103 84 103 68V62Z"/></clipPath>
    <clipPath id="broth"><ellipse cx="60" cy="63" rx="36.5" ry="11"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>
  <ellipse cx="60" cy="104" rx="36" ry="5.5" fill="#4b3a8c" opacity="0.14"/>

  <!-- the burner and its little flames -->
  <ellipse cx="60" cy="99" rx="27" ry="5" fill="#6a57c7"/>
  <rect x="33" y="94" width="54" height="5" fill="#6a57c7"/>
  <ellipse cx="60" cy="94" rx="27" ry="5" fill="#8b78e6"/>
  <g fill="#ff9c57">
    <path d="M38 96C35 92 38 89 40 86C42 89 44 92 41 96Z"/><path d="M80 96C77 92 79 89 81 86C83 89 85 92 82 96Z"/>
  </g>
  <g fill="#ffc83d">
    <path d="M38.8 96C37.6 94 38.8 92.4 39.8 91C40.8 92.4 42 94 40.4 96Z"/><path d="M80.4 96C79.2 94 80.4 92.4 81.4 91C82.4 92.4 83.6 94 82 96Z"/>
  </g>

  <!-- the pot: steel, shaded on the right, a bright streak on the left -->
  <path d="M19 66C10 63 8 75 18 74" fill="none" stroke="#9790ba" stroke-width="4" stroke-linecap="round"/>
  <path d="M101 66C110 63 112 75 102 74" fill="none" stroke="#857eab" stroke-width="4" stroke-linecap="round"/>
  <g clip-path="url(#pot)">
    <rect x="14" y="58" width="92" height="40" fill="#9790ba"/>
    <path d="M17 62V68C17 82 32 90 52 92C62 85 72 72 76 62Z" fill="#bcb6d6"/>
    <path d="M24 72C27 80 33 85 41 88" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- the rim, the inner wall and the two broths -->
  <ellipse cx="60" cy="61" rx="43" ry="14.5" fill="#dedaf0"/>
  <ellipse cx="60" cy="61" rx="38.5" ry="12.2" fill="#857eab"/>
  <g clip-path="url(#broth)">
    <rect x="22" y="50" width="76" height="26" fill="#fff7f0"/>
    <path d="M60 52C74 57 46 68 60 74V80H96V48H60Z" fill="#efdccd" opacity="0.5"/>
    <path d="M60 52C74 57 46 68 60 74H20V48H60Z" fill="#ff6b6b"/>
    <path d="M22 64C30 70 44 73 56 73.5L60 74H20Z" fill="#d9485e"/>
  </g>
  <path d="M60 52.2C74 57 46 68 60 73.8" fill="none" stroke="#dedaf0" stroke-width="2.6" stroke-linecap="round"/>

  <!-- in the spicy side: chillies, oil, bubbles -->
  <path d="M33 60c3-3 8-3.4 10-1.4c-3 2.6-6.6 2.8-10 1.4z" fill="#d9485e"/>
  <path d="M42 66.5c3-2.6 7.4-2.6 9-0.8c-2.8 2.2-6 2.4-9 0.8z" fill="#d9485e"/>
  <circle cx="44" cy="58.2" r="1.4" fill="#73cf86"/><circle cx="51.6" cy="65.4" r="1.4" fill="#73cf86"/>
  <g fill="#ffc83d"><circle cx="38" cy="65" r="1.6"/><circle cx="50" cy="57" r="1.3"/><circle cx="30" cy="63.5" r="1.1"/></g>
  <g fill="#fff" opacity="0.8"><circle cx="38.5" cy="55.5" r="2.4"/><circle cx="45" cy="54" r="1.5"/><circle cx="33" cy="67.5" r="1.6"/></g>

  <!-- in the mild side: a mushroom, goji berries, a green leaf, a bubble -->
  <path d="M68 64.5a6 4.2 0 0 1 12 0Z" fill="#c99266"/>
  <path d="M69.8 64.5a4.2 2.8 0 0 1 4.6-3.6" fill="none" stroke="#e5b78f" stroke-width="2" stroke-linecap="round"/>
  <rect x="72.4" y="64" width="3.2" height="3.4" rx="1.4" fill="#efdccd"/>
  <path d="M82 59c3.6-3.4 9.4-2.6 10.4 0.4c-3.6 2-7.4 1.8-10.4-0.4z" fill="#73cf86"/>
  <path d="M84 59.2c2.6-1 5-1 7 0" fill="none" stroke="#aee8b7" stroke-width="2" stroke-linecap="round"/>
  <g fill="#ff6b6b"><ellipse cx="66" cy="57" rx="1.7" ry="1.3"/><ellipse cx="86" cy="66" rx="1.7" ry="1.3"/><ellipse cx="79" cy="55" rx="1.5" ry="1.2"/></g>
  <circle cx="72" cy="56" r="2.2" fill="none" stroke="#efdccd" stroke-width="1.6"/>

  <!-- chopsticks, dipping in from the right -->
  <path d="M104 22L80 54" stroke="#c99266" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M110 28L84 56.5" stroke="#a46e4b" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M104 22L100 27.3M110 28L105.6 32.8" stroke="#ff8fb8" stroke-width="3.4" stroke-linecap="round"/>

  <!-- steam -->
  <path d="M40 46c-3-4 3-6 0-10s3-6 0-10M56 42c-3-4 3-6 0-10M72 46c-3-4 3-6 0-10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
</svg>
