<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Crocodile River</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9de"/><stop offset="1" stop-color="#ffc3a8"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="river" x1="0" y1="76" x2="0" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8fe3ea"/><stop offset="1" stop-color="#3fc1cf"/></linearGradient>
    <clipPath id="head"><path d="M14 79C13 63 20 51 33 49C44 47.5 53 51 59 57C65 61 77 61.5 89 61C97 60.5 103 61.5 106 65C108.5 68 109 73 108 79Z"/></clipPath>
    <clipPath id="eyeL"><circle cx="29" cy="45" r="10"/></clipPath>
    <clipPath id="eyeR"><circle cx="47" cy="45" r="10"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="52" r="50" fill="url(#glow)"/>

  <!-- reeds and bulrushes on the far bank -->
  <g fill="none" stroke-linecap="round" stroke-width="3">
    <path d="M100 77C100 67 103 58 108 52M108 77C108 70 110 65 114 61" stroke="#73cf86"/>
    <path d="M94 77C94 71 95 66 97 62" stroke="#48a96c"/>
    <path d="M7 78C7 66 8 56 10 48M13 78C13 72 14.5 68 17 64" stroke="#73cf86"/>
  </g>
  <rect x="105.5" y="41" width="5" height="13" rx="2.5" transform="rotate(24 108 47.5)" fill="#a46e4b"/>
  <rect x="8" y="37" width="5" height="12" rx="2.5" transform="rotate(8 10.5 43)" fill="#a46e4b"/>

  <!-- the river -->
  <rect y="77" width="120" height="43" fill="url(#river)"/>

  <!-- the bumpy back and tail, just breaking the water -->

  <!-- the head: green, lit on top, the jaw shaded -->
  <g clip-path="url(#head)">
    <rect x="10" y="44" width="102" height="38" fill="#48a96c"/>
    <path d="M14 79C13 63 20 51 33 49C44 47.5 53 51 59 57C65 61 77 61.5 89 61C97 60.5 103 61.5 106 65C107 67 107.5 69 107.5 71C88 69 60 69 36 71C26 72 18 75 14 79Z" fill="#73cf86"/>
    <path d="M60 60C70 63.5 82 64 94 63" fill="none" stroke="#aee8b7" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="66" cy="66" r="1.8" fill="#5cbd78"/><circle cx="74" cy="65" r="1.5" fill="#5cbd78"/><circle cx="82" cy="66.5" r="1.7" fill="#5cbd78"/>
    <circle cx="22" cy="66" r="2" fill="#5cbd78"/><circle cx="28" cy="62" r="1.6" fill="#5cbd78"/>
    <!-- the pale lower jaw above the water -->
    <path d="M34 73C56 73.5 84 73.5 108 72.5V82H30Z" fill="#e6f4b4"/>
    <path d="M30 79H112V82H30Z" fill="#c9df8c"/>
  </g>
  <!-- the nostril bump at the tip -->
  <ellipse cx="99" cy="61.5" rx="7" ry="4.6" fill="#73cf86"/>
  <path d="M94 59.5C96 58 99 57.5 101.5 58" fill="none" stroke="#aee8b7" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="97" cy="61.5" rx="1.6" ry="1.1" fill="#2b7a5f"/>
  <ellipse cx="102.2" cy="61.5" rx="1.6" ry="1.1" fill="#2b7a5f"/>

  <!-- the toothy smile, curling up at the back -->
  <path d="M33 67C35 71.5 39 73 45 73C64 73.5 86 73.3 106 72.2" fill="none" stroke="#2b2330" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M50 73.3L52.2 77.4L54.4 73.4ZM61 73.4L63.2 77.5L65.4 73.4ZM72 73.4L74.2 77.5L76.4 73.3ZM83 73.2L85.2 77.3L87.4 73ZM94 72.8L96 76.6L98 72.6Z" fill="#fff"/>
  <path d="M56 79L58 75.4L60 79ZM89 78.6L91 75L93 78.6Z" fill="#fff"/>
  <ellipse cx="40" cy="64.5" rx="4.5" ry="2.6" fill="#ffc4da" opacity="0.9"/>

  <!-- the eye bumps set back on the head -->
  <g clip-path="url(#eyeL)">
    <rect x="17" y="33" width="24" height="24" fill="#48a96c"/>
    <circle cx="27.5" cy="43.5" r="10" fill="#73cf86"/>
  </g>
  <g clip-path="url(#eyeR)">
    <rect x="35" y="33" width="24" height="24" fill="#48a96c"/>
    <circle cx="45.5" cy="43.5" r="10" fill="#73cf86"/>
  </g>
  <path d="M22 40C23 37.5 25 36 27.5 35.5M40 40C41 37.5 43 36 45.5 35.5" fill="none" stroke="#aee8b7" stroke-width="2.2" stroke-linecap="round"/>
  <ellipse cx="30" cy="46.5" rx="5.2" ry="5.6" fill="#fff"/>
  <ellipse cx="48" cy="46.5" rx="5.2" ry="5.6" fill="#fff"/>
  <ellipse cx="31" cy="47.2" rx="3.2" ry="3.9" fill="#2b2330"/>
  <ellipse cx="49" cy="47.2" rx="3.2" ry="3.9" fill="#2b2330"/>
  <circle cx="32.2" cy="45.8" r="1.3" fill="#fff"/>
  <circle cx="50.2" cy="45.8" r="1.3" fill="#fff"/>

  <!-- where it meets the water: a pale ring, its shadow, ripples -->
  <path d="M15 78.5C40 81 80 81 108 78.5" fill="none" stroke="#effcff" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="62" cy="83.5" rx="46" ry="3" fill="#1f9cb3" opacity="0.35"/>
  <g fill="#fff" opacity="0.65">
    <rect x="20" y="90" width="26" height="3" rx="1.5"/><rect x="58" y="92" width="32" height="3" rx="1.5"/><rect x="32" y="100" width="20" height="3" rx="1.5"/>
    <rect x="66" y="104" width="14" height="3" rx="1.5"/><rect x="16" y="108" width="18" height="3" rx="1.5"/><rect x="44" y="113" width="26" height="3" rx="1.5"/>
  </g>

  <!-- a lily pad with a pink flower -->
  <path d="M89 102A12 5.5 0 1 0 101 96.5L95.5 102Z" fill="#48a96c"/>
  <path d="M89 102A12 5.5 0 0 1 84 99.5A12 5.5 0 0 1 101 96.5L95.5 102Z" fill="#73cf86"/>
  <path d="M91 96C91 92 93 89.5 95 88C97 89.5 99 92 99 96C97 97 93 97 91 96Z" fill="#ff8fb8"/>
  <path d="M89 96.5C88 93 89 91 90.5 90C92 92 93 94 93 97ZM101 96.5C102 93 101 91 99.5 90C98 92 97 94 97 97Z" fill="#ffc4da"/>
  <path d="M95 88C97 89.5 99 92 99 96C97.5 96.6 96 96.8 95 96.8Z" fill="#e7699c"/>
</svg>
