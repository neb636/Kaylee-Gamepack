<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Narwhal</title>
  <defs>
    <clipPath id="round"><circle cx="60" cy="60" r="60"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ddf7ee"/><stop offset="1" stop-color="#a9e8d2"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sea" x1="0" y1="78" x2="0" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6fd3de"/><stop offset="1" stop-color="#1f9cb3"/></linearGradient>
    <path id="bodyShape" d="M96 64C96 47 81 37 63 38.500C50 39.500 41 46.500 34 54.500C30 59 26.500 59.500 23 56L18.500 62C23.500 71 32 78 42.500 82C59 88.500 81 86.500 90.500 77.500C94 74 96 69.500 96 64Z"/>
    <clipPath id="body"><use href="#bodyShape"/></clipPath>
    <clipPath id="tusk"><path d="M80 52L110 17L91 57Z"/></clipPath>
  </defs>
  <!-- a round sticker: everything sits inside the circle -->
  <g clip-path="url(#round)">
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="52" r="50" fill="url(#glow)"/>

  <!-- far ice on the horizon, the sea behind -->
  <path d="M0 78C4 73 10 71.500 17 72.500C22 73 26 75.500 28 78ZM92 78C95 74 100 72.500 107 73C113 73.500 118 75.500 120 78Z" fill="#f4fffb"/>
  <rect y="78" width="120" height="42" fill="url(#sea)"/>

  <!-- tail flukes, lifted out of the water -->
  <path d="M25 60C18 56.500 11.500 50 11 41C17.500 40.500 23 44.500 25.500 51C26 44.500 30 39.500 36.500 38C38 46.500 34 55.500 27 61Z" fill="#937ee0"/>
  <path d="M25 60C18 56.500 11.500 50 11 41C17.500 40.500 23 44.500 25.500 51C24 54 24 57 25 60Z" fill="#b9a6f5"/>

  <!-- the tusk: a long spiral tooth, butter with gold twists -->
  <g clip-path="url(#tusk)">
    <rect x="78" y="14" width="34" height="46" fill="#fbea9a"/>
    <path d="M86 58L110 17L112 30L94 60Z" fill="#ecc95c" opacity="0.55"/>
    <path d="M82.500 44L96 52M88.500 37L100 44M94.500 30L104 36M100 23.500L108 28" fill="none" stroke="#eba123" stroke-width="2.600" stroke-linecap="round"/>
  </g>

  <!-- body: lavender, a grape shade underneath on the right, a pale tummy -->
  <g clip-path="url(#body)">
    <rect x="16" y="34" width="84" height="56" fill="#937ee0"/>
    <use href="#bodyShape" transform="translate(-3 -4)" fill="#b9a6f5"/>
    <ellipse cx="62" cy="86" rx="33" ry="12.500" fill="#ece6ff"/>
    <path d="M40 49C47 43 55 41 64 41.500" fill="none" stroke="#ddd2ff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- freckles on its back -->
  <g fill="#ddd2ff" opacity="0.9"><circle cx="44" cy="56" r="2.600"/><circle cx="51" cy="50.500" r="2"/><circle cx="52.500" cy="59" r="1.600"/><circle cx="37.500" cy="61.500" r="1.600"/></g>
  <!-- flipper -->
  <path d="M56 72C53 78 54 85 59 89C64 86 66 80 64 74Z" fill="#937ee0"/>

  <!-- face -->
  <ellipse cx="72.500" cy="60" rx="3.300" ry="4" fill="#2b2330"/>
  <ellipse cx="88" cy="60" rx="3.300" ry="4" fill="#2b2330"/>
  <circle cx="73.700" cy="58.500" r="1.300" fill="#fff"/>
  <circle cx="89.200" cy="58.500" r="1.300" fill="#fff"/>
  <path d="M77 66.500Q80.500 70.500 84 66.500" fill="none" stroke="#2b2330" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="67.500" cy="67.500" rx="4" ry="2.400" fill="#ff8fb8" opacity="0.6"/>
  <ellipse cx="91" cy="67.500" rx="3.400" ry="2.400" fill="#ff8fb8" opacity="0.6"/>

  <!-- the water in front, foam where it breaks, splashes -->
  <path d="M0 86C12 82.500 22 83 32 86C44 89.500 54 90 66 87.500C78 85 88 84.500 98 87C106 89 114 88.500 120 86.500V120H0Z" fill="#3fc1cf"/>
  <path d="M0 99C14 95.500 28 97 42 100C58 103.500 76 102.500 92 99.500C102 97.500 112 98 120 100V120H0Z" fill="#1f9cb3" opacity="0.55"/>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="2.600" opacity="0.85">
    <path d="M26 87C32 89 38 90 44 90.500M70 89.500C76 88.500 82 87.500 88 87.500M30 106H46M78 108H92"/>
  </g>
  <g fill="#fff"><circle cx="14" cy="72" r="2.200"/><circle cx="8.500" cy="65" r="1.500"/><circle cx="102" cy="74" r="2"/><circle cx="108" cy="67.500" r="1.400"/></g>
  <!-- a sparkle by the tusk -->
  <path d="M96 13.500L97.300 17.200L101 18.500L97.300 19.800L96 23.500L94.700 19.800L91 18.500L94.700 17.200Z" fill="#fff"/>
  </g>
</svg>
