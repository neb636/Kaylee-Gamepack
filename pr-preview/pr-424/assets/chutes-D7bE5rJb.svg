<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Ladders and slides game</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ddf7ee"/><stop offset="1" stop-color="#a9e8d2"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="board"><rect x="16" y="20" width="88" height="80" rx="8"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>
  <ellipse cx="60" cy="106" rx="42" ry="5" fill="#4b3a8c" opacity="0.14"/>

  <!-- the board: pastel squares -->
  <g clip-path="url(#board)">
    <rect x="16" y="20" width="88" height="80" fill="#fff7f0"/>
    <g opacity="0.9">
      <rect x="16" y="20" width="22" height="20" fill="#ffe1ee"/><rect x="60" y="20" width="22" height="20" fill="#e0f2ff"/>
      <rect x="38" y="40" width="22" height="20" fill="#fff5d1"/><rect x="82" y="40" width="22" height="20" fill="#ece6ff"/>
      <rect x="16" y="60" width="22" height="20" fill="#ddf7ee"/><rect x="60" y="60" width="22" height="20" fill="#ffe9de"/>
      <rect x="38" y="80" width="22" height="20" fill="#ece6ff"/><rect x="82" y="80" width="22" height="20" fill="#ffe1ee"/>
    </g>
    <rect x="96" y="20" width="8" height="80" fill="#efdccd" opacity="0.6"/>
  </g>

  <!-- the gold ladder going up -->
  <path d="M28 96L44 28M42 98L58 30" stroke="#ffc83d" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M42 98L58 30" stroke="#eba123" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M32 84H46M35.5 70H49.5M39 56H53M42.5 42H56.5" stroke="#ffe189" stroke-width="3.6" stroke-linecap="round"/>

  <!-- the striped slide curving down -->
  <path d="M88 26C104 40 70 52 84 66C94 76 74 86 92 98" fill="none" stroke="#ff8fb8" stroke-width="11" stroke-linecap="round"/>
  <path d="M88 26C104 40 70 52 84 66C94 76 74 86 92 98" fill="none" stroke="#fff" stroke-width="11" stroke-dasharray="4 8" stroke-linecap="butt"/>
  <path d="M92 30C100 38 90 44 84 50" fill="none" stroke="#ffc4da" stroke-width="2.4" stroke-linecap="round"/>

  <!-- the gold star at the top -->
  <path d="M60 6L63.5 14L72 14.8L65.6 20.4L67.6 28.8L60 24.4L52.4 28.8L54.4 20.4L48 14.8L56.5 14Z" fill="#ffc83d"/>
  <path d="M60 6L63.5 14L72 14.8L65.6 20.4L67.6 28.8L60 24.4Z" fill="#eba123"/>
</svg>
