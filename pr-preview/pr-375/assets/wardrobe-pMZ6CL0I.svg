  <rect x="33" y="28" width="54" height="5" fill="#7d68cc"/>
  <rect x="33" y="85" width="54" height="11" fill="#ddd2ff"/>
  <rect x="33" y="93" width="54" height="3" fill="#c4b4f8"/>
  <rect x="56" y="88.5" width="8" height="3" rx="1.5" fill="#937ee0"/>
