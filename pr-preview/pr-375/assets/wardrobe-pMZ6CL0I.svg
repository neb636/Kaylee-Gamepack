    <g fill="#fff" opacity="0.9"><circle cx="45" cy="66" r="1.4"/><circle cx="52" cy="63" r="1.4"/><circle cx="49" cy="73" r="1.4"/><circle cx="42" cy="76" r="1.4"/><circle cx="57" cy="70" r="1.4"/><circle cx="62" cy="77" r="1.4"/><circle cx="55" cy="77.5" r="1.4"/></g>
