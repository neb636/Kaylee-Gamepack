<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Snorkeling</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ddf7ee"/><stop offset="1" stop-color="#a9e8d2"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sea" x1="0" y1="30" x2="0" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8fe3ea"/><stop offset="1" stop-color="#3fc1cf"/></linearGradient>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <!-- under the water, the surface shimmering at the top -->
  <rect x="0" y="22" width="120" height="98" fill="url(#sea)"/>
  <path d="M0 22C10 18 20 26 30 22C40 18 50 26 60 22C70 18 80 26 90 22C100 18 110 26 120 22V27C110 31 100 23 90 27C80 31 70 23 60 27C50 31 40 23 30 27C20 31 10 23 0 27Z" fill="#c7f3e4"/>
  <circle cx="60" cy="60" r="46" fill="url(#glow)" opacity="0.6"/>
  <!-- coral on the sea floor -->
  <path d="M0 108C20 102 40 106 60 104C80 102 100 106 120 102V120H0Z" fill="#f5dba8"/>
  <g fill="#ff8fb8"><circle cx="16" cy="102" r="7"/><circle cx="24" cy="98" r="5"/></g>
  <circle cx="18" cy="100" r="2.5" fill="#ffc4da"/>
  <g fill="#ffc2a8"><circle cx="102" cy="100" r="6"/><circle cx="110" cy="104" r="5"/></g>
  <path d="M90 106V96M90 98L86 92M90 100L94 94" stroke="#b9a6f5" stroke-width="3" stroke-linecap="round"/>
  <!-- the snorkel tube, behind the mask -->
  <path d="M90 52V20C90 16 96 16 96 20V56C96 64 90 70 82 70" fill="none" stroke="#ffc83d" stroke-width="6" stroke-linecap="round"/>
  <path d="M90 22V14" stroke="#ff4f9a" stroke-width="7" stroke-linecap="round"/>
  <!-- the mask: a pink frame, two big lenses -->
  <path d="M22 50C22 42 28 38 36 38H84C92 38 98 42 98 50V62C98 72 90 76 82 74C74 72 70 66 60 66C50 66 46 72 38 74C30 76 22 72 22 62Z" fill="#ff4f9a"/>
  <path d="M84 38C92 38 98 42 98 50V62C98 72 90 76 82 74C88 70 90 64 90 56V50C90 44 88 40 84 38Z" fill="#d8367f"/>
  <path d="M28 46C28 43 31 42 34 42H56C58 42 58 44 58 46V60C54 60 50 62 46 66C42 68 34 70 30 66C28 64 28 62 28 60Z" fill="#c9e9ff"/>
  <path d="M62 46C62 44 62 42 64 42H86C89 42 92 43 92 46V60C92 62 92 64 90 66C86 70 78 68 74 66C70 62 66 60 62 60Z" fill="#8ccfff"/>
  <path d="M33 47L40 47M33 52L37 52" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <path d="M67 47L74 47" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <path d="M28 41C32 39 36 38.5 40 38.5" fill="none" stroke="#ff8fc0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- bubbles up to the surface -->
  <g fill="none" stroke="#fff" stroke-width="2.5"><circle cx="100" cy="36" r="4"/><circle cx="106" cy="46" r="3"/><circle cx="98" cy="10" r="0" /></g>
  <g fill="#fff" opacity="0.8"><circle cx="102" cy="30" r="1.5"/></g>
  <!-- a little parrotfish swimming by -->
  <g transform="translate(46 90)">
    <path d="M14 0L24-7V7Z" fill="#5cc6a6"/>
    <ellipse cx="0" cy="0" rx="16" ry="9" fill="#8fe3c8"/>
    <path d="M-2 9C8 8 14 4 16 0H-4C-4 4-4 7-2 9Z" fill="#5cc6a6"/>
    <path d="M-16 0C-14-6-10-8-6-8C-8-4-8 4-6 8C-10 8-14 6-16 0Z" fill="#ff8fb8"/>
    <circle cx="-9" cy="-2" r="2.2" fill="#2b2330"/><circle cx="-8.3" cy="-2.8" r="0.8" fill="#fff"/>
    <path d="M2-9L8-12L10-8Z" fill="#b9a6f5"/>
  </g>
</svg>
