<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Gum Tree Forest</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ddf7ee"/><stop offset="1" stop-color="#a9e8d2"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <path id="leaf" d="M0 0C4.5 6 5.5 15 1 25C-3.5 16-4 7 0 0Z"/>
    <clipPath id="head"><circle cx="60" cy="53" r="24"/></clipPath>
    <clipPath id="body"><ellipse cx="61" cy="90" rx="21" ry="15"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>

  <!-- a far spray of gum leaves in the haze -->
  <path d="M-2 13C10 17 22 19 36 16" fill="none" stroke="#b5dcc8" stroke-width="2.5" stroke-linecap="round"/>
  <g fill="#a9dcc2">
    <use href="#leaf" transform="translate(8 15) rotate(8)"/>
    <use href="#leaf" transform="translate(18 17.5) rotate(-12)"/>
    <use href="#leaf" transform="translate(28 17.5) rotate(14)"/>
  </g>

  <!-- the koala's lower half, behind the branch, feet dangling -->
  <g clip-path="url(#body)">
    <rect x="38" y="74" width="46" height="32" fill="#9790ba"/>
    <ellipse cx="58" cy="88" rx="21" ry="15" fill="#bcb6d6"/>
  </g>
  <ellipse cx="50" cy="103" rx="6.5" ry="5" fill="#bcb6d6"/>
  <ellipse cx="72" cy="101.5" rx="6.5" ry="5" fill="#9790ba"/>
  <ellipse cx="50" cy="104.5" rx="3.6" ry="2.4" fill="#dedaf0"/>
  <ellipse cx="72" cy="103" rx="3.6" ry="2.4" fill="#bcb6d6"/>

  <!-- the gum tree branch: lit on top, shaded below -->
  <path d="M-4 83C30 78 80 70 124 65L124 80C80 85 30 93-4 98Z" fill="#c99266"/>
  <path d="M-4 83C30 78 80 70 124 65L124 69C80 74 30 82-4 87Z" fill="#e5b78f"/>
  <path d="M124 76C80 81 30 89-4 94L-4 98C30 93 80 85 124 80Z" fill="#a46e4b"/>
  <path d="M8 90.5l9-1.4M92 76.5l10-1.6M100 80l6-1" stroke="#a46e4b" stroke-width="2.2" stroke-linecap="round"/>

  <!-- leaves hanging under the branch on the left -->
  <path d="M20 93C16 98 12 102 6 106" fill="none" stroke="#a46e4b" stroke-width="3" stroke-linecap="round"/>
  <use href="#leaf" transform="translate(16 97) rotate(18)" fill="#3e9e78"/>
  <use href="#leaf" transform="translate(11 102) rotate(-8)" fill="#73cf86"/>
  <use href="#leaf" transform="translate(7 105) rotate(34)" fill="#48a96c"/>
  <!-- a twig with leaves on the right -->
  <path d="M97 72C103 63 109 55 117 47" fill="none" stroke="#a46e4b" stroke-width="3.5" stroke-linecap="round"/>
  <use href="#leaf" transform="translate(101 66) rotate(-38)" fill="#48a96c"/>
  <use href="#leaf" transform="translate(106 59) rotate(-150)" fill="#73cf86"/>
  <use href="#leaf" transform="translate(110 55) rotate(-62)" fill="#3e9e78"/>
  <use href="#leaf" transform="translate(114 50) rotate(-125)" fill="#48a96c"/>
  <use href="#leaf" transform="translate(116 48) rotate(-88)" fill="#73cf86"/>
  <path d="M104 74.5c5 1 9 4 11 9" fill="none" stroke="#aee8b7" stroke-width="2" stroke-linecap="round" opacity="0"/>

  <!-- arms hugging the branch, paws over the front -->
  <path d="M41 67C37 73 36.5 81 39.5 87" fill="none" stroke="#bcb6d6" stroke-width="11" stroke-linecap="round"/>
  <path d="M79.5 65C83.5 70.5 84 77.5 81.5 83.5" fill="none" stroke="#a9a2cb" stroke-width="11" stroke-linecap="round"/>
  <ellipse cx="40" cy="89" rx="7" ry="5.5" fill="#bcb6d6"/>
  <ellipse cx="81" cy="85.5" rx="7" ry="5.5" fill="#a9a2cb"/>
  <path d="M36.5 91.5v1.5M40 92v1.8M43.5 91.5v1.5" stroke="#9790ba" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M77.5 88v1.5M81 88.5v1.8M84.5 88v1.5" stroke="#857eab" stroke-width="1.8" stroke-linecap="round"/>

  <!-- fluffy round ears -->
  <circle cx="37" cy="35" r="13.5" fill="#bcb6d6"/>
  <circle cx="83" cy="35" r="13.5" fill="#a9a2cb"/>
  <circle cx="38.5" cy="36.5" r="8.5" fill="#fff"/>
  <circle cx="81.5" cy="36.5" r="8.5" fill="#efeaff"/>
  <circle cx="39.5" cy="37.5" r="4.6" fill="#ffc4da"/>
  <circle cx="80.5" cy="37.5" r="4.6" fill="#ff8fb8"/>
  <path d="M26.5 31C28 26.5 32 23 36.5 22" fill="none" stroke="#dedaf0" stroke-width="2.6" stroke-linecap="round"/>

  <!-- head: lavender grey, a shaded crescent bottom-right -->
  <g clip-path="url(#head)">
    <rect x="34" y="28" width="52" height="52" fill="#9790ba"/>
    <circle cx="56.5" cy="49.5" r="24" fill="#bcb6d6"/>
    <ellipse cx="60" cy="72" rx="12" ry="6" fill="#dedaf0"/>
  </g>
  <path d="M41.5 43C43.5 37 48.5 32.5 55 31" fill="none" stroke="#dedaf0" stroke-width="3" stroke-linecap="round"/>

  <!-- the big nose, sleepy eyes, a little smile -->
  <path d="M53.5 53C53.5 49 56.5 47.5 60 47.5C63.5 47.5 66.5 49 66.5 53C66.5 59 64 64.5 60 64.5C56 64.5 53.5 59 53.5 53Z" fill="#2b2330"/>
  <ellipse cx="57.2" cy="51" rx="2" ry="1.3" transform="rotate(-20 57.2 51)" fill="#fff"/>
  <path d="M41.5 50.5Q45.5 54.5 49.5 50.5M70.5 50.5Q74.5 54.5 78.5 50.5" fill="none" stroke="#2b2330" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M56.5 68Q60 70.8 63.5 68" fill="none" stroke="#2b2330" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="43" cy="60" rx="5" ry="3" fill="#ff8fb8" opacity="0.55"/>
  <ellipse cx="77" cy="60" rx="5" ry="3" fill="#ff8fb8" opacity="0.55"/>
</svg>
