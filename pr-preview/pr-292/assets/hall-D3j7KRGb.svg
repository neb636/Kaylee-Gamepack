<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>HarborLand</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ece6ff"/><stop offset="1" stop-color="#cdbfff"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="net"><rect x="18" y="25" width="84" height="64"/></clipPath>
    <g id="bp"><circle r="5.4" fill="#e7699c"/><circle cx="-0.9" cy="-0.9" r="4.5" fill="#ff8fb8"/><circle cx="-2.1" cy="-2.1" r="1.4" fill="#ffc4da"/></g>
    <g id="bm"><circle r="5.4" fill="#5cc6a6"/><circle cx="-0.9" cy="-0.9" r="4.5" fill="#8fe3c8"/><circle cx="-2.1" cy="-2.1" r="1.4" fill="#c7f3e4"/></g>
    <g id="bb"><circle r="5.4" fill="#ecc95c"/><circle cx="-0.9" cy="-0.9" r="4.5" fill="#fbea9a"/><circle cx="-2.1" cy="-2.1" r="1.4" fill="#fff6cc"/></g>
    <g id="bs"><circle r="5.4" fill="#5fb0ea"/><circle cx="-0.9" cy="-0.9" r="4.5" fill="#8ccfff"/><circle cx="-2.1" cy="-2.1" r="1.4" fill="#c9e9ff"/></g>
    <g id="bl"><circle r="5.4" fill="#937ee0"/><circle cx="-0.9" cy="-0.9" r="4.5" fill="#b9a6f5"/><circle cx="-2.1" cy="-2.1" r="1.4" fill="#ddd2ff"/></g>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>
  <ellipse cx="60" cy="104" rx="46" ry="5" fill="#4b3a8c" opacity="0.14"/>

