  <path clip-path="url(#net)" d="M-31 25l64 64M-22 25l64 64M-13 25l64 64M-4 25l64 64M5 25l64 64M14 25l64 64M23 25l64 64M32 25l64 64M41 25l64 64M50 25l64 64M59 25l64 64M68 25l64 64M77 25l64 64M86 25l64 64M95 25l64 64M24 25l-64 64M33 25l-64 64M42 25l-64 64M51 25l-64 64M60 25l-64 64M69 25l-64 64M78 25l-64 64M87 25l-64 64M96 25l-64 64M105 25l-64 64M114 25l-64 64M123 25l-64 64M132 25l-64 64M141 25l-64 64M150 25l-64 64" fill="none" stroke="#fff" stroke-width="2" opacity="0.55"/>
  <rect x="14" y="22" width="92" height="4" rx="2" fill="#fff"/>
  <rect x="12" y="20" width="8" height="78" rx="4" fill="#ff8fb8"/>
  <rect x="16.5" y="20" width="3.5" height="78" rx="1.75" fill="#e7699c"/>
  <rect x="100" y="20" width="8" height="78" rx="4" fill="#ff8fb8"/>
  <rect x="104.5" y="20" width="3.5" height="78" rx="1.75" fill="#e7699c"/>
  <path d="M14.5 24V40M102.5 24V40" stroke="#ffc4da" stroke-width="2" stroke-linecap="round"/>

  <!-- the yellow tube slide, swooping down into the balls -->
  <path d="M8 36C40 28 76 30 86 48C94 62 86 74 70 79" fill="none" stroke="#eba123" stroke-width="17" transform="translate(1.5 2)"/>
  <path d="M8 36C40 28 76 30 86 48C94 62 86 74 70 79" fill="none" stroke="#ffc83d" stroke-width="17"/>
  <path d="M8 36C40 28 76 30 86 48C94 62 86 74 70 79" fill="none" stroke="#eba123" stroke-width="17" stroke-dasharray="2.5 10" opacity="0.45"/>
  <path d="M10 32C40 24 74 25 86 40" fill="none" stroke="#ffe189" stroke-width="3" stroke-linecap="round" transform="translate(0 -1)"/>
  <ellipse cx="70" cy="79" rx="4.2" ry="8.6" fill="#eba123" transform="rotate(-18 70 79)"/>
  <ellipse cx="69.3" cy="79.2" rx="2.6" ry="6.6" fill="#b9802a" transform="rotate(-18 69.3 79.2)"/>

  <!-- the balls, heaped up behind the pit's front wall -->
  <use href="#bl" x="26" y="84"/><use href="#bb" x="36" y="85"/><use href="#bs" x="46" y="84"/><use href="#bp" x="56" y="85"/><use href="#bm" x="66" y="86"/><use href="#bb" x="76" y="85"/><use href="#bp" x="86" y="84"/><use href="#bs" x="95" y="85"/>
  <use href="#bp" x="31" y="77"/><use href="#bm" x="41" y="76"/><use href="#bb" x="51" y="76.5"/><use href="#bl" x="61" y="77.5"/><use href="#bs" x="81" y="77"/><use href="#bm" x="90.5" y="78"/>
  <use href="#bs" x="37" y="69"/><use href="#bp" x="47" y="68.5"/><use href="#bm" x="56.5" y="69.5"/><use href="#bb" x="86" y="70.5"/>

  <!-- the pit's padded front wall -->
  <rect x="14" y="86" width="92" height="16" rx="5" fill="#8ccfff"/>
  <rect x="14" y="97" width="92" height="5" rx="2.5" fill="#5fb0ea"/>
  <rect x="12" y="84" width="96" height="5.5" rx="2.75" fill="#ff8fb8"/>
  <rect x="12" y="87.5" width="96" height="2" fill="#e7699c"/>
  <path d="M15 85.8H50" stroke="#ffc4da" stroke-width="2" stroke-linecap="round"/>
  <path d="M37 90V100M60 90V100M83 90V100" stroke="#5fb0ea" stroke-width="2" stroke-linecap="round"/>
  <path d="M18 92H30" stroke="#c9e9ff" stroke-width="2" stroke-linecap="round"/>

  <!-- a ball bouncing out, and a sparkle -->
  <use href="#bp" x="98" y="62"/>
  <path d="M60 15v5M57.5 17.5h5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
</svg>
