<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Cafe</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff5d1"/><stop offset="1" stop-color="#ffe08f"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="drink"><path d="M33.5 41L38 92A10 2.5 0 0 0 58 92L62.5 41Z"/></clipPath>
    <clipPath id="above"><rect x="40" y="0" width="50" height="41"/></clipPath>
    <clipPath id="berry"><path d="M0 0C5.5-1 8 3 7.5 7.5C7 12 3 15.5 0 16.5C-3 15.5-7 12-7.5 7.5C-8 3-5.5-1 0 0Z"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="58" cy="56" r="50" fill="url(#glow)"/>
  <ellipse cx="62" cy="101" rx="40" ry="5" fill="#4b3a8c" opacity="0.14"/>

  <!-- the clear cup -->
  <path d="M31 36A17 4.5 0 0 1 65 36L59.5 97A11.5 3 0 0 1 36.5 97Z" fill="#fff" opacity="0.55"/>

  <!-- the strawberry smoothie: lit on the left, shaded on the right, bits of berry -->
  <g clip-path="url(#drink)">
    <rect x="30" y="36" width="36" height="62" fill="#ff8fb8"/>
    <path d="M53 41H63V96H50Z" fill="#e7699c"/>
    <path d="M36.5 46L40 88" stroke="#ffc4da" stroke-width="3" stroke-linecap="round"/>
    <g fill="#d8367f" opacity="0.5"><circle cx="44" cy="55" r="1.4"/><circle cx="50" cy="66" r="1.4"/><circle cx="43.5" cy="76" r="1.4"/><circle cx="52" cy="83" r="1.4"/><circle cx="56" cy="52" r="1.4"/></g>
  </g>
  <ellipse cx="48" cy="41" rx="14.5" ry="3.6" fill="#ffc4da"/>
  <ellipse cx="45" cy="40" rx="7" ry="1.6" fill="#ffe1ee"/>

  <!-- the straw, dipping in -->
  <g clip-path="url(#above)">
    <g transform="translate(54 42) rotate(30)">
      <rect x="-2.75" y="-34" width="5.5" height="36" rx="2.75" fill="#ff4f9a"/>
      <rect x="0.5" y="-34" width="2.25" height="36" fill="#d8367f"/>
      <path d="M-2.75-29.5l5.5-3.2M-2.75-21.5l5.5-3.2M-2.75-13.5l5.5-3.2M-2.75-5.5l5.5-3.2" stroke="#fff" stroke-width="2.2"/>
    </g>
  </g>
  <ellipse cx="54" cy="41.5" rx="4.2" ry="1.4" fill="#e7699c"/>

  <!-- the glass: a thick base, a front lip, a shine down the left -->
  <path d="M38 92A10 2.5 0 0 0 58 92L57.5 96A9 2.4 0 0 1 38.5 96Z" fill="#fff" opacity="0.6"/>
  <path d="M31.5 36.5A16.5 4 0 0 0 64.5 36.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <path d="M31.5 35.5A16.5 4 0 0 1 64.5 35.5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
  <path d="M35 47L38 85M37.5 89l0.3 2.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>

  <!-- a strawberry on the rim -->
  <g transform="translate(31.5 30.5) rotate(-22)">
    <g clip-path="url(#berry)">
      <rect x="-9" y="-2" width="18" height="20" fill="#d9485e"/>
      <path d="M-1 -1C4.5-2 6.5 2.5 6 7C5.5 11.5 2 14.5-1.5 15.5C-4.5 14.5-8 11-8.5 6.5C-9 2-6.5-2-1-1Z" fill="#ff6b6b"/>
    </g>
    <path d="M-4.5 3.5a5 5 0 0 1 2.5-2.5" fill="none" stroke="#ffa3a3" stroke-width="2" stroke-linecap="round"/>
    <g fill="#fff6cc"><ellipse cx="-3" cy="7" rx="0.9" ry="1.2"/><ellipse cx="2.5" cy="5" rx="0.9" ry="1.2"/><ellipse cx="0" cy="11" rx="0.9" ry="1.2"/><ellipse cx="4" cy="10" rx="0.9" ry="1.2"/><ellipse cx="-4" cy="11.5" rx="0.9" ry="1.2"/></g>
    <path d="M0 1.5L-6.5-0.5L-3.5-2L-4.5-5.5L-1-3.5L0-6.5L1-3.5L4.5-5.5L3.5-2L6.5-0.5Z" fill="#73cf86" stroke="#73cf86" stroke-width="1" stroke-linejoin="round"/>
    <path d="M0-4V-8.5" stroke="#48a96c" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- a slice of strawberry cake on a little plate -->
  <ellipse cx="84" cy="98.5" rx="18" ry="4.5" fill="#efdccd"/>
  <ellipse cx="84" cy="97.5" rx="18" ry="4" fill="#fff7f0"/>
  <path d="M95 84L101 80V92L95 96Z" fill="#ecc95c"/>
  <path d="M95 84L101 80V83.5L95 87.5Z" fill="#e7699c"/>
  <rect x="68" y="84" width="27" height="12" fill="#fbea9a"/>
  <rect x="68" y="88.5" width="27" height="3" fill="#ff8fb8"/>
  <rect x="68" y="91.5" width="27" height="1.5" fill="#fff7f0"/>
  <path d="M68 84H95L101 80L74 80Z" fill="#ff8fb8"/>
  <path d="M68 84H95V86C93 88 91 88 90 86C88 88.5 86 88.5 85 86C83 88 81 88 80 86C78 88.5 76 88.5 75 86C73 88 71 88 68 86Z" fill="#ff8fb8"/>
  <path d="M71 82.5L90 82.5" stroke="#ffc4da" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="94" cy="80" rx="4.5" ry="2.8" fill="#fff"/>
  <path d="M94 80.5C97 80.5 99 77.5 98 74.5C97 72 94 71.5 93 73C91.5 71.5 88.5 72 88.5 75C88.5 78 91 80.5 94 80.5Z" fill="#ff6b6b"/>
  <path d="M94 80.5C97 80.5 99 77.5 98 74.5C97.5 77 95.5 79 93 79.5Z" fill="#d9485e"/>
  <path d="M93 73.5V70.5" stroke="#48a96c" stroke-width="2" stroke-linecap="round"/>
</svg>
