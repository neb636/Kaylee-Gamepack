<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Write Like a Pharaoh</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9de"/><stop offset="1" stop-color="#ffc3a8"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <!-- a rolled end of the scroll, its axis at x=0 -->
    <path id="rollP" d="M-6 31V88A6 2.6 0 0 0 6 88V31Z"/>
    <clipPath id="roll"><use href="#rollP"/></clipPath>
    <g id="rollG">
      <g clip-path="url(#roll)">
        <rect x="-6" y="28" width="12" height="64" fill="#f5dba8"/>
        <rect x="2" y="28" width="4" height="64" fill="#e3bb7a"/>
        <rect x="-4.5" y="28" width="2" height="64" fill="#fdeecc"/>
      </g>
      <ellipse cx="0" cy="31" rx="6" ry="2.6" fill="#fdeecc"/>
      <ellipse cx="0" cy="31" rx="2.8" ry="1.2" fill="#e3bb7a"/>
    </g>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>
  <ellipse cx="60" cy="93" rx="45" ry="5" fill="#4b3a8c" opacity="0.14"/>

  <!-- the papyrus sheet: lit along the top, curling into shade along the bottom -->
  <path d="M22 34C40 32 58 35.5 76 33.5C84 32.5 92 33 98 34V84C82 86 66 83 50 85C38 86 30 85 22 84Z" fill="#fbe6bd"/>
  <path d="M22 34C40 32 58 35.5 76 33.5C84 32.5 92 33 98 34V37.5C92 36.5 84 36 76 37C58 39 40 35.5 22 37.5Z" fill="#fff4dc"/>
  <path d="M22 80C30 81 40 81.5 50 81C66 79.5 82 82 98 80V84C82 86 66 83 50 85C38 86 30 85 22 84Z" fill="#efcf98"/>

  <!-- the two rolled ends -->
  <use href="#rollG" x="22"/>
  <use href="#rollG" x="98"/>

  <!-- picture writing: an eye, a little bird, a basket (one of the game's glyphs), and water -->
  <path d="M29 50Q38 41 47 50Q38 59 29 50Z" fill="#6b432e"/>
  <path d="M32.5 50Q38 45 43.5 50Q38 55 32.5 50Z" fill="#fff7f0"/>
  <circle cx="38" cy="50" r="2.6" fill="#6b432e"/>
  <circle cx="38.9" cy="49.1" r="0.9" fill="#fff"/>
  <path d="M31.5 43.5Q38 39 44.5 43.5" fill="none" stroke="#6b432e" stroke-width="2.5" stroke-linecap="round"/>

  <path d="M64.5 50L70.5 46.5L68.5 54Z" fill="#4d94d8"/>
  <ellipse cx="60.5" cy="53" rx="6.8" ry="5.6" fill="#6cb2f0"/>
  <path d="M58 51.5C60.5 49.5 65 50 66.5 53C64 55.5 60 55.5 58 51.5Z" fill="#4d94d8"/>
  <circle cx="55" cy="46.5" r="4" fill="#6cb2f0"/>
  <path d="M51.3 45.5L48 47L51.3 48.5Z" fill="#ffc83d"/>
  <circle cx="54.2" cy="45.6" r="1.2" fill="#2b2330"/>
  <path d="M59 58.3V62.5M62.5 58.3V62.5" stroke="#e57a35" stroke-width="2" stroke-linecap="round"/>

  <path d="M72 49.5H88C88 56.5 84.5 60.5 80 60.5C75.5 60.5 72 56.5 72 49.5Z" fill="#e9785a"/>
  <path d="M80 60.5C84.5 60.5 88 56.5 88 49.5H84C84 55.5 82.5 59 80 60.5Z" fill="#c65a45"/>
  <path d="M88 52.5C91.5 52.5 92.5 56.5 89.5 58" fill="none" stroke="#e9785a" stroke-width="2.4" stroke-linecap="round"/>
  <rect x="72" y="48.5" width="16" height="2.6" rx="1.3" fill="#f6a283"/>

  <path d="M31 70.5q3.25-3.5 6.5 0t6.5 0 6.5 0 6.5 0 6.5 0 6.5 0 6.5 0 6.5 0" fill="none" stroke="#1f9cb3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the reed pen, its tip on the paper -->
  <g transform="translate(85 72.5) rotate(-52)">
    <path d="M3 2.5L34 5.5V9.5L5 4Z" fill="#4b3a8c" opacity="0.15"/>
    <rect x="8" y="-3" width="26" height="6" rx="3" fill="#a46e4b"/>
    <rect x="8" y="-3" width="26" height="3.8" rx="1.9" fill="#c99266"/>
    <rect x="12" y="-2.6" width="14" height="2" rx="1" fill="#e5b78f"/>
    <rect x="20" y="-3" width="2.5" height="6" fill="#8a5b3d"/>
    <path d="M0 0L8.5-3V3Z" fill="#e5b78f"/>
    <path d="M0 0L3.5-1.2V1.2Z" fill="#2b2330"/>
  </g>
</svg>
