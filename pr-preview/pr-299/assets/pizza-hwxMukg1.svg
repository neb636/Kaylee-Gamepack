    <clipPath id="pep"><circle r="4.5"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>
  <ellipse cx="60" cy="101" rx="38" ry="5" fill="#4b3a8c" opacity="0.14"/>

