    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="canal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fe3ea"/><stop offset="1" stop-color="#2fb3c7"/></linearGradient>
    <clipPath id="pole1"><rect x="93" y="44" width="6" height="62" rx="3"/></clipPath>
    <clipPath id="pole2"><rect x="105" y="50" width="6" height="56" rx="3"/></clipPath>
