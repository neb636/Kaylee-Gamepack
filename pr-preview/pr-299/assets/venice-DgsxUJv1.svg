  <g fill="#fff" opacity="0.6"><rect x="14" y="104" width="20" height="3" rx="1.5"/><rect x="70" y="110" width="26" height="3" rx="1.5"/><rect x="40" y="114" width="16" height="3" rx="1.5"/></g>

