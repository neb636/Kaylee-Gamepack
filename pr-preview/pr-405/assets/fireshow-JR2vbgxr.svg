<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>The fire show</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b78e6"/><stop offset="1" stop-color="#ffc3a8"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffe189" stop-opacity="0.9"/><stop offset="1" stop-color="#ffe189" stop-opacity="0"/></radialGradient>
    <!-- one flame, base at 0,0 -->
    <g id="flame"><path d="M0 0C-7 0-9-7-6-12C-4-15-3-18-2-22C2-18 8-12 7-6C6-2 4 0 0 0Z" fill="#ff9c57"/><path d="M0 0C-3 0-4-4-3-7C-2-9-1-11 0-13C2-10 4-7 3-4C3-2 2 0 0 0Z" fill="#ffe189"/></g>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#fff"><circle cx="14" cy="14" r="1.5"/><circle cx="34" cy="8" r="1.2"/><circle cx="100" cy="12" r="1.5"/><circle cx="108" cy="30" r="1.2"/><circle cx="10" cy="36" r="1.2"/></g>
  <circle cx="60" cy="56" r="46" fill="url(#glow)"/>
  <!-- the dark beach -->
  <path d="M0 96C30 92 90 92 120 96V120H0Z" fill="#937ee0"/>
  <ellipse cx="60" cy="98" rx="40" ry="5" fill="#ffc595" opacity="0.5"/>
  <!-- the poi's figure-of-eight ribbons of light -->
  <path d="M60 58C48 40 22 34 18 52C14 70 44 76 60 58C76 40 106 46 102 64C98 82 72 76 60 58Z" fill="none" stroke="#ffc83d" stroke-width="6" stroke-linecap="round"/>
  <path d="M60 58C50 46 30 42 27 54C24 66 46 70 60 58C74 46 96 50 93 62C90 74 70 70 60 58Z" fill="none" stroke="#ff8fc0" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <!-- the two fireballs, flying round the loops -->
  <g transform="translate(22 42)"><circle r="10" fill="#ff6b6b"/><circle r="6" fill="#ffc83d"/><circle r="2.5" fill="#fff6cc"/></g>
  <g transform="translate(98 74)"><circle r="10" fill="#ff6b6b"/><circle r="6" fill="#ffc83d"/><circle r="2.5" fill="#fff6cc"/></g>
  <use href="#flame" transform="translate(30 38) rotate(60)"/>
  <use href="#flame" transform="translate(24 34) rotate(20) scale(0.8)"/>
  <use href="#flame" transform="translate(90 78) rotate(-120)"/>
  <use href="#flame" transform="translate(96 82) rotate(-160) scale(0.8)"/>
  <!-- the ring of little flames on the sand -->
  <use href="#flame" transform="translate(20 100) scale(0.7)"/><use href="#flame" transform="translate(40 98) scale(0.8)"/><use href="#flame" transform="translate(60 97) scale(0.9)"/><use href="#flame" transform="translate(80 98) scale(0.8)"/><use href="#flame" transform="translate(100 100) scale(0.7)"/>
  <!-- sparks -->
  <g fill="none" stroke="#fff6cc" stroke-width="2.5" stroke-linecap="round"><path d="M100 46v6M97 49h6"/><path d="M18 64v6M15 67h6"/></g>
</svg>
