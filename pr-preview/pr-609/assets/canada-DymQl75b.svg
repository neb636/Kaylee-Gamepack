<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Canada: a moose in a red scarf</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe2ff"/><stop offset="1" stop-color="#e8f6ff"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="head"><ellipse cx="60" cy="52" rx="18.5" ry="20.5"/></clipPath>
    <clipPath id="nose"><ellipse cx="60" cy="72" rx="17" ry="13"/></clipPath>
    <clipPath id="body"><path d="M32 122C32 99 43 85 60 85C77 85 88 99 88 122Z"/></clipPath>
    <!-- one antler (her left): a stem, a broad palm and four rounded points, fanned up along the pin's round edge -->
    <g id="antler" stroke-linecap="round">
      <path d="M52 44L41 35" stroke-width="7.5"/>
      <ellipse cx="35" cy="30.5" rx="9.5" ry="7" transform="rotate(-30 35 30.5)" stroke="none"/>
      <path d="M33 33L21.5 31M33 30L25.5 21.5M36 28L33.5 15.5M40 29L42.5 13.5" stroke-width="6.5"/>
    </g>
    <path id="pine" d="M0-22L7-9H4L10 2H6L12 13H-12L-6 2H-10L-4-9H-7Z"/>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>

  <!-- far mountains with snow on top, pines, a snowy hill -->
  <path d="M-8 84L17 45Q21 40 25 45L50 84Z" fill="#c4bfe0"/>
  <path d="M17 45Q21 40 25 45L31 54Q26 51 21 56Q16 51 11 54Z" fill="#fff"/>
  <path d="M68 84L95 40Q99 35 103 40L130 84Z" fill="#bcb6d6"/>
  <path d="M95 40Q99 35 103 40L110 51Q104 48 99 53Q94 48 88 51Z" fill="#fff"/>
  <use href="#pine" transform="translate(10 78)" fill="#3e9e78"/>
  <use href="#pine" transform="translate(110 76) scale(1.15)" fill="#2b7a5f"/>
  <use href="#pine" transform="translate(24 84) scale(0.8)" fill="#69c19a"/>
  <path d="M0 92C30 84 90 84 120 92V120H0Z" fill="#fff"/>
  <path d="M0 99C32 92 88 92 120 99V120H0Z" fill="#e4ddf6" opacity="0.6"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>

  <!-- antlers: butter, a darker lower edge; the far one a shade deeper -->
  <use href="#antler" transform="translate(0 2.5)" fill="#e3bb7a" stroke="#e3bb7a"/>
  <use href="#antler" fill="#f5dba8" stroke="#f5dba8"/>
  <path d="M27 24.5L31 29" fill="none" stroke="#fdeecc" stroke-width="2.2" stroke-linecap="round"/>
  <g transform="translate(120 0) scale(-1 1)">
    <use href="#antler" transform="translate(0 2.5)" fill="#d9ae6c" stroke="#d9ae6c"/>
    <use href="#antler" fill="#ecd099" stroke="#ecd099"/>
  </g>

  <g transform="translate(0 5)">
  <!-- shoulders, with a red scarf -->
  <g clip-path="url(#body)">
    <rect x="30" y="83" width="60" height="40" fill="#a46e4b"/>
    <path d="M32 122C32 99 43 85 60 85C67 85 73 87.5 78 92C72 101 69 111 69 122Z" fill="#c99266"/>
  </g>
  <rect x="66" y="94" width="11" height="19" rx="4" fill="#d9485e"/>
  <rect x="66" y="94" width="7.5" height="19" rx="3.5" fill="#ff6b6b"/>
  <path d="M37.5 88Q60 100 82.5 88L84 97Q60 109.5 36 97Z" fill="#d9485e"/>
  <path d="M37.5 88Q52 96 68 94.5L67.5 104Q50 105 36 97Z" fill="#ff6b6b"/>
  <path d="M42 92.5Q50 96.5 58 97" fill="none" stroke="#ffa3a3" stroke-width="2.4" stroke-linecap="round"/>

  <!-- ears, pink inside -->
  <path d="M44 44C37 38 29 39 25 45C30 51 39 52 46 49Z" fill="#c99266"/>
  <path d="M41 45.5C36 42.5 32 43 29.5 45.5C33 48.5 38 49 42 47.5Z" fill="#ffc4da"/>
  <path d="M76 44C83 38 91 39 95 45C90 51 81 52 74 49Z" fill="#a46e4b"/>
  <path d="M79 45.5C84 42.5 88 43 90.5 45.5C87 48.5 82 49 78 47.5Z" fill="#f4b3cc"/>

  <!-- the head: brown, a shaded crescent on the right, a tuft on top -->
  <g clip-path="url(#head)">
    <rect x="40" y="30" width="40" height="44" fill="#a46e4b"/>
    <ellipse cx="57.5" cy="49.5" rx="18.5" ry="20.5" fill="#c99266"/>
  </g>
  <path d="M54 33C55 29 57 27 60 26C60 29 61 30 63 28C63.5 31 65 32.5 67 33Z" fill="#8a5b3d"/>
  <path d="M45 47C46 41 50 36 55 34" fill="none" stroke="#e5b78f" stroke-width="2.6" stroke-linecap="round"/>

  <!-- the big soft nose -->
  <g clip-path="url(#nose)">
    <rect x="42" y="58" width="36" height="28" fill="#d3a377"/>
    <ellipse cx="58" cy="70" rx="17" ry="13" fill="#e5b78f"/>
  </g>
  <ellipse cx="53.5" cy="68.5" rx="2.2" ry="2.8" fill="#2b2330"/>
  <ellipse cx="66.5" cy="68.5" rx="2.2" ry="2.8" fill="#2b2330"/>
  <path d="M53 76.5Q60 82 67 76.5" fill="none" stroke="#2b2330" stroke-width="2.2" stroke-linecap="round"/>

  <!-- eyes and blush -->
  <ellipse cx="51" cy="50" rx="3.3" ry="4.1" fill="#2b2330"/>
  <ellipse cx="69" cy="50" rx="3.3" ry="4.1" fill="#2b2330"/>
  <circle cx="52.2" cy="48.5" r="1.35" fill="#fff"/>
  <circle cx="70.2" cy="48.5" r="1.35" fill="#fff"/>
  <ellipse cx="44.5" cy="58.5" rx="3.6" ry="2.2" fill="#ff8fb8" opacity="0.55"/>
  <ellipse cx="75.5" cy="58.5" rx="3.6" ry="2.2" fill="#ff8fb8" opacity="0.55"/>

  </g>

  <!-- a few snowflakes -->
  <g fill="#fff"><circle cx="60" cy="20" r="1.8"/><circle cx="14" cy="58" r="1.5"/><circle cx="104" cy="62" r="1.4"/></g>
</svg>
