<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" preserveAspectRatio="xMidYMid slice">
  <title>Koh Samet</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="250" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9fd4fa"/><stop offset="1" stop-color="#e4f4ff"/></linearGradient>
    <radialGradient id="sunglow" cx="980" cy="96" r="240" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff8dc" stop-opacity="0.95"/><stop offset="0.35" stop-color="#fff3d0" stop-opacity="0.45"/><stop offset="1" stop-color="#fff3d0" stop-opacity="0"/></radialGradient>
    <linearGradient id="sea" x1="0" y1="200" x2="0" y2="380" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3fc1cf"/><stop offset="1" stop-color="#8fe3ea"/></linearGradient>
    <linearGradient id="far" x1="0" y1="150" x2="0" y2="230" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#b9c8ee"/><stop offset="1" stop-color="#dfe9fb"/></linearGradient>
    <linearGradient id="hill" x1="0" y1="110" x2="0" y2="280" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#73cf86"/><stop offset="1" stop-color="#b9e6c6"/></linearGradient>
    <linearGradient id="sand" x1="0" y1="300" x2="0" y2="450" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#f5e6cc"/></linearGradient>
    <!-- one palm frond, from the crown at 0,0 out to the right -->
    <path id="frond" d="M0 0C24-24 62-30 92-12C72-12 48-6 36 6C54 6 72 18 78 36C54 24 30 12 0 0Z"/>
    <g id="palm">
      <use href="#frond" fill="#48a96c" transform="rotate(30)"/>
      <use href="#frond" fill="#48a96c" transform="scale(-1 1) rotate(30)"/>
      <use href="#frond" fill="#73cf86" transform="rotate(-18)"/>
      <use href="#frond" fill="#73cf86" transform="scale(-1 1) rotate(-18)"/>
      <use href="#frond" fill="#73cf86" transform="rotate(-72) scale(0.8)"/>
      <circle cx="-6" cy="8" r="8" fill="#8a5b3d"/><circle cx="8" cy="10" r="8" fill="#6b432e"/>
    </g>
  </defs>

  <!-- sky, sun, clouds, birds -->
  <rect width="1200" height="260" fill="url(#sky)"/>
  <circle cx="980" cy="96" r="240" fill="url(#sunglow)"/>
  <circle cx="980" cy="96" r="40" fill="#fff6d2"/>
  <g fill="#fff" opacity="0.9">
    <circle cx="250" cy="80" r="16"/><circle cx="278" cy="64" r="24"/><circle cx="312" cy="74" r="18"/><circle cx="336" cy="84" r="11"/>
    <rect x="232" y="80" width="116" height="17" rx="8.5"/>
  </g>
  <g fill="#fff" opacity="0.85">
    <circle cx="660" cy="60" r="12"/><circle cx="684" cy="48" r="18"/><circle cx="708" cy="58" r="12"/>
    <rect x="646" y="58" width="76" height="13" rx="6.5"/>
  </g>
  <g fill="none" stroke="#8a86c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M520 112q7-7 14 0q7-7 14 0"/><path d="M556 92q6-6 12 0q6-6 12 0"/><path d="M800 124q5-5 10 0q5-5 10 0"/>
  </g>

  <!-- the sea out to the horizon, the mainland hazy far away -->
  <rect x="0" y="208" width="1200" height="200" fill="url(#sea)"/>
  <path d="M-10 214C60 196 130 190 200 198C250 186 300 186 350 200H-10Z" fill="url(#far)"/>
  <path d="M820 212C870 200 930 196 990 204C1040 192 1110 192 1220 206V214H820Z" fill="url(#far)"/>
  <rect x="0" y="208" width="1200" height="5" fill="#8fe3ea"/>
  <!-- a small green island off the coast -->
  <path d="M860 230C880 204 920 194 950 196C980 198 1004 212 1020 230Z" fill="#73cf86"/>
  <path d="M950 196C980 198 1004 212 1020 230H970C970 216 962 204 950 196Z" fill="#48a96c"/>
  <path d="M852 232C880 226 1000 226 1028 232C1000 238 880 238 852 232Z" fill="#fff7f0"/>
  <!-- the green hill of the island behind the beach -->
  <path d="M-20 300C40 220 120 150 230 132C330 118 400 160 470 200C540 236 600 270 660 300Z" fill="url(#hill)"/>
  <path d="M230 132C330 118 400 160 470 200C540 236 600 270 660 300H420C420 230 340 160 230 132Z" fill="#3d9a6e" opacity="0.28"/>
  <path d="M100 196C140 166 180 148 220 140" fill="none" stroke="#c7f3d0" stroke-width="7" stroke-linecap="round"/>
  <g fill="#48a96c"><circle cx="160" cy="210" r="22"/><circle cx="196" cy="196" r="26"/><circle cx="300" cy="180" r="24"/><circle cx="340" cy="196" r="20"/><circle cx="440" cy="232" r="22"/></g>
  <g fill="#73cf86"><circle cx="150" cy="202" r="16"/><circle cx="188" cy="188" r="18"/><circle cx="292" cy="172" r="16"/><circle cx="432" cy="224" r="15"/></g>
  <!-- the pinkish granite rocks at the end of the beach, and the little mermaid sitting on them -->
  <path d="M590 316C596 290 616 276 640 278C664 280 676 296 680 316Z" fill="#f6a283"/>
  <path d="M640 278C664 280 676 296 680 316H652C654 300 650 286 640 278Z" fill="#e9785a"/>
  <path d="M560 320C566 302 580 296 596 298C610 300 618 310 620 320Z" fill="#f6a283"/>
  <path d="M600 288C610 282 620 280 630 281" fill="none" stroke="#ffc4a8" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(636 278)">
    <path d="M6 0C20 2 30 -6 34 -16C38 -8 34 2 26 6C20 8 10 6 6 0Z" fill="#8fe3c8"/>
    <path d="M-10 0C-12-10-6-20 4-22C14-24 18-14 14-6C12 0 6 4 0 4C-4 4-8 2-10 0Z" fill="#b9a6f5"/>
    <path d="M-8-22C-10-34-4-46 6-48C14-50 18-42 16-34L10-22Z" fill="#ffc2a8"/>
    <circle cx="4" cy="-58" r="14" fill="#ffc2a8"/>
    <path d="M-12-56C-14-72 2-80 14-72C22-66 22-56 18-48C22-38 20-28 14-24C16-34 12-44 10-50C4-54-4-54-12-56Z" fill="#ff4f9a"/>
    <circle cx="8" cy="-58" r="2" fill="#2b2330"/>
    <ellipse cx="12" cy="-52" rx="3" ry="2" fill="#ff8fb8" opacity="0.55"/>
    <path d="M14-40L28-56" stroke="#ffc2a8" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- light on the water -->
  <g fill="#fff" opacity="0.55">
    <rect x="80" y="252" width="90" height="5" rx="2.5"/><rect x="700" y="246" width="120" height="5" rx="2.5"/><rect x="900" y="266" width="80" height="5" rx="2.5"/><rect x="1040" y="250" width="100" height="5" rx="2.5"/>
  </g>
  <!-- the pink jet ski with its spray -->
  <g transform="translate(820 286)">
    <path d="M-80 10C-60 2-40 6-24 2" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <g fill="#fff"><circle cx="-60" cy="-6" r="9"/><circle cx="-76" cy="-14" r="7"/><circle cx="-48" cy="-16" r="7"/><circle cx="-64" cy="-26" r="5"/></g>
    <path d="M-30 0H34C42 0 46-4 48-8C46 4 40 10 30 12H-22C-28 12-30 6-30 0Z" fill="#fff7f0"/>
    <path d="M-28 4H46" stroke="#ff4f9a" stroke-width="4" stroke-linecap="round"/>
    <path d="M-22 0C-22-8-16-10-8-10H6C10-10 12-6 12 0Z" fill="#ff4f9a"/>
    <path d="M12 0L16-10C20-12 26-10 30-6L38 0Z" fill="#ff8fb8"/>
    <path d="M14-12L10-20M6-21H14" stroke="#5d5078" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <!-- a little speedboat far out -->
  <g transform="translate(470 234)">
    <path d="M-30 0H28L22 8H-24Z" fill="#fff7f0"/><path d="M-28 3H26" stroke="#ff4f9a" stroke-width="2.5"/>
    <rect x="-8" y="-10" width="16" height="10" rx="3" fill="#8ccfff"/>
    <path d="M30 4H48" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- the crystal-white sand in front, the swash lapping up -->
  <path d="M-20 450V336C120 312 300 306 520 314C740 322 960 314 1220 300V450Z" fill="url(#sand)"/>
  <path d="M-20 336C120 312 300 306 520 314C740 322 960 314 1220 300V310C960 326 740 334 520 326C300 318 120 324-20 346Z" fill="#c9f4f6" opacity="0.9"/>
  <path d="M120 330C200 322 280 320 360 322M700 328C800 328 900 322 1000 316" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>

  <!-- the palms leaning over the beach -->
  <g>
    <path d="M86 400C80 330 96 260 140 200L152 206C114 266 102 330 108 400Z" fill="#c99266"/>
    <path d="M100 400C94 330 108 266 146 203L152 206C114 266 102 330 108 400Z" fill="#a46e4b"/>
    <use href="#palm" transform="translate(146 200)"/>
    <path d="M1130 400C1132 330 1120 270 1086 220L1074 226C1104 276 1112 334 1108 400Z" fill="#c99266"/>
    <path d="M1122 400C1124 334 1114 276 1082 222L1074 226C1104 276 1112 334 1108 400Z" fill="#a46e4b"/>
    <use href="#palm" transform="translate(1080 220) scale(.9)"/>
  </g>
  <!-- the pink umbrella and a towel on the sand -->
  <g transform="translate(330 360)">
    <ellipse cx="10" cy="4" rx="60" ry="6" fill="#4b3a8c" opacity="0.14"/>
    <path d="M-30 0H40L46 10H-24Z" fill="#b9a6f5"/><path d="M-20 0V10M-6 0V10M8 0V10M22 0V10" stroke="#ddd2ff" stroke-width="4"/>
    <path d="M0 2V-70" stroke="#a46e4b" stroke-width="5" stroke-linecap="round"/>
    <path d="M-60-60C-56-90 56-90 60-60Z" fill="#ff8fb8"/>
    <path d="M0-82C30-82 56-74 60-60H16C16-70 10-78 0-82Z" fill="#e7699c"/>
    <path d="M-40-74C-30-80-16-82-4-82" fill="none" stroke="#ffc4da" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-82" r="5" fill="#ff4f9a"/>
  </g>
  <!-- a sandcastle with a pink flag, a bucket and a crab -->
  <g transform="translate(870 372)">
    <ellipse cx="0" cy="2" rx="50" ry="5" fill="#4b3a8c" opacity="0.14"/>
    <path d="M-34 0V-28H-18V0ZM18 0V-28H34V0Z" fill="#f5dba8"/><path d="M28-28H34V0H28Z" fill="#e3bb7a"/>
    <path d="M-18 0V-44H18V0Z" fill="#fdeecc"/><path d="M8-44H18V0H8Z" fill="#e3bb7a"/>
    <path d="M-18-44V-50H-12V-46H-6V-50H0V-46H6V-50H12V-46H18V-44Z" fill="#fdeecc"/>
    <path d="M-6 0V-12C-6-18 6-18 6-12V0Z" fill="#c99266"/>
    <path d="M0-50V-70" stroke="#a46e4b" stroke-width="3" stroke-linecap="round"/><path d="M1-70L18-65L1-60Z" fill="#ff4f9a"/>
    <path d="M44 0L46-16H60L62 0Z" fill="#8ccfff"/><path d="M56-16H60L62 0H57Z" fill="#5fb0ea"/>
  </g>
  <g transform="translate(560 390)">
    <ellipse cx="0" cy="0" rx="14" ry="8" fill="#ff6b6b"/><path d="M-2 4C6 4 12 1 14 0C12 6 6 8 0 8Z" fill="#d9485e"/>
    <path d="M-8-6V-12M8-6V-12" stroke="#ff6b6b" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-8" cy="-13" r="2.5" fill="#2b2330"/><circle cx="8" cy="-13" r="2.5" fill="#2b2330"/>
    <path d="M-14 2L-22 6M14 2L22 6M-12 6L-18 12M12 6L18 12" stroke="#d9485e" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- shells and sparkles in the sand -->
  <g fill="#ff8fb8"><path d="M210 410a6 6 0 0 1 12 0Z"/><path d="M740 420a5 5 0 0 1 10 0Z"/></g>
  <g fill="#ffc83d"><path d="M470 420a5 5 0 0 1 10 0Z"/><path d="M1000 410a6 6 0 0 1 12 0Z"/></g>
  <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M640 360v10M635 365h10"/><path d="M270 386v8M266 390h8"/></g>
</svg>
