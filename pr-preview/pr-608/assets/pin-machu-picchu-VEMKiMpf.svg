<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Machu Picchu</title>
  <defs>
    <clipPath id="round"><circle cx="60" cy="60" r="60"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfeaff"/><stop offset="1" stop-color="#fff3df"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="peak"><path d="M40 96C46 74 55 42 66 24C71 15 80 14 85 22C92 34 96 58 101 76C103 84 106 90 109 96Z"/></clipPath>
  </defs>
  <!-- a round sticker: everything sits inside the circle -->
  <g clip-path="url(#round)">
    <rect width="120" height="120" fill="url(#bg)"/>
    <circle cx="60" cy="46" r="54" fill="url(#glow)"/>

    <!-- far snowy ridges in the haze -->
    <path d="M-4 84L14 52L26 66L38 46L52 84Z" fill="#d3d6f3"/>
    <path d="M38 46L52 84H42Z" fill="#bfc2ea"/>
    <path d="M38 46L32.5 55.5L36 54L38.5 57L41.5 54L44 55.5Z" fill="#fff"/>
    <path d="M92 84L108 56L124 78V84Z" fill="#d3d6f3"/>

    <!-- the tall green peak over the old city, shaded on the right, and the hill the city sits on -->
    <g clip-path="url(#peak)">
      <rect x="38" y="10" width="74" height="88" fill="#48a96c"/>
      <path d="M40 96C46 74 55 42 66 24C71 15 78 13.5 82 17C84.5 44 84 72 82 96Z" fill="#73cf86"/>
      <path d="M56 60C58.5 48 63 36 69 27" fill="none" stroke="#aee8b7" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="72" cy="52" rx="4.5" ry="2.5" fill="#48a96c"/>
      <ellipse cx="63" cy="72" rx="5" ry="3" fill="#5cbd78"/>
      <ellipse cx="91" cy="62" rx="4.5" ry="2.5" fill="#3e9e78"/>
    </g>

    <path d="M-2 90Q56 66 122 88V122H-2Z" fill="#aee8b7"/>

    <!-- a cloud resting against the peak -->
    <g fill="#fff" opacity="0.94">
      <circle cx="93" cy="37" r="6"/><circle cx="100.5" cy="33" r="8"/><circle cx="108.5" cy="38" r="6"/>
      <rect x="87" y="36.5" width="28" height="8" rx="4"/>
    </g>

    <!-- the stone terraces, a strip of grass on each wall -->
    <path d="M14 70Q42 61 74 68V72Q42 65 14 74Z" fill="#8fd99a"/>
    <path d="M14 74Q42 65 74 72V79Q42 72 14 81Z" fill="#dedaf0"/>
    <path d="M4 82Q44 71 88 80V84Q44 75 4 86Z" fill="#8fd99a"/>
    <path d="M4 86Q44 75 88 84V92Q44 83 4 94Z" fill="#d3cdea"/>
    <path d="M-4 95Q46 83 102 93V97Q46 87 -4 99Z" fill="#8fd99a"/>
    <path d="M-4 99Q46 87 102 97V107Q46 97 -4 109Z" fill="#c9c2e4"/>
    <!-- the walls' stones, and each wall's shaded end -->
    <g stroke="#b3acd3" stroke-width="1.5" stroke-linecap="round">
      <path d="M22 72.5v5M32 70.5v5M42 69.5v5M52 69.5v5M62 70.5v5"/>
      <path d="M12 85v6M24 82v6M36 80.5v6M48 80v6M60 80.5v6M72 82v6"/>
      <path d="M6 98v7M19 95v7M32 93v7M45 92v7M58 92v7M71 93v7M84 95v7"/>
    </g>
    <path d="M74 72v7M88 84v8M102 97v10" stroke="#9790ba" stroke-width="2.5" stroke-linecap="round"/>

    <!-- little stone houses on the top terrace, straw roofs lit from the left -->
    <rect x="18" y="57" width="13" height="10" fill="#dedaf0"/>
    <rect x="26" y="57" width="5" height="10" fill="#bcb6d6"/>
    <path d="M16 58L24.5 49L33 58Z" fill="#ffc83d"/>
    <path d="M24.5 49L33 58H27Z" fill="#eba123"/>
    <rect x="21.5" y="61" width="3.5" height="6" rx="0.5" fill="#7d75a6"/>
    <rect x="36" y="53" width="16" height="12.5" fill="#dedaf0"/>
    <rect x="46" y="53" width="6" height="12.5" fill="#bcb6d6"/>
    <path d="M33.5 54L44 43L54.5 54Z" fill="#ffc83d"/>
    <path d="M44 43L54.5 54H47Z" fill="#eba123"/>
    <rect x="40" y="58" width="4" height="7.5" rx="0.5" fill="#7d75a6"/>
    <rect x="57" y="58.5" width="12" height="9" fill="#dedaf0"/>
    <rect x="64.5" y="58.5" width="4.5" height="9" fill="#bcb6d6"/>
    <path d="M55 59.5L63 51L71 59.5Z" fill="#ffc83d"/>
    <path d="M63 51L71 59.5H65.5Z" fill="#eba123"/>
    <rect x="60" y="62" width="3.5" height="5.5" rx="0.5" fill="#7d75a6"/>

    <!-- the meadow in front, with two flowers -->
    <path d="M-2 106Q50 96 122 104V122H-2Z" fill="#73cf86"/>
    <circle cx="34" cy="112" r="2.2" fill="#ff8fb8"/><circle cx="84" cy="113" r="2.2" fill="#fff6cc"/>
  </g>
</svg>
