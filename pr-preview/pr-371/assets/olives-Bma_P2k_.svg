<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Olive Grove</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ddf7ee"/><stop offset="1" stop-color="#a9e8d2"/></linearGradient>
    <radialGradient id="glow" cx="0.45" cy="0.38" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <!-- the canopy: one cloud of round leaf clusters -->
    <path id="leavesP" d="M18 44a12 12 0 1 0 24 0a12 12 0 1 0 -24 0ZM30 30a14 14 0 1 0 28 0a14 14 0 1 0 -28 0ZM46 25a14 14 0 1 0 28 0a14 14 0 1 0 -28 0ZM62 32a13 13 0 1 0 26 0a13 13 0 1 0 -26 0ZM72 45a11 11 0 1 0 22 0a11 11 0 1 0 -22 0ZM54 46a13 13 0 1 0 26 0a13 13 0 1 0 -26 0ZM34 48a12 12 0 1 0 24 0a12 12 0 1 0 -24 0Z"/>
    <clipPath id="leaves"><use href="#leavesP"/></clipPath>
    <clipPath id="basket"><path d="M64 86H102L97.5 104C91 107 75 107 68.5 104Z"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="54" cy="46" r="52" fill="url(#glow)"/>

  <!-- a soft green mound -->
  <ellipse cx="58" cy="106" rx="54" ry="12" fill="#8fd99a"/>
  <ellipse cx="54" cy="103" rx="42" ry="7" fill="#aee8b7"/>
  <ellipse cx="50" cy="101" rx="14" ry="3" fill="#4b3a8c" opacity="0.14"/>

  <!-- the twisty grey-brown trunk and its two branches -->
  <path d="M42 102C45 90 38 82 42 72C45 64 52 61 50 50L57 50C59 61 53 67 51 75C49 83 55 91 54 102Z" fill="#b0a08c"/>
  <path d="M49 102C51 92 46 84 48 76C50 68 56 64 55.5 52L57 50C59 61 53 67 51 75C49 83 55 91 54 102Z" fill="#8f7f6e"/>
  <path d="M44 88C42 82 42 77 44 73" fill="none" stroke="#cfc3b2" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M51 54C46 50 41 47 36 46M55 54C59 49 64 46 70 45" fill="none" stroke="#8f7f6e" stroke-width="5" stroke-linecap="round"/>

  <!-- the silvery-green canopy, lit on the upper left -->
  <g clip-path="url(#leaves)">
    <rect x="16" y="10" width="80" height="64" fill="#7aa37f"/>
    <use href="#leavesP" fill="#9cc29b" transform="translate(-2 -3)"/>
    <g fill="#c9e2c4">
      <ellipse cx="34" cy="24" rx="3.6" ry="1.3" transform="rotate(-25 34 24)"/>
      <ellipse cx="52" cy="17" rx="3.6" ry="1.3" transform="rotate(20 52 17)"/>
      <ellipse cx="27" cy="38" rx="3.6" ry="1.3" transform="rotate(30 27 38)"/>
      <ellipse cx="66" cy="22" rx="3.6" ry="1.3" transform="rotate(-15 66 22)"/>
      <ellipse cx="44" cy="33" rx="3.6" ry="1.3" transform="rotate(-35 44 33)"/>
      <ellipse cx="78" cy="34" rx="3.6" ry="1.3" transform="rotate(25 78 34)"/>
    </g>
    <g fill="#6a9471">
      <ellipse cx="60" cy="42" rx="3.6" ry="1.3" transform="rotate(30 60 42)"/>
      <ellipse cx="80" cy="48" rx="3.6" ry="1.3" transform="rotate(-25 80 48)"/>
      <ellipse cx="40" cy="52" rx="3.6" ry="1.3" transform="rotate(20 40 52)"/>
      <ellipse cx="68" cy="54" rx="3.6" ry="1.3" transform="rotate(-30 68 54)"/>
    </g>
  </g>
  <g>
    <ellipse cx="38" cy="30" rx="2.4" ry="3" fill="#5d4a6e"/><ellipse cx="58" cy="28" rx="2.4" ry="3" fill="#9bbf5a"/>
    <ellipse cx="72" cy="40" rx="2.4" ry="3" fill="#5d4a6e"/><ellipse cx="48" cy="44" rx="2.4" ry="3" fill="#9bbf5a"/>
    <ellipse cx="28" cy="46" rx="2.4" ry="3" fill="#9bbf5a"/><ellipse cx="64" cy="50" rx="2.4" ry="3" fill="#5d4a6e"/>
    <g fill="#fff" opacity="0.8"><circle cx="37.2" cy="29" r="0.7"/><circle cx="57.2" cy="27" r="0.7"/><circle cx="71.2" cy="39" r="0.7"/><circle cx="47.2" cy="43" r="0.7"/><circle cx="27.2" cy="45" r="0.7"/><circle cx="63.2" cy="49" r="0.7"/></g>
  </g>

  <!-- the basket heaped with olives -->
  <g>
    <circle cx="70" cy="82" r="4.6" fill="#9bbf5a"/><circle cx="78.5" cy="80" r="5" fill="#5d4a6e"/>
    <circle cx="87.5" cy="80.5" r="4.8" fill="#9bbf5a"/><circle cx="95.5" cy="82.5" r="4.4" fill="#5d4a6e"/>
    <circle cx="74" cy="75.5" r="4.2" fill="#5d4a6e"/><circle cx="83" cy="74" r="4.4" fill="#9bbf5a"/><circle cx="91" cy="76" r="4.1" fill="#7d6a8e"/>
    <g fill="#fff" opacity="0.8"><circle cx="68.6" cy="80.6" r="1.1"/><circle cx="77" cy="78.4" r="1.1"/><circle cx="86" cy="79" r="1.1"/><circle cx="72.6" cy="74" r="1"/><circle cx="81.6" cy="72.6" r="1"/></g>
  </g>
  <g clip-path="url(#basket)">
    <rect x="62" y="84" width="42" height="24" fill="#b8864f"/>
    <path d="M64 86H92L89 106H68.5Z" fill="#d8a86a"/>
    <path d="M65 92H101M66 98H100" stroke="#b8864f" stroke-width="2"/>
    <path d="M71 87v18M78 87v18M85 87v18M92 87v18" stroke="#c99a5c" stroke-width="1.6"/>
  </g>
  <rect x="62" y="83" width="42" height="5.5" rx="2.75" fill="#e9c48f"/>
  <path d="M64 84.5H90" stroke="#fdeecc" stroke-width="1.6" stroke-linecap="round"/>

  <!-- olives on the grass -->
  <ellipse cx="58" cy="104" rx="2.6" ry="3" fill="#5d4a6e"/>
  <ellipse cx="106" cy="103" rx="2.6" ry="3" fill="#9bbf5a"/>
  <path d="M100 18v5M97.5 20.5h5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
</svg>
