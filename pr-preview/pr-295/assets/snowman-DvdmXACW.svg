<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Carnival Snowballs</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0f2ff"/><stop offset="1" stop-color="#b3dbff"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="head"><circle cx="60" cy="52" r="18.5"/></clipPath>
    <clipPath id="body"><circle cx="60" cy="86" r="21"/></clipPath>
    <clipPath id="lit"><circle cx="56" cy="82" r="21"/></clipPath>
    <clipPath id="pom"><circle cx="77" cy="18" r="6"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>

  <!-- snowy hills far away, then the snow he stands in -->
  <path d="M0 84C14 76 28 74 42 80C58 70 86 68 120 80V104H0Z" fill="#d3e8fb"/>
  <path d="M74 72C92 72 108 75 120 80V104H84C88 92 84 80 74 72Z" fill="#bcd8f5"/>
  <path d="M0 98C22 92 44 92 62 96C82 92 102 92 120 96V120H0Z" fill="#fff"/>
  <path d="M0 110C30 105 90 105 120 110V120H0Z" fill="#e4ddf6"/>
  <ellipse cx="60" cy="105.5" rx="27" ry="4.5" fill="#4b3a8c" opacity="0.14"/>

  <!-- twig arms, cheering -->
  <path d="M45 79L26 64M29.5 66.8L22.5 65M29.5 66.8L27 59.5M75 79L94 64M90.5 66.8L97.5 65M90.5 66.8L93 59.5" fill="none" stroke="#8a5b3d" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the body ball, wearing the carnival's woven sash -->
  <g clip-path="url(#body)">
    <rect x="38" y="64" width="44" height="44" fill="#e4ddf6"/>
    <path d="M36 82Q60 91 84 82V93Q60 102 36 93Z" fill="#d9485e"/>
    <path d="M36 84Q60 93 84 84M36 91Q60 100 84 91" fill="none" stroke="#4675c8" stroke-width="2.5"/>
    <path d="M38 86.5L42 91.5L46 88.5L50 93L54 90L58 94L62 90L66 93.5L70 89.5L74 92.5L78 87.5L82 90" fill="none" stroke="#eba123" stroke-width="2" stroke-linejoin="round"/>
    <g clip-path="url(#lit)">
      <rect x="34" y="60" width="44" height="44" fill="#fff"/>
      <path d="M36 82Q60 91 84 82V93Q60 102 36 93Z" fill="#ff6b6b"/>
      <path d="M36 84Q60 93 84 84" fill="none" stroke="#5b8fe0" stroke-width="2.5"/>
      <path d="M36 91Q60 100 84 91" fill="none" stroke="#5cc6a6" stroke-width="2.5"/>
      <path d="M38 86.5L42 91.5L46 88.5L50 93L54 90L58 94L62 90L66 93.5L70 89.5L74 92.5L78 87.5L82 90" fill="none" stroke="#ffc83d" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- coal buttons -->
  <circle cx="60" cy="79" r="2.4" fill="#2b2330"/>
  <circle cx="60" cy="101" r="2.4" fill="#2b2330"/>
  <!-- the sash's knot and tasselled ends -->
  <path d="M42 93C40.5 97 39.5 100.5 39 104.5" fill="none" stroke="#ff6b6b" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M45 94C45.5 97.5 46 100.5 47 103.5" fill="none" stroke="#5b8fe0" stroke-width="4" stroke-linecap="round"/>
  <path d="M37.5 106.5v2.5M40.5 106.5v2.5M46 105.5l.5 2.5M48.5 105l.5 2.5" fill="none" stroke="#ffc83d" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="43" cy="91.5" rx="4.5" ry="3.8" fill="#ff6b6b"/>
  <ellipse cx="42" cy="90.5" rx="2" ry="1.4" fill="#ffa3a3"/>

  <!-- the head: shaded crescent bottom-right -->
  <g clip-path="url(#head)">
    <rect x="40" y="32" width="40" height="40" fill="#e4ddf6"/>
    <circle cx="57" cy="49" r="18.5" fill="#fff"/>
  </g>

  <!-- face: coal eyes, blush, a carrot nose, a happy mouth -->
  <ellipse cx="52.5" cy="52" rx="3.3" ry="4.1" fill="#2b2330"/>
  <ellipse cx="67.5" cy="52" rx="3.3" ry="4.1" fill="#2b2330"/>
  <circle cx="53.7" cy="50.4" r="1.3" fill="#fff"/>
  <circle cx="68.7" cy="50.4" r="1.3" fill="#fff"/>
  <ellipse cx="46.5" cy="59" rx="4" ry="2.4" fill="#ff8fb8" opacity="0.55"/>
  <ellipse cx="73.5" cy="59" rx="4" ry="2.4" fill="#ff8fb8" opacity="0.55"/>
  <path d="M59.5 54C64 54.5 69 56.5 72.5 58.7C73.2 59.2 72.8 60 72 60C68 60.3 63.5 59.9 60 58.9C58 58.3 58 53.9 59.5 54Z" fill="#ff9c57"/>
  <path d="M58.9 57C62 58 67 59 72.6 59.3C72.6 59.8 72.3 60 72 60C68 60.3 63.5 59.9 60 58.9C59.3 58.7 59 57.9 58.9 57Z" fill="#e57a35"/>
  <path d="M55.5 62.5C57 66.5 63 66.5 64.5 62.5Z" fill="#2b2330"/>
  <path d="M57.8 64.8Q60 63.6 62.2 64.8Q60 66.2 57.8 64.8Z" fill="#ff8fb8"/>

  <!-- the scarf -->
  <path d="M42 65.5Q60 73 78 65.5Q81 68.5 78.5 72Q60 80 41.5 72Q39 68.5 42 65.5Z" fill="#ff8fb8"/>
  <path d="M60 76.2Q70 74.5 78.5 72Q81 68.5 78 65.5Q70 69 60 70Z" fill="#e7699c"/>
  <path d="M44.5 67.5Q51 70.5 57 71" fill="none" stroke="#ffc4da" stroke-width="2" stroke-linecap="round"/>
  <path d="M69 71C72.5 76 74 81 73 87L80.5 86C81 80 79 74.5 75.5 69.5Z" fill="#ff8fb8"/>
  <path d="M75.5 69.5C79 74.5 81 80 80.5 86L77 86.5C77.5 80.5 76 75 72.5 70.5Z" fill="#e7699c"/>
  <path d="M72 78.5L79.5 77.5M73 82.5L80.5 81.5" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M74 88v2.5M77 87.7v2.5M80 87.3v2.5" stroke="#ff8fb8" stroke-width="2" stroke-linecap="round"/>

  <!-- the red tuque with its pompom -->
  <path d="M40.5 44.5C39.5 34 47 26.5 57 25.5C65 24.5 71.5 22 75.5 18C80 25 81.5 35 79.5 44.5Q60 50 40.5 44.5Z" fill="#ff6b6b"/>
  <path d="M75.5 18C80 25 81.5 35 79.5 44.5Q72 46.5 66 47C69 38 71.5 28 75.5 18Z" fill="#d9485e"/>
  <path d="M46 33C48.5 29 52.5 27 57 26.5" fill="none" stroke="#ffa3a3" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M40.5 44.5Q60 50 79.5 44.5L79 39Q60 44.5 41 39Z" fill="#d9485e"/>
  <path d="M45 41.5v4.5M50 42.8v4.5M55 43.6v4.5M60 43.9v4.5M65 43.6v4.5M70 42.8v4.5M75 41.5v4.5" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round"/>
  <g clip-path="url(#pom)">
    <rect x="70" y="11" width="14" height="14" fill="#e4ddf6"/>
    <circle cx="75.8" cy="16.8" r="6" fill="#fff"/>
  </g>

  <!-- falling snow -->
  <g fill="#fff">
    <circle cx="22" cy="32" r="2"/><circle cx="98" cy="38" r="1.8"/><circle cx="30" cy="50" r="1.5"/>
    <circle cx="90" cy="54" r="1.4"/><circle cx="17" cy="72" r="1.6"/><circle cx="104" cy="66" r="1.5"/>
  </g>
  <path d="M30 20l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5z" fill="#fff"/>
</svg>
