<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Surprise</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ece6ff"/><stop offset="1" stop-color="#cdbfff"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="burst" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fffbe8"/><stop offset="0.5" stop-color="#fff1b8" stop-opacity="0.7"/><stop offset="1" stop-color="#ffe189" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>
  <ellipse cx="60" cy="102" rx="36" ry="5" fill="#4b3a8c" opacity="0.14"/>

  <!-- light bursting out of the box -->
  <circle cx="58" cy="60" r="34" fill="url(#burst)"/>
  <g fill="#fff6cc" opacity="0.8">
    <path d="M52 64L30 40L40 34Z"/><path d="M58 64L54 26H64Z"/><path d="M64 64L84 34L92 42Z"/>
  </g>

  <!-- the box: pink, the right side in shade, its open top glowing -->
  <path d="M40 63H88L76 70H28Z" fill="#d8367f"/>
  <path d="M42 64.5H84L76 69.5H34Z" fill="#ffe189"/>
  <path d="M76 70L88 63V91.5Q88 93.5 86.5 94.5L78 100Q76 101 76 99Z" fill="#e7699c"/>
  <rect x="28" y="70" width="48" height="31" rx="2.5" fill="#ff8fb8"/>
  <path d="M31 75V92" stroke="#ffc4da" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="47" y="70" width="10" height="31" fill="#ffc83d"/>
  <rect x="47" y="70" width="3" height="31" fill="#ffe189"/>
  <path d="M80.5 67.5L83.5 66V97L80.5 98.5Z" fill="#eba123"/>

  <!-- the lid, popping up with the bow -->
  <g transform="rotate(-14 58 40)">
    <path d="M23 40H79L91 33H35Z" fill="#ffc4da"/>
    <path d="M79 40L91 33V41Q91 42.5 89.5 43.5L80.5 49Q79 50 79 48Z" fill="#e7699c"/>
    <rect x="23" y="40" width="56" height="10" rx="2.5" fill="#ff8fb8"/>
    <rect x="46" y="40" width="10" height="10" fill="#ffc83d"/>
    <path d="M46 40H56L68 33H58Z" fill="#ffe189"/>
    <path d="M29 36.5H85" stroke="#ffe189" stroke-width="3.5"/>
    <!-- bow: two big loops and a knot -->
    <path d="M57 36C50 25 38 22 36.5 29C35 35.5 46 38 57 36Z" fill="#ffc83d"/>
    <path d="M59 36C66 25 78 22 79.5 29C81 35.5 70 38 59 36Z" fill="#eba123"/>
    <path d="M55 33C50 28.5 43.5 27 41 28.5" fill="none" stroke="#ffe189" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M57 37C53 41 50 45 48.5 50M59 37C63 41 66 45 67.5 50" stroke="#eba123" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="53.5" y="31.5" width="9" height="8" rx="3" fill="#ffc83d"/>
  </g>

  <!-- stars and sparkles flying out -->
  <g transform="translate(24 54) rotate(-15)" stroke-linejoin="round" stroke-width="1.5">
    <path d="M0-6L1.5-2L5.5-2L2.5 1L3.5 5L0 2.5L-3.5 5L-2.5 1L-5.5-2L-1.5-2Z" fill="#ffc83d" stroke="#ffc83d"/>
    <path d="M0-6L1.5-2L5.5-2L2.5 1L3.5 5L0 2.5Z" fill="#eba123" stroke="#eba123"/>
  </g>
  <g transform="translate(97 54) rotate(12) scale(0.9)" stroke-linejoin="round" stroke-width="1.5">
    <path d="M0-6L1.5-2L5.5-2L2.5 1L3.5 5L0 2.5L-3.5 5L-2.5 1L-5.5-2L-1.5-2Z" fill="#ffc83d" stroke="#ffc83d"/>
    <path d="M0-6L1.5-2L5.5-2L2.5 1L3.5 5L0 2.5Z" fill="#eba123" stroke="#eba123"/>
  </g>
  <g transform="translate(86 20) rotate(-8) scale(0.75)" stroke-linejoin="round" stroke-width="1.5">
    <path d="M0-6L1.5-2L5.5-2L2.5 1L3.5 5L0 2.5L-3.5 5L-2.5 1L-5.5-2L-1.5-2Z" fill="#ff8fb8" stroke="#ff8fb8"/>
    <path d="M0-6L1.5-2L5.5-2L2.5 1L3.5 5L0 2.5Z" fill="#e7699c" stroke="#e7699c"/>
  </g>
  <path d="M30 22l2 4.5 4.5 2-4.5 2-2 4.5-2-4.5-4.5-2 4.5-2z" fill="#fff"/>
  <path d="M100 30l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5z" fill="#fff"/>
  <path d="M17 70l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5z" fill="#fff"/>
  <rect x="38" y="52" width="5" height="2.5" rx="1.25" fill="#8fe3c8" transform="rotate(-35 40.5 53.25)"/>
  <rect x="73" y="56" width="5" height="2.5" rx="1.25" fill="#8ccfff" transform="rotate(30 75.5 57.25)"/>
  <circle cx="68" cy="22" r="2" fill="#ff8fb8"/>
</svg>
