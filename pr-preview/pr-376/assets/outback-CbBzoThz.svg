<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Red Outback</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="86" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#b3ddfb"/><stop offset="0.6" stop-color="#e3f3ff"/><stop offset="1" stop-color="#fff5d1"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="84" x2="0" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffe08f"/><stop offset="1" stop-color="#ffbd73"/></linearGradient>
    <radialGradient id="sun" cx="92" cy="25" r="26" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff8dc" stop-opacity="0.95"/><stop offset="1" stop-color="#fff8dc" stop-opacity="0"/></radialGradient>
    <clipPath id="rock"><path d="M4 86C5 74 9 64 18 59C26 55 36 55 46 55.5C58 56 70 58 82 58.5C94 59 104 62 110 70C113 75 115 81 116 86Z"/></clipPath>
    <clipPath id="body"><ellipse cx="62" cy="68" rx="12.5" ry="17" transform="rotate(-35 62 68)"/></clipPath>
    <clipPath id="thigh"><circle cx="71" cy="76" r="11"/></clipPath>
    <clipPath id="head"><circle cx="47" cy="44" r="13"/></clipPath>
  </defs>

  <!-- sky, sun, a cloud -->
  <rect width="120" height="120" fill="url(#sky)"/>
  <circle cx="92" cy="25" r="26" fill="url(#sun)"/>
  <circle cx="92" cy="25" r="8.5" fill="#fff6d2"/>
  <g fill="#fff" opacity="0.9">
    <circle cx="16" cy="33" r="4.5"/><circle cx="22.5" cy="29" r="6.5"/><circle cx="29" cy="33" r="4"/>
    <rect x="11" y="32" width="22" height="5.5" rx="2.75"/>
  </g>

  <!-- the big red rock: lit on the left, shaded on the right, gullies down its face -->
  <g clip-path="url(#rock)">
    <rect x="0" y="52" width="120" height="36" fill="#c65a45"/>
    <path d="M4 86C5 74 9 64 18 59C26 55 36 55 46 55.5C58 56 70 58 84 58.5C88 68 89 78 87 86Z" fill="#e9785a"/>
    <path d="M12 68C16 62 22 59.5 30 58.5" fill="none" stroke="#f6a283" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M17 68V84M27 64V84M38 62V80M76 63V84" fill="none" stroke="#d9654e" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M96 65V84M106 71V84" fill="none" stroke="#b04e3d" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- the red-gold ground, spinifex tufts -->
  <path d="M0 84H120V120H0Z" fill="url(#ground)"/>
  <path d="M0 84.5H120" stroke="#fff6cc" stroke-width="2" opacity="0.8"/>
  <path d="M8 106C18 103 30 103 40 105M84 112C94 109.5 104 109.5 114 112" fill="none" stroke="#f6a26a" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <path d="M8 99C8 93.5 11.5 90.5 15.5 90.5C19.5 90.5 23 93.5 23 99Z" fill="#9ccf7e"/>
  <path d="M15.5 90.5C19.5 90.5 23 93.5 23 99H17C18 96 17.5 93 15.5 90.5Z" fill="#74ad66"/>
  <path d="M10.5 95C11.5 93 13 92 14.5 91.5" fill="none" stroke="#c5e6a5" stroke-width="2" stroke-linecap="round"/>
  <path d="M100 97C100 93 102.5 90.5 105.5 90.5C108.5 90.5 111 93 111 97Z" fill="#9ccf7e"/>
  <path d="M105.5 90.5C108.5 90.5 111 93 111 97H107C107.5 94.5 107 92.5 105.5 90.5Z" fill="#74ad66"/>

  <!-- in mid-hop: her shadow below, dust puffs where she took off -->
  <ellipse cx="66" cy="104" rx="25" ry="4.5" fill="#4b3a8c" opacity="0.14"/>
  <g fill="#fff3d6"><circle cx="93" cy="102" r="4"/><circle cx="99.5" cy="100" r="3"/><circle cx="104" cy="103" r="2.2"/></g>

  <!-- the far foot, then the tail -->
  <ellipse cx="78" cy="87.5" rx="13.5" ry="4.3" transform="rotate(15 78 87.5)" fill="#c98563"/>
  <path d="M70 64C82 65 94 69 103 77C105.5 79 104 82.5 101 81.5C92 78.5 82 78 70 77Z" fill="#e9a66f"/>
  <path d="M71 77C82 78 92 78.5 101 81.5C103.5 82.3 105 80.5 104.5 78.5C96 76 84 74.5 71 74Z" fill="#c98563"/>
  <!-- body, a cream tummy -->
  <g clip-path="url(#body)">
    <rect x="44" y="46" width="38" height="44" fill="#c98563"/>
    <ellipse cx="59" cy="65.5" rx="12.5" ry="17" transform="rotate(-35 59 65.5)" fill="#e9a66f"/>
    <ellipse cx="55.5" cy="66" rx="6.5" ry="12" transform="rotate(-35 55.5 66)" fill="#fff7f0"/>
  </g>
  <!-- the big haunch and the near foot -->
  <ellipse cx="80" cy="89.5" rx="14" ry="4.5" transform="rotate(15 80 89.5)" fill="#e9a66f"/>
  <path d="M72 92.5C78 94 85 95.5 92 95.8" fill="none" stroke="#c98563" stroke-width="2.5" stroke-linecap="round"/>
  <g clip-path="url(#thigh)">
    <rect x="58" y="63" width="26" height="26" fill="#c98563"/>
    <circle cx="69" cy="74" r="11" fill="#e9a66f"/>
  </g>
  <path d="M63 71C64.5 68 67.5 66 71 66" fill="none" stroke="#f8cc9e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- little arms held to the chest -->
  <ellipse cx="53" cy="62" rx="2.8" ry="5.2" transform="rotate(42 53 62)" fill="#c98563"/>
  <ellipse cx="50" cy="59.5" rx="2.8" ry="5.2" transform="rotate(42 50 59.5)" fill="#e9a66f"/>

  <!-- pointed ears, pink inside -->
  <path d="M37 37C31 31 29 22 31 14C38 17 43 25 43.5 33Z" fill="#e9a66f"/>
  <path d="M37.5 33.5C34 29 33 23.5 33.5 18.5C37.5 21 40 26 40.5 31Z" fill="#ffc4da"/>
  <path d="M51 33C53 25 58 18 65 16C66 24 63.5 32 58 37Z" fill="#c98563"/>
  <path d="M53.5 32C55.5 26.5 58.5 22 62.5 20C62.5 25 61 30 57.5 33.5Z" fill="#ff8fb8"/>
  <!-- head: tan with a shaded crescent bottom-right -->
  <g clip-path="url(#head)">
    <rect x="33" y="30" width="28" height="28" fill="#c98563"/>
    <circle cx="44.5" cy="41.5" r="13" fill="#e9a66f"/>
  </g>
  <path d="M37 38C38 35 40.5 32.5 44 31.5" fill="none" stroke="#f8cc9e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- muzzle, nose, smile -->
  <ellipse cx="47" cy="50.5" rx="7" ry="5.2" fill="#fff7f0"/>
  <path d="M44 46.8Q47 45 50 46.8Q49 49.6 47 49.9Q45 49.6 44 46.8Z" fill="#2b2330"/>
  <ellipse cx="45.9" cy="46.6" rx="1" ry="0.6" fill="#fff"/>
  <path d="M47 50V51.6M43.8 51.4Q45.4 53.6 47 51.6Q48.6 53.6 50.2 51.4" fill="none" stroke="#2b2330" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- eyes and blush -->
  <ellipse cx="41.5" cy="41.5" rx="2.9" ry="3.6" fill="#2b2330"/>
  <ellipse cx="52.5" cy="41.5" rx="2.9" ry="3.6" fill="#2b2330"/>
  <circle cx="42.6" cy="40.2" r="1.15" fill="#fff"/>
  <circle cx="53.6" cy="40.2" r="1.15" fill="#fff"/>
  <ellipse cx="37" cy="48" rx="3.4" ry="2" fill="#ff8fb8" opacity="0.55"/>
  <ellipse cx="57" cy="48" rx="3.4" ry="2" fill="#ff8fb8" opacity="0.55"/>
  <!-- a pink bow by her ear -->
  <g transform="rotate(-18 57 33)">
    <path d="M57 33C54 29 50 29.5 50.5 33C51 36.5 54 36.5 57 33Z" fill="#ff4f9a"/>
    <path d="M57 33C60 29 64 29.5 63.5 33C63 36.5 60 36.5 57 33Z" fill="#ff4f9a"/>
    <path d="M57 33C60 33.5 62 35 63.5 33C63 36.5 60 36.5 57 33Z" fill="#d8367f"/>
    <circle cx="57" cy="33" r="2" fill="#d8367f"/>
  </g>
</svg>
