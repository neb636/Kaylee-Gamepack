<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Pyramid Builders</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0f2ff"/><stop offset="1" stop-color="#b3dbff"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fcd68a"/><stop offset="1" stop-color="#f3bf6c"/></linearGradient>
    <!-- the great pyramid's two faces -->
    <clipPath id="lit"><path d="M60 20L16 88H73Z"/></clipPath>
    <clipPath id="shade"><path d="M60 20L73 88H102Z"/></clipPath>
    <!-- a log seen end on, its centre at 0,0 -->
    <g id="log">
      <circle r="5" fill="#a46e4b"/>
      <circle cx="-0.5" cy="-0.5" r="3.5" fill="#e5b78f"/>
      <circle cx="-0.5" cy="-0.5" r="1.3" fill="#c99266"/>
    </g>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="54" r="50" fill="url(#glow)"/>

  <!-- the sun -->
  <circle cx="21" cy="23" r="10.5" fill="#fff6cc" opacity="0.55"/>
  <circle cx="21" cy="23" r="6.5" fill="#fff0b0"/>

  <!-- a small far pyramid in the haze -->
  <path d="M21 56L2 86H28Z" fill="#f4e2cb"/>
  <path d="M21 56L28 86H40Z" fill="#e2c9c0"/>

  <!-- the desert -->
  <path d="M0 83C20 80 42 81 62 84C82 87 100 82 120 83V120H0Z" fill="url(#sand)"/>
  <path d="M8 104C18 101 30 101 40 103M78 112C88 109 98 109 108 111" fill="none" stroke="#fee8bb" stroke-width="3" stroke-linecap="round"/>

  <!-- the great pyramid in rows of blocks: lit on the left, shaded on the right, a gold tip -->
  <ellipse cx="60" cy="88.5" rx="46" ry="3" fill="#4b3a8c" opacity="0.14"/>
  <g clip-path="url(#lit)">
    <rect x="14" y="18" width="62" height="72" fill="#f8deab"/>
    <path d="M14 37H76M14 54H76M14 71H76M52 37V54M40 54V71M56 54V71M30 71V88M46 71V88M62 71V88" stroke="#fdeccb" stroke-width="2.5"/>
  </g>
  <g clip-path="url(#shade)">
    <rect x="58" y="18" width="46" height="72" fill="#d9a890"/>
    <path d="M58 37H104M58 54H104M58 71H104M79 54V71M88 71V88" stroke="#c99683" stroke-width="2.5"/>
  </g>
  <path d="M57.5 31L49.5 43.5" stroke="#fff3dc" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 20L54.5 28.5H61.5Z" fill="#ffc83d"/>
  <path d="M60 20L61.5 28.5H65.5Z" fill="#eba123"/>
  <path d="M76 15.5l1.6 3.9 3.9 1.6-3.9 1.6-1.6 3.9-1.6-3.9-3.9-1.6 3.9-1.6z" fill="#fff"/>

  <!-- a new block rolling in on logs, a puff of dust behind it -->
  <ellipse cx="87" cy="100.5" rx="20" ry="3" fill="#4b3a8c" opacity="0.16"/>
  <use href="#log" x="75.5" y="95"/>
  <use href="#log" x="86" y="95"/>
  <use href="#log" x="96.5" y="95"/>
  <path d="M72 67L77.5 61.5H100.5L95 67Z" fill="#fde2b5"/>
  <path d="M95 67L100.5 61.5V84.5L95 90Z" fill="#e0a868"/>
  <rect x="72" y="67" width="23" height="23" fill="#f7cb8f"/>
  <path d="M75 70.5V80" stroke="#fde8c4" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="88" cy="80.5" r="1.4" fill="#e0a868"/>
  <circle cx="82" cy="85" r="1.1" fill="#e0a868"/>
  <g fill="#fff"><circle cx="106.5" cy="96" r="3.5"/><circle cx="110.5" cy="91.5" r="2.5"/></g>
</svg>
