<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>The mushroom farm</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9de"/><stop offset="1" stop-color="#ffc3a8"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <path id="bagP" d="M38 104C32 104 30 98 31 90C32 78 38 70 50 64L52 59H68L70 64C82 70 88 78 89 90C90 98 88 104 82 104Z"/>
    <clipPath id="bag"><use href="#bagP"/></clipPath>
    <path id="capP" d="M-18 3C-19.5-6-11-12 0-12C11-12 19.5-6 18 3C15 5 12 3 9 5C6 3 3 4.5 0 4.5C-3 4.5-6 3-9 5C-12 3-15 5-18 3Z"/>
    <clipPath id="cap"><use href="#capP"/></clipPath>
    <!-- one oyster mushroom's cap, centred at 0,0: pale gills underneath, a ruffled pink top shaded along its rim -->
    <g id="shroom">
      <ellipse cx="0" cy="4.5" rx="15.5" ry="4" fill="#ffdce9"/>
      <path d="M0 7L-11 4M0 7L-4.5 3M0 7L4.5 3M0 7L11 4" stroke="#f7b6cd" stroke-width="2" stroke-linecap="round"/>
      <g clip-path="url(#cap)">
        <rect x="-20" y="-14" width="40" height="20" fill="#e7699c"/>
        <use href="#capP" fill="#ff8fb8" transform="translate(-1.5 -2.5)"/>
      </g>
      <path d="M-12-4C-10-8-6-10.5-2-11" fill="none" stroke="#ffc4da" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <path id="drop" d="M0-6C3-2 4.5 1 4.5 3A4.5 4.5 0 0 1-4.5 3C-4.5 1-3-2 0-6Z"/>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>
  <ellipse cx="60" cy="105" rx="30" ry="5" fill="#4b3a8c" opacity="0.14"/>

  <!-- the grow bag: sawdust in clear plastic, shaded on the right -->
  <g clip-path="url(#bag)">
    <rect x="28" y="56" width="64" height="50" fill="#e3bb7a"/>
    <use href="#bagP" fill="#f5dba8" transform="translate(-5 -2)"/>
    <g fill="#e3bb7a"><circle cx="42" cy="86" r="1.4"/><circle cx="52" cy="95" r="1.4"/><circle cx="60" cy="81" r="1.4"/><circle cx="48" cy="76" r="1.4"/><circle cx="68" cy="92" r="1.4"/><circle cx="38" cy="96" r="1.4"/><circle cx="58" cy="100" r="1.4"/></g>
    <g fill="#d2a865"><circle cx="80" cy="96" r="1.4"/><circle cx="84" cy="88" r="1.4"/></g>
    <path d="M37 85C38 77 42 72 47 69" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <path d="M36 93V97" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    <path d="M54 64L51 71M60 64V71M66 64L69 71" stroke="#e3bb7a" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- a baby one popping out of a slit in the side -->
  <path d="M74 80L80 77" stroke="#d2a865" stroke-width="2.4" stroke-linecap="round"/>
  <use href="#shroom" transform="translate(82 76) rotate(52) scale(0.42)"/>

  <!-- the clump fanning out of the bag's mouth: stems, then caps, back to front -->
  <g fill="none" stroke-linecap="round">
    <path d="M60 60V42M56 60C53 56 49 53 44 51.5M64 60C67 56 71 53 76 51.5" stroke="#f3c6d6" stroke-width="9"/>
    <path d="M58.5 58V44M54.5 57.5C52 54.5 49 52.5 46 51.5M62.5 57.5C65 54.5 68 52.5 71 51.5" stroke="#fff3f7" stroke-width="3.5"/>
  </g>
  <use href="#shroom" transform="translate(60 34) scale(1.1)"/>
  <use href="#shroom" transform="translate(39 46) rotate(-28) scale(0.95)"/>
  <use href="#shroom" transform="translate(81 46) rotate(28) scale(0.95)"/>

  <!-- the pink collar round the bag's mouth -->
  <rect x="48" y="55" width="24" height="8" rx="3" fill="#ff4f9a"/>
  <path d="M65 55H69C70.7 55 72 56.3 72 58V60C72 61.7 70.7 63 69 63H65Z" fill="#d8367f"/>
  <path d="M51 57.5H62" stroke="#ff8fc0" stroke-width="2" stroke-linecap="round"/>

  <!-- drops of mist -->
  <g transform="translate(19 26)"><use href="#drop" fill="#8ccfff"/><ellipse cx="-1.4" cy="1" rx="1.2" ry="1.8" fill="#fff"/></g>
  <g transform="translate(101 24) scale(0.8)"><use href="#drop" fill="#8ccfff"/><ellipse cx="-1.4" cy="1" rx="1.2" ry="1.8" fill="#fff"/></g>
  <g transform="translate(16 66) scale(0.7)"><use href="#drop" fill="#8ccfff"/><ellipse cx="-1.4" cy="1" rx="1.2" ry="1.8" fill="#fff"/></g>
  <g transform="translate(104 64) scale(0.65)"><use href="#drop" fill="#8ccfff"/><ellipse cx="-1.4" cy="1" rx="1.2" ry="1.8" fill="#fff"/></g>
  <g fill="#fff"><circle cx="34" cy="16" r="1.8"/><circle cx="86" cy="14" r="1.6"/><circle cx="24" cy="44" r="1.4"/><circle cx="96" cy="42" r="1.4"/></g>
</svg>
