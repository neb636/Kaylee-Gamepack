<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Tika's Mountain Terraces</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0f2ff"/><stop offset="1" stop-color="#b3dbff"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="peak"><path d="M42 98C48 76 56 48 66 31C71 23 79 21 84 28C90 38 94 58 98 74C100 82 103 90 106 98Z"/></clipPath>
    <clipPath id="body"><ellipse cx="95" cy="86" rx="14" ry="9.5"/></clipPath>
    <clipPath id="head"><ellipse cx="84" cy="56" rx="8.5" ry="7.5"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="58" cy="46" r="52" fill="url(#glow)"/>

  <!-- far ridges in the haze -->
  <path d="M-2 76C12 64 22 61 34 67C44 57 54 57 62 65V100H-2Z" fill="#c9cdee"/>
  <path d="M98 72C106 62 113 60 122 64V100H98Z" fill="#c9cdee"/>

  <!-- the tall green peak, shaded on the right -->
  <g clip-path="url(#peak)">
    <rect x="38" y="18" width="72" height="82" fill="#48a96c"/>
    <path d="M42 98C48 76 56 48 66 31C71 23 77 21.5 80.5 24C83 48 83 74 81 98Z" fill="#73cf86"/>
    <path d="M57 62C59 52 63 42 68 34" fill="none" stroke="#aee8b7" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="70" cy="58" rx="4" ry="2.5" fill="#48a96c"/>
    <ellipse cx="62" cy="76" rx="4.5" ry="2.5" fill="#5cbd78"/>
    <ellipse cx="88" cy="66" rx="4" ry="2.5" fill="#3e9e78"/>
  </g>

  <!-- a cloud resting against the peak -->
  <g fill="#fff" opacity="0.92">
    <circle cx="94" cy="44" r="6"/><circle cx="101" cy="40" r="7.5"/><circle cx="108.5" cy="44.5" r="5.5"/>
    <rect x="88" y="43" width="26" height="7" rx="3.5"/>
  </g>

  <!-- the stone terraces, curving round the hill -->
  <path d="M10 70Q36 61 62 69L62 72Q36 64 10 73Z" fill="#8fd99a"/>
  <path d="M10 73Q36 64 62 72L62 77Q36 69 10 78Z" fill="#d6d0ea"/>
  <path d="M3 80Q38 70 71 79L71 82Q38 73 3 83Z" fill="#8fd99a"/>
  <path d="M3 83Q38 73 71 82L71 88Q38 79 3 89Z" fill="#d6d0ea"/>
  <path d="M-2 91Q40 80 79 90L79 93Q40 83 -2 94Z" fill="#8fd99a"/>
  <path d="M-2 94Q40 83 79 93L79 99Q40 89 -2 100Z" fill="#d6d0ea"/>
  <g stroke="#bcb6d6" stroke-width="1.4" stroke-linecap="round">
    <path d="M18 72v4M27 69.5v4M36 68.5v4M45 68.5v4M54 69.5v4"/>
    <path d="M12 82v5M22 79v5M32 77.5v5M42 77v5M52 77.5v5M62 79v5"/>
    <path d="M8 93v5M19 90v5M30 88v5M41 87.5v5M52 87.5v5M63 89v5M73 91v5"/>
  </g>
  <path d="M62 72L62 77M71 82V88M79 93V99" stroke="#9790ba" stroke-width="2"/>

  <!-- little stone houses on the top terrace, one with a straw roof -->
  <rect x="15" y="59" width="10" height="7.5" fill="#dedaf0"/>
  <rect x="21" y="59" width="4" height="7.5" fill="#bcb6d6"/>
  <path d="M14 59.5L20 53L26 59.5Z" fill="#bcb6d6"/>
  <rect x="18" y="62" width="3" height="4.5" fill="#7d75a6"/>
  <rect x="30" y="57" width="12" height="9" fill="#dedaf0"/>
  <rect x="37.5" y="57" width="4.5" height="9" fill="#bcb6d6"/>
  <path d="M29 57.5L36 50L43 57.5Z" fill="#bcb6d6"/>
  <rect x="33" y="60.5" width="3" height="5.5" fill="#7d75a6"/>
  <rect x="46" y="60" width="9" height="6.5" fill="#dedaf0"/>
  <path d="M44.5 60.5L50.5 54L56.5 60.5Z" fill="#e3bb7a"/>
  <path d="M50.5 54L56.5 60.5H52Z" fill="#c99266"/>

  <!-- the meadow in front -->
  <path d="M-2 102Q46 91 122 99V122H-2Z" fill="#73cf86"/>
  <path d="M-2 108Q50 99 122 105V122H-2Z" fill="#5cbd78"/>

  <!-- the llama -->
  <ellipse cx="96" cy="106" rx="16" ry="3.2" fill="#4b3a8c" opacity="0.15"/>
  <rect x="88.5" y="90" width="4.5" height="15" rx="2.25" fill="#e8d2c2"/>
  <rect x="102.5" y="90" width="4.5" height="15" rx="2.25" fill="#e8d2c2"/>
  <circle cx="109.5" cy="82.5" r="3.6" fill="#fff7f0"/>
  <g clip-path="url(#body)">
    <rect x="80" y="76" width="30" height="20" fill="#efdccd"/>
    <ellipse cx="94" cy="84.5" rx="14" ry="9" fill="#fff7f0"/>
  </g>
  <path d="M86 78.5H104V88C98 90 92 90 86 88Z" fill="#ff8fb8"/>
  <path d="M86 81.5H104M86 85H104" stroke="#3fc1cf" stroke-width="1.8"/>
  <path d="M86 88C92 90 98 90 104 88" fill="none" stroke="#ffc83d" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="84" y="91" width="5" height="15" rx="2.5" fill="#fff7f0"/>
  <rect x="98" y="91" width="5" height="15" rx="2.5" fill="#fff7f0"/>
  <rect x="84" y="103" width="5" height="3" rx="1.5" fill="#8a5b3d"/>
  <rect x="98" y="103" width="5" height="3" rx="1.5" fill="#8a5b3d"/>
  <path d="M80 84V62C80 57.5 88 57.5 88 62V84Z" fill="#fff7f0"/>
  <path d="M86 61V84H88V62C88 60.5 87.3 60 86 59.5Z" fill="#efdccd"/>
  <path d="M79.5 50C77 45 77.5 40 79.5 37C82 40 83 45 82.5 50Z" fill="#fff7f0"/>
  <path d="M80 47C79 44 79.2 41.5 80 40C81 42 81.5 44.5 81.2 47Z" fill="#ffc4da"/>
  <path d="M87 50C88 45 90 41 92.5 39C93.5 43 92 47 89.5 51Z" fill="#efdccd"/>
  <circle cx="79.6" cy="37.8" r="2.1" fill="#ff4f9a"/>
  <circle cx="92.6" cy="39.2" r="2.1" fill="#ffc83d"/>
  <g clip-path="url(#head)">
    <rect x="74" y="47" width="20" height="18" fill="#efdccd"/>
    <ellipse cx="83" cy="55" rx="8.5" ry="7.5" fill="#fff7f0"/>
  </g>
  <circle cx="82" cy="48.5" r="3" fill="#fff7f0"/>
  <circle cx="85.5" cy="48" r="3" fill="#fff7f0"/>
  <ellipse cx="78" cy="59.5" rx="5.5" ry="4.2" fill="#ffe2d4"/>
  <ellipse cx="74.9" cy="58.2" rx="1.4" ry="1.1" fill="#2b2330"/>
  <path d="M75.5 61.2Q77.5 62.8 79.5 61.4" fill="none" stroke="#2b2330" stroke-width="1.4" stroke-linecap="round"/>
  <ellipse cx="82.8" cy="54.4" rx="2.1" ry="2.6" fill="#2b2330"/>
  <circle cx="83.6" cy="53.5" r="0.85" fill="#fff"/>
  <ellipse cx="87.2" cy="59" rx="2.6" ry="1.5" fill="#ff8fb8" opacity="0.6"/>
</svg>
