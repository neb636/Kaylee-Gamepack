<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>The Great Race</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff5d1"/><stop offset="1" stop-color="#ffe08f"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="water" x1="0" y1="71" x2="0" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8fe3ea"/><stop offset="1" stop-color="#3fc1cf"/></linearGradient>
    <clipPath id="head"><ellipse cx="60" cy="60" rx="23" ry="20.5"/></clipPath>
    <clipPath id="muzzle"><ellipse cx="60" cy="73.5" rx="16.5" ry="10.5"/></clipPath>
    <clipPath id="ratHead"><circle cx="60" cy="25" r="8"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>

  <!-- the far bank and the river -->
  <path d="M-2 71C16 65 34 66 50 69C70 64 96 63 122 68V75H-2Z" fill="#aee8b7"/>
  <path d="M86 64.5C98 64.5 110 65.5 122 68V75H96C94 70 91 67 86 64.5Z" fill="#8fd8a6"/>
  <rect y="71" width="120" height="49" fill="url(#water)"/>
  <rect y="71" width="120" height="2.5" fill="#effcff" opacity="0.8"/>

  <!-- his back and swishing tail, out behind him -->
  <path d="M20 85C14 84 11 78 13 72" fill="none" stroke="#a46e4b" stroke-width="3" stroke-linecap="round"/>
  <path d="M13 72C10 69 10.5 64.5 13.5 62.5C16.5 65 16.5 69.5 13 72Z" fill="#6b432e"/>
  <ellipse cx="31" cy="86" rx="14" ry="8.5" fill="#a46e4b"/>
  <path d="M21 82C24.5 79 29.5 78 35 78.5" fill="none" stroke="#c99266" stroke-width="2.5" stroke-linecap="round"/>

  <!-- the ox: neck, ears, horns -->
  <rect x="44" y="66" width="32" height="22" fill="#a46e4b"/>
  <path d="M40 54C33 48 24 48 20 53C24 59 32 61 40 59Z" fill="#a46e4b"/>
  <path d="M80 54C87 48 96 48 100 53C96 59 88 61 80 59Z" fill="#8a5b3d"/>
  <path d="M37 55C32 52 27 52 25 53.5C28 56.5 32 57.5 37 57Z" fill="#ffc4da"/>
  <path d="M83 55C88 52 93 52 95 53.5C92 56.5 88 57.5 83 57Z" fill="#ff8fb8"/>
  <path d="M43 48C36 45 32 37 33 27C38 32 45 37 51 42Z" fill="#f5dba8"/>
  <path d="M33 27C38 32 45 37 51 42L48.5 45C44 40 38 34 33 27Z" fill="#e3bb7a"/>
  <path d="M77 48C84 45 88 37 87 27C82 32 75 37 69 42Z" fill="#f5dba8"/>
  <path d="M87 27C88 37 84 45 77 48L79 44.5C83 41 86 35 87 27Z" fill="#e3bb7a"/>
  <path d="M35.5 33C36.5 38 39 41.5 42.5 43.5" fill="none" stroke="#fdeecc" stroke-width="2" stroke-linecap="round"/>

  <!-- the head: shaded bottom-right, a light patch top-left -->
  <g clip-path="url(#head)">
    <rect x="36" y="39" width="48" height="42" fill="#a46e4b"/>
    <ellipse cx="57" cy="57" rx="23" ry="20.5" fill="#c99266"/>
    <path d="M45 47C48 43 53 41 58 41" fill="none" stroke="#e5b78f" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- muzzle, nostrils, smile -->
  <g clip-path="url(#muzzle)">
    <rect x="43" y="62" width="34" height="22" fill="#f09d80"/>
    <ellipse cx="58.5" cy="72" rx="16.5" ry="10.5" fill="#ffc2a8"/>
  </g>
  <ellipse cx="54" cy="71" rx="2.4" ry="1.7" fill="#c65a45"/>
  <ellipse cx="66" cy="71" rx="2.4" ry="1.7" fill="#c65a45"/>
  <path d="M55.5 77Q60 80.5 64.5 77" fill="none" stroke="#2b2330" stroke-width="2" stroke-linecap="round"/>

  <!-- eyes and blush -->
  <ellipse cx="50.5" cy="58" rx="3.5" ry="4.3" fill="#2b2330"/>
  <ellipse cx="69.5" cy="58" rx="3.5" ry="4.3" fill="#2b2330"/>
  <circle cx="51.8" cy="56.5" r="1.4" fill="#fff"/>
  <circle cx="70.8" cy="56.5" r="1.4" fill="#fff"/>
  <ellipse cx="42.5" cy="66" rx="4.2" ry="2.5" fill="#ff8fb8" opacity="0.55"/>
  <ellipse cx="77.5" cy="66" rx="4.2" ry="2.5" fill="#ff8fb8" opacity="0.55"/>

  <!-- the water in front, ripples and splashes -->
  <path d="M-2 85C10 82 20 87 32 84C44 81 50 86 60 84C70 82 78 87 90 84C102 81 112 86 122 83V122H-2Z" fill="url(#water)"/>
  <path d="M36 85.5C43 89 52 90 60 90C68 90 77 89 84 85.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity="0.85"/>
  <path d="M15 88.5C21 91.5 32 92 41 89.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity="0.7"/>
  <g fill="#fff" opacity="0.6">
    <rect x="20" y="97" width="22" height="3" rx="1.5"/><rect x="74" y="95" width="26" height="3" rx="1.5"/>
    <rect x="48" y="103" width="30" height="3" rx="1.5"/><rect x="86" y="104" width="12" height="3" rx="1.5"/>
  </g>
  <g fill="#fff"><circle cx="90" cy="79" r="2.2"/><circle cx="95" cy="75.5" r="1.6"/><circle cx="40" cy="77" r="1.6"/></g>

  <!-- the little rat riding on top: one paw on a horn, one up in a cheer -->
  <path d="M54 42C47 43 45 49 50 51" fill="none" stroke="#ff8fb8" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="60" cy="37" rx="7.5" ry="6.5" fill="#9790ba"/>
  <ellipse cx="59" cy="36.5" rx="6.5" ry="6" fill="#bcb6d6"/>
  <ellipse cx="60" cy="38" rx="3.8" ry="3.5" fill="#dedaf0"/>
  <ellipse cx="55.5" cy="43" rx="2.4" ry="1.5" fill="#ffc4da"/>
  <ellipse cx="64.5" cy="43" rx="2.4" ry="1.5" fill="#ff8fb8"/>
  <path d="M54 34.5L49.5 37.5" stroke="#bcb6d6" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="49" cy="38" r="2" fill="#ffc4da"/>
  <path d="M66 34L71 26" stroke="#9790ba" stroke-width="3.6" stroke-linecap="round"/>
  <circle cx="71.3" cy="25.5" r="2.4" fill="#ffc4da"/>
  <circle cx="52.5" cy="18.5" r="5.2" fill="#bcb6d6"/>
  <circle cx="67.5" cy="18.5" r="5.2" fill="#9790ba"/>
  <circle cx="52.7" cy="18.7" r="3.2" fill="#ffc4da"/>
  <circle cx="67.3" cy="18.7" r="3.2" fill="#ff8fb8"/>
  <g clip-path="url(#ratHead)">
    <rect x="51" y="16" width="18" height="18" fill="#9790ba"/>
    <circle cx="58.8" cy="23.8" r="8" fill="#bcb6d6"/>
  </g>
  <ellipse cx="57.2" cy="24.5" rx="1.6" ry="2" fill="#2b2330"/>
  <ellipse cx="62.8" cy="24.5" rx="1.6" ry="2" fill="#2b2330"/>
  <circle cx="57.9" cy="23.7" r="0.7" fill="#fff"/>
  <circle cx="63.5" cy="23.7" r="0.7" fill="#fff"/>
  <path d="M58.6 29.4Q60 32 61.4 29.4Z" fill="#d8367f"/>
  <circle cx="60" cy="28" r="1.5" fill="#ff4f9a"/>
  <ellipse cx="54.4" cy="27.6" rx="1.9" ry="1.1" fill="#ff8fb8" opacity="0.6"/>
  <ellipse cx="65.6" cy="27.6" rx="1.9" ry="1.1" fill="#ff8fb8" opacity="0.6"/>

  <!-- a sparkle for the winner -->
  <path d="M86 22l1.8 4.2 4.2 1.8-4.2 1.8-1.8 4.2-1.8-4.2-4.2-1.8 4.2-1.8z" fill="#fff"/>
</svg>
