<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Emperor Huddle</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe1ee"/><stop offset="1" stop-color="#ffbcd8"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="chest" x1="0" y1="36" x2="0" y2="70" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffe189"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <path id="parent" d="M50 13C60 13 66 20 66.5 29C67 37 70 45 74 55C79 67 80 83 76 95C73 103 64 107.5 52 107.5C40 107.5 31 103 28 93C25 81 27 65 31 53C34 43 35.5 35 36 27C37 18.5 42 13 50 13Z"/>
    <path id="belly" d="M58 34C65 39 69 47 72 57C76 69 77 85 73 97C71 103 65 107.5 57 107.5C51 99 49 87 49 73C49 58 52 44 58 34Z"/>
    <path id="chickShape" d="M85 70C95.5 70 102 78 102 88C102 99 95 106 85 106C75 106 68 99 68 88C68 78 74.5 70 85 70Z"/>
    <clipPath id="parentClip"><use href="#parent"/></clipPath>
    <clipPath id="bellyClip"><use href="#belly"/></clipPath>
    <clipPath id="chick"><use href="#chickShape"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>

  <!-- the snow they stand on, falling snow -->
  <path d="M-2 100C24 96 52 97 72 99C92 101 108 98 122 96V122H-2Z" fill="#fff"/>
  <path d="M-2 111C26 108 56 110 80 113C96 115 110 113 122 111V122H-2Z" fill="#f6e8f1"/>
  <ellipse cx="64" cy="106.5" rx="42" ry="4.5" fill="#4b3a8c" opacity="0.14"/>
  <g fill="#fff">
    <circle cx="14" cy="30" r="2"/><circle cx="20" cy="54" r="1.5"/><circle cx="11" cy="76" r="1.8"/>
    <circle cx="104" cy="22" r="1.8"/><circle cx="110" cy="66" r="1.4"/><circle cx="88" cy="12" r="1.3"/>
  </g>

  <!-- the emperor parent, turned to its chick: dark back lit on the left -->
  <g clip-path="url(#parentClip)">
    <rect x="24" y="10" width="60" height="100" fill="#3f3659"/>
    <use href="#parent" transform="translate(-4 -1)" fill="#544a78"/>
  </g>
  <path d="M38.5 24C40 19 44 15.8 49 15.3" fill="none" stroke="#7a70a3" stroke-width="2.6" stroke-linecap="round"/>
  <!-- the white front, pale gold at the top, shaded on the right -->
  <g clip-path="url(#bellyClip)">
    <rect x="46" y="32" width="34" height="78" fill="#e4ddf6"/>
    <use href="#belly" transform="translate(-3.5 0)" fill="url(#chest)"/>
  </g>
  <!-- the golden ear patch behind the eye, fading down the neck -->
  <path d="M47.5 27C51.5 26.5 54 29.5 54 33.5C54 37.5 55.5 40.5 59 43C54 43.8 49.5 41 47.5 37C46 33.5 45.5 29 47.5 27Z" fill="#ffc83d"/>
  <path d="M54 33.5C54 37.5 55.5 40.5 59 43C56.5 43.4 54 42.8 52 41.5C52.5 39 52.8 36.5 54 33.5Z" fill="#eba123"/>
  <!-- the long beak, bent down to the chick -->
  <path d="M60 24.5C67 26.5 73 31 77 37.5C71 35.5 65.5 33 61 31Z" fill="#3f3659"/>
  <path d="M61 31C65.5 33 71 35.5 77 37.5C71.5 37.5 65.5 36 60.5 33.5Z" fill="#ff9c57"/>
  <!-- eye with a white ring, blush -->
  <circle cx="56" cy="23.5" r="3.6" fill="#fff"/>
  <ellipse cx="56.5" cy="23.8" rx="2.4" ry="2.9" fill="#2b2330"/>
  <circle cx="57.5" cy="22.7" r="1" fill="#fff"/>
  <ellipse cx="62" cy="38" rx="3.4" ry="2" fill="#ff8fb8" opacity="0.6"/>
  <!-- the flipper hanging by its side -->
  <path d="M36 50C31 58 27 68 25.5 79C25 82.5 28.5 83.5 30 80.5C34 72 38 63 41 55Z" fill="#3f3659"/>
  <path d="M35.5 52C32 58.5 29.5 65.5 28 73" fill="none" stroke="#6e6494" stroke-width="2.4" stroke-linecap="round"/>
  <!-- the parent's feet -->
  <ellipse cx="45" cy="106" rx="6.5" ry="3" fill="#3f3659"/>
  <ellipse cx="59" cy="106.5" rx="6" ry="2.8" fill="#3f3659"/>

  <!-- the fluffy chick snuggled in front: grey down, a black cap, a white face -->
  <g clip-path="url(#chick)">
    <rect x="66" y="68" width="38" height="40" fill="#9790ba"/>
    <use href="#chickShape" transform="translate(-3 -2.5)" fill="#bcb6d6"/>
    <path d="M66 86C68 76 75 70.5 85 70.5C95 70.5 102 76 104 86C99 82 93 80 85 80C77 80 71 82 66 86Z" fill="#3f3659"/>
    <path d="M70 80C72.5 75.5 77 73 82 72.5" fill="none" stroke="#6e6494" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <!-- little fluffy bumps on its down -->
  <g fill="#bcb6d6"><circle cx="69.5" cy="96" r="3"/><circle cx="74" cy="102.5" r="3"/></g>
  <g fill="#9790ba"><circle cx="100.5" cy="96" r="3"/><circle cx="96" cy="102.5" r="3"/></g>
  <!-- the white mask, eyes, a tiny beak, blush -->
  <path d="M74 87C74 82.5 78.5 80.5 85 82.5C91.5 80.5 96 82.5 96 87C96 93 91.5 96.5 85 96.5C78.5 96.5 74 93 74 87Z" fill="#fff"/>
  <ellipse cx="80.5" cy="87.2" rx="2.4" ry="2.9" fill="#2b2330"/>
  <ellipse cx="89.5" cy="87.2" rx="2.4" ry="2.9" fill="#2b2330"/>
  <circle cx="81.4" cy="86.1" r="1" fill="#fff"/>
  <circle cx="90.4" cy="86.1" r="1" fill="#fff"/>
  <path d="M83 90.5L85 93.5L87 90.5Z" fill="#3f3659"/>
  <ellipse cx="77" cy="92.5" rx="2.6" ry="1.6" fill="#ff8fb8" opacity="0.6"/>
  <ellipse cx="93" cy="92.5" rx="2.6" ry="1.6" fill="#ff8fb8" opacity="0.6"/>
  <ellipse cx="80" cy="106" rx="4" ry="2.2" fill="#3f3659"/>
  <ellipse cx="90" cy="106" rx="4" ry="2.2" fill="#3f3659"/>

  <!-- a heart above them -->
  <g transform="translate(95 52) rotate(10) scale(0.75)">
    <path d="M0 9C-9 3-12-3-8.5-7C-6-9.8-2-9-0-5.6C2-9 6-9.8 8.5-7C12-3 9 3 0 9Z" fill="#ff4f9a"/>
    <path d="M0 9C5 5.6 8.6 1.8 9.6-1.8C6 2 3 4.4 0 6Z" fill="#d8367f"/>
  </g>
</svg>
