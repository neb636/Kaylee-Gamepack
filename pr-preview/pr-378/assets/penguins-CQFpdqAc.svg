<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Pepa's Penguin Cliff</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff5d1"/><stop offset="1" stop-color="#ffe08f"/></linearGradient>
    <radialGradient id="glow" cx="0.45" cy="0.42" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fe3ea"/><stop offset="1" stop-color="#3fc1cf"/></linearGradient>
    <clipPath id="rock"><path d="M-2 84C10 78 26 80 40 79C54 78 66 80 74 85C80 92 82 104 80 122H-2Z"/></clipPath>
    <clipPath id="body"><ellipse cx="48" cy="60" rx="17" ry="25"/></clipPath>
    <clipPath id="belly"><ellipse cx="52" cy="66" rx="11" ry="17.5"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="54" cy="52" r="50" fill="url(#glow)"/>
  <circle cx="96" cy="24" r="9" fill="#fff3c4"/>

  <!-- the sea, a wave breaking on the rocks -->
  <rect y="86" width="120" height="36" fill="url(#sea)"/>
  <g fill="#fff" opacity="0.6"><rect x="88" y="98" width="20" height="3" rx="1.5"/><rect x="94" y="108" width="16" height="3" rx="1.5"/></g>
  <path d="M74 92C78 82 86 78 94 82C90 82 87 85 87 89C91 86 97 87 99 92Z" fill="#fff"/>
  <circle cx="82" cy="76" r="2" fill="#fff"/><circle cx="90" cy="73" r="1.6" fill="#fff"/><circle cx="97" cy="77" r="1.4" fill="#fff"/>
  <ellipse cx="106" cy="96" rx="9" ry="4" fill="#a8927e"/>
  <ellipse cx="104.5" cy="94.5" rx="7" ry="2.6" fill="#c7b39f"/>

  <!-- the cliff: warm rocks, lit from the top left -->
  <g clip-path="url(#rock)">
    <rect x="-2" y="76" width="86" height="48" fill="#a8927e"/>
    <path d="M-2 84C10 78 26 80 40 79C54 78 62 80 66 82C64 94 60 108 58 122H-2Z" fill="#c7b39f"/>
    <path d="M6 84C18 80.5 30 81 42 80.5" fill="none" stroke="#e3d4c4" stroke-width="3" stroke-linecap="round"/>
    <path d="M14 96L24 100M34 104L44 101M8 110L16 114M50 94L56 98" stroke="#a8927e" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- Pepa the Humboldt penguin -->
  <ellipse cx="50" cy="84" rx="17" ry="3" fill="#4b3a8c" opacity="0.18"/>
  <ellipse cx="44" cy="84" rx="5.5" ry="2.6" fill="#6b5d73"/>
  <ellipse cx="56" cy="84" rx="5.5" ry="2.6" fill="#6b5d73"/>
  <path d="M33 54C28 62 27 70 30 77C33 72 35 66 36 60Z" fill="#2f2a44"/>
  <g clip-path="url(#body)">
    <rect x="28" y="32" width="40" height="56" fill="#2f2a44"/>
    <ellipse cx="45.5" cy="57" rx="17" ry="25" fill="#433d63"/>
  </g>
  <g clip-path="url(#belly)">
    <rect x="38" y="46" width="28" height="40" fill="#e4ddf6"/>
    <ellipse cx="50.5" cy="64" rx="11" ry="17.5" fill="#fff7f0"/>
  </g>
  <!-- the black band across the chest -->
  <path d="M41.5 57C45 62 56 63 62.5 56" fill="none" stroke="#2f2a44" stroke-width="3.4" stroke-linecap="round"/>
  <!-- the white stripe round the face -->
  <path d="M44 38C49 33.5 57 33.5 60.5 38C62.5 41 62.5 47 60 51C59 47 58 43.5 55.5 40.5C52 37.5 48 37 44 38Z" fill="#fff7f0"/>
  <path d="M60 51C59.5 46 58 42 55.5 40.5" fill="none" stroke="#e4ddf6" stroke-width="1.6" stroke-linecap="round"/>
  <!-- face: eye, pink patch, beak, blush -->
  <ellipse cx="53.5" cy="44" rx="2.4" ry="2.9" fill="#2b2330"/>
  <circle cx="54.3" cy="43.1" r="0.95" fill="#fff"/>
  <ellipse cx="58.6" cy="46.2" rx="3" ry="2.4" fill="#ff8fb8"/>
  <path d="M59 44L71 46.8L59 49.4Z" fill="#5d5478"/>
  <path d="M59 44L71 46.8L59 46.6Z" fill="#7d75a6"/>
  <ellipse cx="51.5" cy="49.5" rx="2.8" ry="1.7" fill="#ff8fb8" opacity="0.6"/>
  <path d="M38 40C40 37 43 35 46 34.5" fill="none" stroke="#5d5478" stroke-width="2.4" stroke-linecap="round"/>

  <path d="M24 32v5M21.5 34.5h5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
</svg>
