<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Big frame</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff5d1"/><stop offset="1" stop-color="#ffe08f"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="roof"><path d="M22 37L44 18.5Q48 15 52 18.5L74 37Z"/></clipPath>
    <clipPath id="valance"><rect x="20" y="37" width="56" height="5"/></clipPath>
    <clipPath id="nets"><path d="M35 55.5H59V73.5H35ZM35 79.5H59V101H35Z"/></clipPath>
    <clipPath id="ball"><circle r="3.5"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="56" r="50" fill="url(#glow)"/>
  <ellipse cx="62" cy="102" rx="38" ry="5" fill="#4b3a8c" opacity="0.14"/>

  <!-- inside the tower, and a few balls in the pit -->
  <rect x="33" y="38" width="28" height="63" fill="#cdbff3"/>
  <rect x="33" y="38" width="28" height="12" fill="#b9a6f5"/>
  <circle cx="39" cy="98" r="3.2" fill="#ff8fb8"/><circle cx="45" cy="97.5" r="3.2" fill="#ffc83d"/><circle cx="51" cy="98.5" r="3.2" fill="#8ccfff"/><circle cx="56" cy="97.5" r="3" fill="#8fe3c8"/><circle cx="42" cy="93.5" r="3" fill="#8ccfff"/><circle cx="53" cy="93.5" r="3" fill="#ff8fb8"/>

  <!-- net walls -->
  <g clip-path="url(#nets)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
    <path d="M35 31l24 24m-24-17l24 24m-24-17l24 24m-24-17l24 24m-24-17l24 24m-24-17l24 24m-24-17l24 24m-24-17l24 24m-24-17l24 24m-24-17l24 24m-24-17l24 24"/>
    <path d="M35 55l24-24m-24 31l24-24m-24 31l24-24m-24 31l24-24m-24 31l24-24m-24 31l24-24m-24 31l24-24m-24 31l24-24m-24 31l24-24m-24 31l24-24m-24 31l24-24"/>
  </g>
  <!-- a railing on the top deck -->
  <rect x="35" y="43" width="24" height="2.5" rx="1.25" fill="#fff"/>

  <!-- posts: sky blue, shaded on the right -->
  <rect x="30" y="34" width="5" height="67" rx="2.5" fill="#8ccfff"/>
  <rect x="32.5" y="36" width="2.5" height="63" fill="#5fb0ea"/>
  <rect x="59" y="34" width="5" height="67" rx="2.5" fill="#8ccfff"/>
  <rect x="61.5" y="36" width="2.5" height="63" fill="#5fb0ea"/>

  <!-- the decks: turquoise slabs, lit on top -->
  <rect x="27" y="73.5" width="40" height="6" rx="2" fill="#1f9cb3"/>
  <rect x="27" y="73.5" width="40" height="4.5" rx="2" fill="#3fc1cf"/>
  <rect x="28" y="73.5" width="38" height="2" rx="1" fill="#8fe3ea"/>
  <rect x="27" y="49.5" width="44" height="6" rx="2" fill="#1f9cb3"/>
  <rect x="27" y="49.5" width="44" height="4.5" rx="2" fill="#3fc1cf"/>
  <rect x="28" y="49.5" width="42" height="2" rx="1" fill="#8fe3ea"/>

  <!-- the roof: pink, shaded on the right, a scalloped edge and a gold ball on top -->
  <g clip-path="url(#roof)">
    <rect x="20" y="14" width="56" height="24" fill="#ff8fb8"/>
    <path d="M48 12V40H78V12Z" fill="#e7699c"/>
  </g>
  <path d="M28 33.5L43 21" stroke="#ffc4da" stroke-width="2.5" stroke-linecap="round"/>
  <g clip-path="url(#valance)">
    <circle cx="25.5" cy="37" r="3.6" fill="#fff"/><circle cx="32.5" cy="37" r="3.6" fill="#ff4f9a"/><circle cx="39.5" cy="37" r="3.6" fill="#fff"/><circle cx="46.5" cy="37" r="3.6" fill="#ff4f9a"/>
    <circle cx="53.5" cy="37" r="3.6" fill="#fff"/><circle cx="60.5" cy="37" r="3.6" fill="#ff4f9a"/><circle cx="67.5" cy="37" r="3.6" fill="#fff"/><circle cx="74.5" cy="37" r="3.6" fill="#ff4f9a"/>
  </g>
  <circle cx="48" cy="15.5" r="3.2" fill="#ffc83d"/>
  <circle cx="47" cy="14.5" r="1.2" fill="#ffe189"/>

  <!-- the red spiral slide round its pole: far turns in shade, near turns lit -->
  <g fill="none" stroke="#d9485e" stroke-width="7" stroke-linecap="round">
    <path d="M68 52C69.5 51.5 73.5 52 78 53.5C82.5 55 87 58.5 87 62"/>
    <path d="M69 72C69.5 72 73.5 72 78 73.5C82.5 75 87 78.5 87 82"/>
  </g>
  <rect x="76.5" y="50" width="3.5" height="51" rx="1.75" fill="#bcb6d6"/>
  <rect x="78.5" y="51" width="1.5" height="49" fill="#9790ba"/>
  <circle cx="78.25" cy="49.5" r="2.5" fill="#ffc83d"/>
  <g fill="none" stroke-linecap="round">
    <path d="M87 62C87 65.5 82.5 69 78 70.5C73.5 72 69 72 69 72M87 82C87 85.5 82.5 89 78 90.5C73.5 92 70 95.5 64 97.5" stroke="#ff6b6b" stroke-width="7"/>
    <path d="M87 59.5C87 63 82.5 66.5 78 68M87 79.5C87 83 82.5 86.5 78 88" stroke="#ffa3a3" stroke-width="2"/>
  </g>

  <!-- the ball cannon on the first deck, firing balls out to the left -->
  <g transform="translate(40 67) rotate(-150)">
    <rect x="-2" y="-4.5" width="19" height="9" rx="4.5" fill="#ff9c57"/>
    <path d="M-2 -1H17V-0.5A4.5 4.5 0 0 1 12.5 -4.5H2.5A4.5 4.5 0 0 0 -2 -0.5Z" fill="#e57a35"/>
    <rect x="13" y="-5.5" width="4.5" height="11" rx="2.25" fill="#ff4f9a"/>
    <rect x="1" y="2" width="9" height="2" rx="1" fill="#ffc595"/>
  </g>
  <path d="M34 73.5a6 6 0 0 1 12 0Z" fill="#8b78e6"/>
  <path d="M35.5 71a5 5 0 0 1 4-3.5" fill="none" stroke="#b3a5f2" stroke-width="2" stroke-linecap="round"/>
  <g transform="translate(21.5 55.5)"><g clip-path="url(#ball)"><rect x="-4" y="-4" width="8" height="8" fill="#e7699c"/><circle cx="-1" cy="-1" r="3.5" fill="#ff8fb8"/></g><circle cx="-1.2" cy="-1.2" r="1" fill="#ffc4da"/></g>
  <g transform="translate(16.5 47)"><g clip-path="url(#ball)"><rect x="-4" y="-4" width="8" height="8" fill="#5fb0ea"/><circle cx="-1" cy="-1" r="3.5" fill="#8ccfff"/></g><circle cx="-1.2" cy="-1.2" r="1" fill="#c9e9ff"/></g>
  <g transform="translate(16 38.5) scale(0.9)"><g clip-path="url(#ball)"><rect x="-4" y="-4" width="8" height="8" fill="#eba123"/><circle cx="-1" cy="-1" r="3.5" fill="#ffc83d"/></g><circle cx="-1.2" cy="-1.2" r="1" fill="#ffe189"/></g>
  <path d="M27 58.5l-2.5 1.5M26.5 53.5l-2.5-1" stroke="#fff" stroke-width="2" stroke-linecap="round"/>

  <!-- sparkles -->
  <path d="M94 24l2 4.5 4.5 2-4.5 2-2 4.5-2-4.5-4.5-2 4.5-2z" fill="#fff"/>
</svg>
