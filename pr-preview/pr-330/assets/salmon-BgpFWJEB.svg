<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Salmon Leap</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ddf7ee"/><stop offset="1" stop-color="#a9e8d2"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#79c4f2"/><stop offset="1" stop-color="#4fa6de"/></linearGradient>
    <clipPath id="rockL"><path d="M-2 48C8 42 22 42 34 48C40 60 40 80 38 102H-2Z"/></clipPath>
    <clipPath id="rockR"><path d="M122 54C112 50 98 50 86 56C82 66 82 84 84 102H122Z"/></clipPath>
    <clipPath id="fish"><path d="M-22 0C-14 -10 4 -12 16 -6C20 -4 24 -2 26 0C24 2 20 4 16 6C4 12 -14 10 -22 0Z"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="44" r="52" fill="url(#glow)"/>

  <!-- the river above the ledge, and the falls -->
  <rect x="26" y="38" width="66" height="12" rx="5" fill="#79c4f2"/>
  <path d="M30 46C30 64 33 80 36 96H84C87 80 90 64 90 46Z" fill="#a8dcff"/>
  <g stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity="0.9">
    <path d="M40 50V68M48 52V84M58 50V62M66 54V80M76 50V70M82 56V88"/>
  </g>
  <path d="M30 46C44 50 76 50 90 46" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

  <!-- rocks on both sides, mossy on top -->
  <g clip-path="url(#rockL)">
    <rect x="-2" y="40" width="44" height="64" fill="#9790ba"/>
    <path d="M-2 48C8 42 22 42 34 48C33 66 30 84 26 104H-2Z" fill="#bcb6d6"/>
    <path d="M-2 50C8 44 22 44 34 50L34 54C22 49 8 49 -2 55Z" fill="#73cf86"/>
    <path d="M6 64C10 62 16 62 20 64" fill="none" stroke="#dedaf0" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <g clip-path="url(#rockR)">
    <rect x="80" y="46" width="44" height="58" fill="#9790ba"/>
    <path d="M122 54C112 50 98 50 86 56C88 70 90 86 92 104H122Z" fill="#bcb6d6"/>
    <path d="M122 56C112 52 98 52 86 58L86 62C98 57 112 57 122 61Z" fill="#48a96c"/>
  </g>

  <!-- the pool, foaming where the falls land -->
  <rect y="94" width="120" height="28" fill="url(#pool)"/>
  <g fill="#fff"><ellipse cx="44" cy="96" rx="9" ry="3.4"/><ellipse cx="60" cy="97" rx="10" ry="3.6"/><ellipse cx="76" cy="96" rx="9" ry="3.4"/></g>
  <g fill="#fff" opacity="0.55"><rect x="10" y="106" width="20" height="3" rx="1.5"/><rect x="86" y="110" width="22" height="3" rx="1.5"/></g>

  <!-- the salmon, leaping up the falls -->
  <g transform="translate(60 64) rotate(-38)">
    <path d="M-20 0L-33 -9.5C-30.5 -3 -30.5 3 -33 9.5Z" fill="#e7699c"/>
    <path d="M-4 -9.5L2 -16L7 -8.5Z" fill="#e7699c"/>
    <g clip-path="url(#fish)">
      <rect x="-24" y="-14" width="52" height="28" fill="#ffd0dc"/>
      <path d="M-24 -14H28V0C20 -1 10 -1 0 0C-10 1 -18 2 -24 2Z" fill="#ff8fb8"/>
      <path d="M-24 -14H28V-5C18 -7 4 -7 -10 -4C-16 -3 -20 -2 -24 -1Z" fill="#e7699c"/>
      <path d="M10 -9C12 -4 12 3 10 8" fill="none" stroke="#e7699c" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <path d="M-2 6L4 11L6 5Z" fill="#e7699c"/>
    <g fill="#c4507f"><circle cx="-8" cy="-6" r="0.9"/><circle cx="-2" cy="-7.5" r="0.9"/><circle cx="4" cy="-7" r="0.9"/><circle cx="-12" cy="-3.5" r="0.9"/></g>
    <ellipse cx="17" cy="-2" rx="2.2" ry="2.6" fill="#2b2330"/>
    <circle cx="17.8" cy="-2.9" r="0.85" fill="#fff"/>
    <path d="M20.5 2Q23 3.4 25 1.5" fill="none" stroke="#2b2330" stroke-width="1.4" stroke-linecap="round"/>
    <ellipse cx="14.5" cy="2.8" rx="2.4" ry="1.4" fill="#ff4f9a" opacity="0.5"/>
  </g>
  <g fill="#fff"><circle cx="78" cy="84" r="1.8"/><circle cx="84" cy="78" r="1.4"/><circle cx="72" cy="90" r="1.2"/><circle cx="40" cy="38" r="1.3"/></g>
  <path d="M100 22v5M97.5 24.5h5" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
</svg>
