<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>The jet ski</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff5d1"/><stop offset="1" stop-color="#ffe08f"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sea" x1="0" y1="78" x2="0" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8fe3ea"/><stop offset="1" stop-color="#1f9cb3"/></linearGradient>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="54" r="50" fill="url(#glow)"/>
  <!-- the sea -->
  <path d="M0 82C14 78 26 84 40 80C54 76 66 84 80 80C94 76 106 82 120 79V120H0Z" fill="url(#sea)"/>
  <g fill="#fff" opacity="0.6"><rect x="10" y="100" width="16" height="2.5" rx="1.25"/><rect x="88" y="106" width="20" height="2.5" rx="1.25"/></g>
  <!-- the spray fanning up behind -->
  <g fill="#fff">
    <circle cx="16" cy="70" r="6"/><circle cx="10" cy="60" r="4.5"/><circle cx="22" cy="58" r="5"/><circle cx="14" cy="48" r="3.5"/><circle cx="26" cy="68" r="5"/><circle cx="6" cy="72" r="3.5"/>
  </g>
  <g fill="#c9e9ff"><circle cx="18" cy="74" r="4"/><circle cx="28" cy="74" r="3.5"/></g>
  <!-- the wake -->
  <path d="M8 86C20 82 30 84 36 80" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- the jet ski, nose up, riding right -->
  <g transform="rotate(-10 60 76)">
    <ellipse cx="60" cy="90" rx="34" ry="4" fill="#4b3a8c" opacity="0.15"/>
    <path d="M24 74H92C100 74 104 70 106 66C104 78 98 86 86 88H36C28 88 24 82 24 74Z" fill="#fff7f0"/>
    <path d="M24 80H104C100 85 94 88 86 88H36C30 88 26 85 24 80Z" fill="#efdccd"/>
    <path d="M26 78H102" stroke="#ff4f9a" stroke-width="4" stroke-linecap="round"/>
    <path d="M30 83H96" stroke="#ffc83d" stroke-width="2.5" stroke-linecap="round"/>
    <!-- the seat -->
    <path d="M32 74C32 66 38 64 46 64H62C66 64 68 68 68 74Z" fill="#ff4f9a"/>
    <path d="M56 64H62C66 64 68 68 68 74H58C58 70 58 66 56 64Z" fill="#d8367f"/>
    <path d="M38 67C40 66 43 65.5 46 65.5" fill="none" stroke="#ff8fc0" stroke-width="2" stroke-linecap="round"/>
    <!-- the hood and the windscreen -->
    <path d="M68 74L72 62C76 60 82 62 86 66L94 74Z" fill="#ff8fb8"/>
    <path d="M80 61C84 62 87 64 89 67L94 74H84Z" fill="#e7699c"/>
    <path d="M72 62L76 52C80 52 84 56 86 60L82 62Z" fill="#8ccfff"/>
    <path d="M76 53L78 56" stroke="#c9e9ff" stroke-width="2" stroke-linecap="round"/>
    <!-- the handlebars -->
    <path d="M70 60L66 52" stroke="#5d5078" stroke-width="3" stroke-linecap="round"/>
    <path d="M62 51H70" stroke="#5d5078" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- sparkles -->
  <g fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M98 34v8M94 38h8"/><path d="M32 30v6M29 33h6"/></g>
</svg>
