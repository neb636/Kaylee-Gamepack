<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Make a pizza in Naples</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9de"/><stop offset="1" stop-color="#ffc3a8"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="fire" cx="0.5" cy="1" r="0.9"><stop offset="0" stop-color="#ffc83d"/><stop offset="0.45" stop-color="#ff9c57"/><stop offset="1" stop-color="#6b432e"/></radialGradient>
    <clipPath id="dome"><path d="M18 80C18 41 38 17 60 17C82 17 102 41 102 80Z"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="50" r="50" fill="url(#glow)"/>

  <!-- the wood-fired oven: a terracotta dome, shaded on the right, a few bricks -->
  <g clip-path="url(#dome)">
    <rect x="15" y="15" width="90" height="70" fill="#c65a45"/>
    <path d="M18 80C18 41 38 17 60 17C70 17 78 21 84 28C80 46 78 64 80 80Z" fill="#e9785a"/>
    <path d="M30 34C35 26 42 21 50 19" fill="none" stroke="#f6a283" stroke-width="3" stroke-linecap="round"/>
    <rect x="26" y="50" width="11" height="5" rx="2.5" fill="#f6a283"/>
    <rect x="40" y="31" width="11" height="5" rx="2.5" fill="#f6a283"/>
    <rect x="67" y="26" width="11" height="5" rx="2.5" fill="#f6a283" opacity="0.7"/>
    <rect x="84" y="46" width="11" height="5" rx="2.5" fill="#e9785a"/>
    <rect x="23" y="64" width="9" height="5" rx="2.5" fill="#f6a283"/>
  </g>
  <!-- the oven's mouth and its fire -->
  <path d="M41 80V66a19 17 0 0 1 38 0V80Z" fill="url(#fire)"/>
  <path d="M50 80C47 74 51 70 53 66C54 71 57 72 58 69C61 73 64 71 64 66C69 71 71 76 69 80Z" fill="#ffc83d"/>
  <path d="M55 80C54 77 56 75 57 73C58 76 61 76 62 74C64 77 64 79 63 80Z" fill="#fff6cc"/>

  <!-- the wooden peel -->
  <path d="M92 100L114 118" stroke="#a46e4b" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="60" cy="91" rx="44" ry="19" fill="#c99266"/>
  <ellipse cx="60" cy="89.5" rx="44" ry="17.5" fill="#e5b78f"/>

  <!-- the pizza: golden crust, red sauce, mozzarella, basil -->
  <ellipse cx="60" cy="88" rx="37" ry="16" fill="#d9954a"/>
  <ellipse cx="60" cy="86.5" rx="37" ry="15" fill="#f2b765"/>
  <path d="M30 82Q36 75 50 73" fill="none" stroke="#ffd99a" stroke-width="2.5" stroke-linecap="round"/>
  <ellipse cx="60" cy="87" rx="30" ry="11.5" fill="#e04e5a"/>
  <ellipse cx="60" cy="86" rx="30" ry="10.8" fill="#ff6b6b"/>
  <ellipse cx="47" cy="84" rx="6.5" ry="3.6" fill="#fff7f0"/>
  <ellipse cx="66" cy="81.5" rx="6" ry="3.2" fill="#fff7f0"/>
  <ellipse cx="72" cy="90" rx="6.5" ry="3.4" fill="#fff7f0"/>
  <ellipse cx="54" cy="91.5" rx="5.5" ry="3" fill="#fff7f0"/>
  <path d="M43 85.5q4 1.6 9 0M68 91.5q4 1.4 8.5 0" fill="none" stroke="#efdccd" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M57 81.5c3-3.5 8-3.2 9-1.2c-3 2.6-6.5 2.6-9 1.2z" fill="#48a96c"/>
  <path d="M77 85c2-3.8 6.4-4.2 7.8-2.4c-2.2 2.8-5.4 3.4-7.8 2.4z" fill="#73cf86"/>
  <path d="M39 90.5c2.4-3.4 7-3.4 8-1.4c-2.6 2.4-5.8 2.6-8 1.4z" fill="#73cf86"/>
  <path d="M62 93.5c2.2-3 6.2-3 7.2-1.2c-2.4 2.2-5.2 2.4-7.2 1.2z" fill="#48a96c"/>

  <!-- warm steam -->
  <path d="M50 70c-3-4 3-6 0-10M66 68c-3-4 3-6 0-10" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
</svg>
