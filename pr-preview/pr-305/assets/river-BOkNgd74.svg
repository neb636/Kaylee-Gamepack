<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Rosa's Rainy River</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ece6ff"/><stop offset="1" stop-color="#cdbfff"/></linearGradient>
    <radialGradient id="glow" cx="0.55" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c4d69e"/><stop offset="1" stop-color="#93b07a"/></linearGradient>
    <clipPath id="cloud"><path d="M24 40a8 8 0 0 1 4-14a12 12 0 0 1 22-6a10 10 0 0 1 16 6a7 7 0 0 1 2 14Z"/></clipPath>
    <clipPath id="dolphin"><path d="M34 92C40 72 56 56 76 49C84 46 92 46 96 49L106 48.5C108 49 108 52.5 106 53L95 55.5C92 61 84 65 74 68C60 73 50 82 46 96Z"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="64" cy="54" r="50" fill="url(#glow)"/>

  <!-- the rain cloud and its drops -->
  <g clip-path="url(#cloud)">
    <rect x="20" y="14" width="52" height="28" fill="#9790ba"/>
    <path d="M24 37a8 8 0 0 1 4-14a12 12 0 0 1 22-6a10 10 0 0 1 16 6a7 7 0 0 1 2 14Z" fill="#bcb6d6"/>
    <path d="M30 24a10 10 0 0 1 12-6" fill="none" stroke="#dedaf0" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g stroke="#8ccfff" stroke-width="2.4" stroke-linecap="round">
    <path d="M30 46l-2 5M41 49l-2 5M52 46l-2 5M63 48l-2 5M35 58l-2 5M47 58l-2 5M58 60l-2 5"/>
  </g>

  <!-- the jungle river -->
  <rect y="90" width="120" height="32" fill="url(#river)"/>
  <g fill="#e2ecc8" opacity="0.8"><rect x="62" y="100" width="22" height="3" rx="1.5"/><rect x="78" y="110" width="18" height="3" rx="1.5"/><rect x="14" y="108" width="16" height="3" rx="1.5"/></g>
  <ellipse cx="44" cy="96" rx="15" ry="3.5" fill="#7d9a68" opacity="0.6"/>

  <!-- Rosa the pink river dolphin, leaping -->
  <g clip-path="url(#dolphin)">
    <rect x="30" y="42" width="80" height="58" fill="#e7699c"/>
    <path d="M34 92C40 72 56 56 76 49C84 46 92 46 96 49L106 48.5C108 49 108 51 106 51.5L95 53C90 57 82 60 72 62C58 66 46 78 40 94Z" fill="#ff8fb8"/>
    <path d="M47 95C51 83 61 75 75 70C85 66 92 62 95 56" fill="none" stroke="#ffc4da" stroke-width="4" stroke-linecap="round"/>
    <path d="M44 72C52 61 64 54 78 50" fill="none" stroke="#ffc4da" stroke-width="2.6" stroke-linecap="round"/>
  </g>
  <path d="M55.5 60.5C57.5 55 61.5 54 64.5 56.5Z" fill="#e7699c"/>
  <path d="M66 64.5C68.5 71.5 66.5 77 61 79.5C62.5 74 62.5 69.5 60.5 66Z" fill="#e7699c"/>
  <ellipse cx="88" cy="52.5" rx="2.2" ry="2.6" fill="#2b2330"/>
  <circle cx="88.8" cy="51.6" r="0.85" fill="#fff"/>
  <path d="M94.5 54.6Q97.5 56.2 100.5 54.2" fill="none" stroke="#2b2330" stroke-width="1.5" stroke-linecap="round"/>
  <ellipse cx="86.5" cy="57.5" rx="2.8" ry="1.6" fill="#ff4f9a" opacity="0.45"/>

  <!-- the splash where her tail leaves the water -->
  <path d="M28 98C30 89 34 86 37 92C39 85 44 83 46 91C48 86 53 87 56 98Z" fill="#fff" opacity="0.92"/>
  <g fill="#fff"><circle cx="27" cy="84" r="1.8"/><circle cx="33" cy="80" r="1.4"/><circle cx="52" cy="82" r="1.6"/><circle cx="58" cy="87" r="1.2"/></g>

  <!-- jungle leaves at the banks -->
  <path d="M-2 72C10 68 18 74 20 84C12 82 4 84 -2 90Z" fill="#3e9e78"/>
  <path d="M-2 92C8 86 18 88 22 98C14 98 6 100 -2 106Z" fill="#2b7a5f"/>
  <path d="M122 70C110 68 102 74 100 84C108 82 116 84 122 90Z" fill="#3e9e78"/>
  <path d="M122 92C112 88 104 92 102 102C110 100 116 102 122 106Z" fill="#2b7a5f"/>
  <path d="M1 80C8 77 14 79 17 82M120 78C113 75 107 77 103 81" fill="none" stroke="#69c19a" stroke-width="1.8" stroke-linecap="round"/>
</svg>
