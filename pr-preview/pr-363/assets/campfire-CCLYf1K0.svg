<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Campfire Night</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a4aa8"/><stop offset="1" stop-color="#2f2a6e"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffc83d" stop-opacity="0.6"/><stop offset="0.5" stop-color="#ff9c57" stop-opacity="0.22"/><stop offset="1" stop-color="#ff9c57" stop-opacity="0"/></radialGradient>
    <clipPath id="tent"><path d="M33 82L56.5 34L80 82Z"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>

  <!-- the moon and stars -->
  <circle cx="92" cy="25" r="10" fill="#fff6cc"/>
  <circle cx="97" cy="21.5" r="8.5" fill="#53459f"/>
  <g fill="#fff">
    <circle cx="22" cy="22" r="1.4"/><circle cx="40" cy="14" r="1"/><circle cx="70" cy="18" r="1.2"/>
    <circle cx="14" cy="44" r="1"/><circle cx="104" cy="46" r="1.2"/><circle cx="80" cy="36" r="0.8"/>
  </g>
  <path d="M30 32l1.2 2.8 2.8 1.2-2.8 1.2-1.2 2.8-1.2-2.8-2.8-1.2 2.8-1.2z" fill="#fff6cc"/>

  <!-- dark pine trees at the edge of the clearing -->
  <path d="M8 80L19 46L30 80Z" fill="#2b4f6e"/>
  <path d="M96 80L107 50L118 80Z" fill="#2b4f6e"/>
  <path d="M19 46L30 80H20Z" fill="#223f5c"/>
  <path d="M107 50L118 80H108Z" fill="#223f5c"/>

  <!-- the ground, warm near the fire -->
  <path d="M0 78C30 74 90 74 120 78V120H0Z" fill="#43397f"/>
  <ellipse cx="60" cy="96" rx="58" ry="22" fill="url(#glow)"/>
  <circle cx="60" cy="80" r="40" fill="url(#glow)"/>

  <!-- the tent: pink, lit on the left by the fire -->
  <g clip-path="url(#tent)">
    <rect x="30" y="30" width="54" height="56" fill="#b2558f"/>
    <path d="M33 82L56.5 34L60 82Z" fill="#e7699c"/>
    <path d="M50 82L56.5 54L63 82Z" fill="#3d2f6b"/>
    <path d="M56.5 54L63 82H56.5Z" fill="#2e2457"/>
  </g>
  <path d="M56.5 34L56.5 28" stroke="#c99266" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M40 64L46 51" stroke="#ff8fb8" stroke-width="2.2" stroke-linecap="round"/>

  <!-- logs -->
  <g>
    <rect x="40" y="91" width="40" height="8" rx="4" fill="#6b432e" transform="rotate(-14 60 95)"/>
    <rect x="40" y="91" width="40" height="8" rx="4" fill="#8a5b3d" transform="rotate(14 60 95)"/>
    <ellipse cx="41.5" cy="100" rx="3" ry="4" fill="#e5b78f" transform="rotate(14 41.5 100)"/>
  </g>
  <!-- stones round the fire -->
  <g>
    <ellipse cx="35" cy="101" rx="6" ry="4" fill="#9790ba"/><ellipse cx="34" cy="100" rx="4" ry="2.4" fill="#bcb6d6"/>
    <ellipse cx="85" cy="101" rx="6" ry="4" fill="#857eab"/><ellipse cx="84" cy="100" rx="4" ry="2.4" fill="#9790ba"/>
    <ellipse cx="60" cy="104" rx="7" ry="3.8" fill="#857eab"/><ellipse cx="59" cy="103" rx="4.5" ry="2.2" fill="#9790ba"/>
  </g>

  <!-- the flames -->
  <path d="M46 94C42 84 48 76 52 70C52 76 55 78 57 75C57 68 60 60 66 56C64 64 70 68 72 74C75 72 75 68 74 66C80 72 80 86 74 94Z" fill="#ff9c57"/>
  <path d="M51 94C48 86 53 80 56 77C57 81 60 82 61 79C62 74 64 70 67 68C67 74 71 78 71 82C73 81 74 79 74 77C76 82 74 90 70 94Z" fill="#ffc83d"/>
  <path d="M55 94C54 90 57 87 59 85C60 87 62 88 63 86C65 88 66 91 65 94Z" fill="#fff6cc"/>
  <!-- sparks -->
  <g fill="#ffe189">
    <circle cx="48" cy="62" r="1.5"/><circle cx="74" cy="56" r="1.3"/><circle cx="62" cy="48" r="1.1"/>
  </g>

  <!-- the marshmallow on a stick -->
  <path d="M104 96L82 70" stroke="#a46e4b" stroke-width="3.5" stroke-linecap="round"/>
  <g transform="rotate(-50 79 67)">
    <rect x="72" y="61" width="14" height="12" rx="4" fill="#efdccd"/>
    <rect x="72" y="61" width="11" height="12" rx="4" fill="#fff7f0"/>
    <rect x="72" y="61" width="4" height="12" rx="2" fill="#ffc595"/>
  </g>
</svg>
