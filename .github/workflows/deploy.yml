name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # PR previews also push to gh-pages; serialize both workflows' writes.
  group: gh-pages-publish
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build with PostHog
        run: |
          : "${VITE_POSTHOG_KEY:?Set the VITE_POSTHOG_KEY repository variable to the PostHog project token}"
          : "${VITE_POSTHOG_HOST:?Set the VITE_POSTHOG_HOST repository variable to the PostHog ingestion URL}"
          : "${LOCK_CODE:?Set the THAILAND_CODE repository secret to the family code (Thailand is locked behind it)}"
          if [ -z "$POSTHOG_API_KEY" ] || [ -z "$POSTHOG_PROJECT_ID" ]; then
            echo "::warning::PostHog source maps are disabled. Set the POSTHOG_API_KEY secret and POSTHOG_PROJECT_ID variable for readable error stacks."
            echo "PostHog: source maps were NOT uploaded. Configure POSTHOG_API_KEY (secret, Error tracking: write) and POSTHOG_PROJECT_ID (variable)." >> "$GITHUB_STEP_SUMMARY"
          fi
          npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Encrypts Thailand's code: it opens only with the family code (scripts/vite-lock.ts).
          LOCK_CODE: ${{ secrets.THAILAND_CODE }}
          VITE_POSTHOG_ENABLED: 'true'
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          # Optional: with both set, the build uploads source maps to PostHog error tracking.
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          # PR previews live in gh-pages/pr-preview/; don't wipe them.
          clean-exclude: pr-preview/
