name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # PR previews also push to gh-pages; serialize both workflows' writes.
  group: gh-pages-publish
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build with PostHog
        run: |
          : "${VITE_POSTHOG_KEY:?Set the VITE_POSTHOG_KEY repository variable to the PostHog project token}"
          : "${VITE_POSTHOG_HOST:?Set the VITE_POSTHOG_HOST repository variable to the PostHog ingestion URL}"
          npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          # PR previews live in gh-pages/pr-preview/; don't wipe them.
          clean-exclude: pr-preview/
