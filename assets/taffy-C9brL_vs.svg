<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Sugar Snow</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9de"/><stop offset="1" stop-color="#ffc3a8"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <clipPath id="snow"><path d="M18.5 88C17 78 22 71 30 71C33 66 41 64.5 46 68C51 64 59 64 63 67.5C68 63.5 77 63.5 81 68C86 65.5 94 67 96 72C101 73 103 80 101.5 88C101 90 99.5 91 97.5 91H22.5C20.5 91 18.5 90 18.5 88Z"/></clipPath>
    <clipPath id="coil"><ellipse rx="13.5" ry="11"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="54" r="50" fill="url(#glow)"/>
  <ellipse cx="60" cy="106" rx="46" ry="5.5" fill="#4b3a8c" opacity="0.14"/>

  <!-- the wooden tray -->
  <rect x="13" y="80" width="94" height="24" rx="9" fill="#a46e4b"/>
  <rect x="13" y="70" width="94" height="26" rx="9" fill="#c99266"/>
  <rect x="18.5" y="74" width="83" height="17" rx="6" fill="#8a5b3d"/>
  <path d="M19 93.5H101" stroke="#e5b78f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- heaped snow, shaded low on the right -->
  <g clip-path="url(#snow)">
    <rect x="15" y="60" width="90" height="34" fill="#e4ddf6"/>
    <path d="M16.5 85C15 75 20 68 28 68C31 63 39 61.5 44 65C49 61 57 61 61 64.5C66 60.5 75 60.5 79 65C84 62.5 92 64 94 69C99 70 101 77 99.5 85C99 87 97.5 88 95.5 88H20.5C18.5 88 16.5 87 16.5 85Z" fill="#fff"/>
  </g>
  <path d="M28 84.5q3-1.5 6 0M86 85q3-1.5 6 0" fill="none" stroke="#e4ddf6" stroke-width="2" stroke-linecap="round"/>

  <!-- maple syrup poured on the snow -->
  <path d="M22 82C26 79 30 84.5 35 81.5C39 79 43 81.5 48.5 77.5M71 84C75 81 79 86 84 83C88 80.5 92 83 96 81.5" fill="none" stroke="#eba123" stroke-width="5" stroke-linecap="round"/>
  <path d="M22 81C26 78 30 83.5 35 80.5C39 78 43 80.5 48.5 76.5M71 83C75 80 79 85 84 82C88 79.5 92 82 96 80.5" fill="none" stroke="#ffc83d" stroke-width="4" stroke-linecap="round"/>
  <path d="M23.5 79.5c2-1 4-.5 5.5.5M73 81c2-1 4-.5 5.5.5" fill="none" stroke="#ffe189" stroke-width="2" stroke-linecap="round"/>

  <!-- the stick -->
  <path d="M59 65L91 23" stroke="#e3bb7a" stroke-width="7.5" stroke-linecap="round"/>
  <path d="M58 64L90 22" stroke="#f5dba8" stroke-width="7" stroke-linecap="round"/>
  <path d="M64.5 52.5L83.5 27" stroke="#fdeecc" stroke-width="2" stroke-linecap="round"/>

  <!-- the taffy, rolled round the end of the stick -->
  <g transform="translate(56.5 66.5) rotate(-52.5)">
    <g clip-path="url(#coil)">
      <rect x="-15" y="-13" width="30" height="26" fill="#eba123"/>
      <ellipse cx="0.5" cy="-2.5" rx="13.5" ry="11" fill="#ffc83d"/>
      <path d="M-7-10Q-3.5 0-7 10M-.5-10.5Q3 0-.5 10.5M6-9.5Q9.5 0 6 9.5" fill="none" stroke="#eba123" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <ellipse cx="-2" cy="-6.5" rx="5" ry="1.8" fill="#fff6cc"/>
    <circle cx="5.5" cy="-6.5" r="1.3" fill="#fff"/>
  </g>

  <!-- a red maple leaf -->
  <g transform="translate(29 33) rotate(-16) scale(1.15)">
    <path d="M0 2V11.5" stroke="#d9485e" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M0-12L2-8L4.5-9.5L3.5-4.5L7.5-6L8-4L12-5L9.5-1L11.5 2L6 2L7 5.5L1 4.5H-1L-7 5.5L-6 2L-11.5 2L-9.5-1L-12-5L-8-4L-7.5-6L-3.5-4.5L-4.5-9.5L-2-8Z" fill="#ff6b6b" stroke="#ff6b6b" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M0-12L2-8L4.5-9.5L3.5-4.5L7.5-6L8-4L12-5L9.5-1L11.5 2L6 2L7 5.5L1 4.5H0Z" fill="#d9485e" stroke="#d9485e" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M-1 2.5L-8-2.5" stroke="#ffa3a3" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- a sparkle -->
  <path d="M41 49l1.5 3.5 3.5 1.5-3.5 1.5-1.5 3.5-1.5-3.5-3.5-1.5 3.5-1.5z" fill="#fff"/>
</svg>
