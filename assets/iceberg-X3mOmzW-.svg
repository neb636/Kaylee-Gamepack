<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <title>Iceberg Maker</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ddf7ee"/><stop offset="1" stop-color="#a9e8d2"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5"><stop offset="0" stop-color="#fff" stop-opacity="0.8"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="sea" x1="0" y1="68" x2="0" y2="120" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7fd6e0"/><stop offset="1" stop-color="#36a7c4"/></linearGradient>
    <linearGradient id="under" x1="0" y1="68" x2="0" y2="116" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#e6fbfb" stop-opacity="0.75"/><stop offset="1" stop-color="#e6fbfb" stop-opacity="0"/></linearGradient>
    <path id="body" d="M-28 0C-28-9-20-13-8-13C6-13 15-8 21-3C23-1 23 2 21 3.5C14 8.5 4 11-7 11C-20 11-28 8-28 0Z"/>
    <clipPath id="whale"><use href="#body"/></clipPath>
  </defs>
  <rect width="120" height="120" fill="url(#bg)"/>
  <circle cx="60" cy="44" r="50" fill="url(#glow)"/>
  <g fill="#fff" opacity="0.9">
    <circle cx="97" cy="21" r="4"/><circle cx="103" cy="17.5" r="5.5"/><circle cx="109" cy="21" r="3.5"/>
    <rect x="93" y="20" width="20" height="5" rx="2.5"/>
  </g>

  <!-- the sea, and the iceberg's big hidden part under the water -->
  <rect y="68" width="120" height="52" fill="url(#sea)"/>
  <path d="M12 69H106L114 82L106 98L84 110H40L18 98L6 82Z" fill="url(#under)"/>

  <!-- the iceberg: pastel faces, white in the light, lavender in the shade -->
  <path d="M14 69L23 50L31 45L37 29L47 21L56 11L66 19L72 29L80 27L88 41L94 54L101 59L106 69Z" fill="#c8c2f4"/>
  <path d="M14 69L23 50L31 45L37 29L47 21L56 11L58 34L50 53L44 69Z" fill="#fff"/>
  <path d="M56 11L66 19L72 29L64 46L58 34Z" fill="#e8f4ff"/>
  <path d="M58 34L64 46L60 69H44L50 53Z" fill="#dcf3f1"/>
  <path d="M88 41L94 54L101 59L106 69H80L84 54Z" fill="#b2acee"/>
  <path d="M22 62L28 50M34 63L39 42M44 30L50 24" stroke="#eef6ff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M72 29L80 27L88 41" fill="none" stroke="#ddd8ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the water line, glints -->
  <path d="M10 69.5C34 71.5 86 71.5 110 69.5" fill="none" stroke="#f2fdff" stroke-width="3" stroke-linecap="round"/>
  <g fill="#fff" opacity="0.6">
    <rect x="2" y="75" width="14" height="2.6" rx="1.3"/><rect x="104" y="75" width="14" height="2.6" rx="1.3"/>
    <rect x="10" y="110" width="18" height="2.6" rx="1.3"/>
  </g>

  <!-- the narwhal swimming by: lavender with a spotted back, a twisty tusk -->
  <ellipse cx="66" cy="108" rx="26" ry="3" fill="#1f7f99" opacity="0.18"/>
  <g transform="translate(66 92) rotate(6) scale(0.92)">
    <!-- the tusk, pointing up and ahead -->
    <g transform="translate(-26 -4) rotate(22)">
      <path d="M1-2.8L-30-0.6Q-31.5 0-30 0.6L1 2.8Z" fill="#fff6cc"/>
      <path d="M-4-2.4L-7 2.3H-9.5L-6.5-2.2ZM-12-1.9L-14.5 1.8H-17L-14.5-1.7ZM-20-1.3L-22 1.2H-24L-22-1.2Z" fill="#ecc95c"/>
    </g>
    <!-- tail flukes -->
    <path d="M19 0C24-2 28-6 30-11C34-8 35-3 33 1C36 2 40 5 41 9C35 10 29 8 24 5Z" fill="#937ee0"/>
    <path d="M30-11C34-8 35-3 33 1C31.5-2 30.5-6 30-11Z" fill="#b9a6f5"/>
    <!-- body: lavender, shaded below, a pale belly -->
    <g clip-path="url(#whale)">
      <rect x="-30" y="-15" width="56" height="28" fill="#937ee0"/>
      <use href="#body" transform="translate(-2 -2.5)" fill="#b9a6f5"/>
      <path d="M-29 3C-18 9.5 4 10 22 2V13H-29Z" fill="#ddd2ff"/>
      <g fill="#937ee0"><circle cx="0" cy="-9" r="1.8"/><circle cx="7" cy="-7" r="1.5"/><circle cx="13" cy="-4.5" r="1.6"/><circle cx="4" cy="-4.5" r="1.2"/><circle cx="-5" cy="-10.5" r="1.3"/></g>
    </g>
    <path d="M-24-6C-21-10-16-12-10-12.5" fill="none" stroke="#ddd2ff" stroke-width="2.4" stroke-linecap="round"/>
    <!-- a little flipper -->
    <path d="M-9 6C-7 11.5-2.5 14.5 2.5 14.5C1.5 10.5-1.5 7.5-5 5.5Z" fill="#937ee0"/>
    <!-- face -->
    <ellipse cx="-17" cy="-3" rx="2.6" ry="3.1" fill="#2b2330"/>
    <circle cx="-16" cy="-4.2" r="1.05" fill="#fff"/>
    <path d="M-25.5 3Q-22 6.5-17.5 4.5" fill="none" stroke="#2b2330" stroke-width="1.9" stroke-linecap="round"/>
    <ellipse cx="-12.5" cy="3" rx="3.2" ry="1.9" fill="#ff8fb8" opacity="0.6"/>
  </g>
  <!-- bubbles -->
  <g fill="#fff" opacity="0.85"><circle cx="38" cy="99" r="1.8"/><circle cx="34" cy="94" r="1.3"/><circle cx="36" cy="89" r="1"/></g>
</svg>
