# Codex in this repo, set up like Claude Code's auto mode: routine work runs without asking the user.
#
# - rules/commands.rules: the command allowlist (what Claude's permission allow list does).
# - approvals_reviewer = "auto_review": commands the rules mark "prompt" go to Codex's automatic reviewer, not to
#   your screen.
# - danger-full-access: commands run outside Codex's macOS sandbox. The sandbox blocks the window server, so
#   Playwright's WebKit and Chromium abort ("Playwright quit unexpectedly") whenever a browser command isn't a
#   plain allow-listed one (a redirect, pipe or heredoc makes it unmatched and sandboxed). The rules still gate
#   force-push, merging, PR creation, sudo, npm installs, rm and GitHub writes. scripts/qa-lib.mjs stops early
#   with a clear message if a browser is ever launched inside the sandbox (CODEX_SANDBOX=seatbelt).
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "danger-full-access"

# ElevenLabs sound effects (.agents/skills/sfx). Off by default; start a session with it on:
#   codex -c mcp_servers.elevenlabs.enabled=true
[mcp_servers.elevenlabs]
command = "bash"
args = ["scripts/mcp/elevenlabs.sh"]
enabled = false
startup_timeout_sec = 60
